:root{--bg:#F4F7F5;--card:#fff;--ink:#16333F;--muted:#5F7078;--line:#E3EAE5;--green:#1F7A4C;--blue:#1A5FAB;--amber:#E8862E;--red:#C0504D;--chip:#F0F5F2;--efblue:#2A3F80}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--eh-font,"Segoe UI",Tahoma,Arial,sans-serif);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}

header{background:linear-gradient(90deg,#2A3F80,#1F7A4C);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}

main{max-width:1380px;margin:0 auto;padding:16px 22px 40px}
.stamp{font-size:12px;color:var(--muted);margin:0 0 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stamp b{color:var(--ink)}
.kstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px}

.pg{display:inline-block;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap;cursor:help}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}.card h2::before{content:"";width:4px;height:18px;background:var(--green);border-radius:2px;display:inline-block}
.card .note{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}.tabs button{background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 14px;cursor:pointer;font:600 12.5px inherit}.tabs button.on{background:var(--efblue);border-color:var(--efblue);color:#fff}
.opp{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;padding:12px 0;border-top:1px solid var(--line)}.opp:first-of-type{border-top:0}
.chips{display:flex;flex-direction:column;gap:4px;min-width:96px}
.chip{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 8px;text-align:center;color:#fff;background:var(--muted)}
.chip.h-Now{background:var(--red)}.chip.h-2026{background:var(--amber)}.chip.h-2027\+{background:var(--blue)}.chip.o{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.opp .st{font-size:13.5px;line-height:1.55}.opp .ac{font-size:12.5px;color:var(--ink);margin-top:6px;padding:8px 10px;background:var(--chip);border-radius:8px;border-inline-start:3px solid var(--green)}.opp .ac b{color:var(--green)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}table.t th{text-align:start;font-size:11px;letter-spacing:.3px;color:var(--muted);text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}table.t tr:last-child td{border-bottom:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:960px){.g2{grid-template-columns:1fr}}
.tag{font-size:10px;font-weight:700;border-radius:5px;padding:2px 6px;color:#fff;display:inline-block}.tag.add{background:var(--green)}.tag.update{background:var(--blue)}.tag.identify{background:var(--amber)}
.gap{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}.gap:first-of-type{border-top:0}.gap .how{color:var(--muted);font-size:12px;max-width:340px;text-align:end}
.png{font:600 11px inherit;background:var(--chip);border:1px solid var(--line);color:var(--green);border-radius:7px;padding:5px 10px;cursor:pointer}
svg.pm text{font-family:var(--eh-font,"Segoe UI",Tahoma,Arial,sans-serif)}
.foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.6}
.xr td.num{text-align:center;font-variant-numeric:tabular-nums}.xr .zero{color:var(--red);font-weight:700}
.read{font-size:13px;padding:10px 12px;background:var(--chip);border-radius:8px;border-inline-start:3px solid var(--amber);margin-top:10px}
[dir=rtl] .gap .how{text-align:start}
</style>

ackage models for investment opportunities", "ar": "45 دراسة جاهزة لفرص مشاريع الشراكة في مختلف القطاعات؛ 54 نموذجاً لحزم الحوافز للفرص الاستثمارية"}, {"id": "f19", "page": 76, "cat": "ppp", "en": "Private-sector attraction opportunities: 25 at NCVC, 16 at NCW, 4 at MWAN", "ar": "فرص جذب استثمارات القطاع الخاص: 25 فرصة لدى المركز الوطني لتنمية الغطاء النباتي، 16 لدى المركز الوطني لتنمية الحياة الفطرية، 4 لدى المركز الوطني لإدارة النفايات"}, {"id": "f20", "page": 83, "cat": "ppp", "en": "Environmental investment opportunities by activity: 80 in waste, 33 in eco-tourism, 10 in environmental compliance", "ar": "عدد الفرص الاستثمارية البيئية حسب النشاط: 80 في النفايات، 33 في السياحة البيئية، 10 في الامتثال البيئي"}, {"id": "f21", "page": 81, "cat": "ppp", "en": "Economic studies 2025: 5 sectors studied; 8 priority investment areas out of 74 analysed; 123 opportunities reviewed in workshops (eco-tourism, waste, compliance); 10 seasonal opportunities supported; 45 feasibility studies (41 revenue, 4 sector); 54 financial and non-financial incentives linked", "ar": "الدراسات الاقتصادية 2025: 5 قطاعات؛ 8 مجالات ذات أولوية من أصل 74؛ 123 فرصة مستعرضة في ورش العمل (السياحة البيئية، إدارة النفايات، الامتثال البيئي)؛ 10 فرص موسمية مدعومة؛ 45 دراسة جدوى (41 إيرادية و4 قطاعية)؛ 54 حافزاً مالياً وغير مالي"}, {"id": "f22", "page": 79, "cat": "ppp", "en": "Privatisation: RFQ (request for qualification) issued for the environmental-inspection PPP under the national privatisation framework; RFP completed for the wildlife-shops monitoring and inspection PPP", "ar": "التخصيص: طرح وثيقة طلب التأهيل لمشروع الشراكة لخدمة التفتيش البيئي وفق الإطار الوطني للتخصيص؛ استكمال وثيقة طلب تقديم العروض لمشروع مراقبة وتفتيش محلات بيع الحيوانات الفطرية"}, {"id": "f23", "page": 79, "cat": "ppp", "en": "EXPRO approvals obtained for the air, water and soil monitoring projects and the environmental emergency-response project — readiness for execution phases", "ar": "الحصول على موافقات هيئة كفاءة الإنفاق وا  عمل من مجلس الإدارة"}, {"id": "f29", "page": 78, "cat": "fees", "en": "NCEC (environmental compliance): fee documents supported for 14 licences, 34 services and 4 clearances, in progress toward the required approvals with the non-oil revenue centre", "ar": "المركز الوطني للرقابة على الالتزام البيئي: دعم وثائق المقابلات المالية لـ 14 ترخيصاً و34 خدمة و4 فسوحات ضمن جهود الحصول على الموافقات مع المركز الوطني لتنمية الإيرادات غير النفطية"}, {"id": "f30", "page": 78, "cat": "fees", "en": "NCW (wildlife): fee documents for 12 licences and 8 permits prepared for submission to the non-oil revenue centre; work continues on setting fees from benchmarks and unit costs", "ar": "المركز الوطني لتنمية الحياة الفطرية: وثائق المقابلات المالية لـ 12 ترخيصاً و8 تصاريح تمهيداً لرفعها للمركز الوطني لتنمية الإيرادات غير النفطية؛ جارٍ تحديد المقابل المالي بناءً على المقارنات المعيارية والتكاليف"}, {"id": "f31", "page": 40, "cat": "fees", "en": "Fee-collection cycle for three centres shortened to twice monthly, so collected amounts can be invested", "ar": "تقليص عملية تحصيل المقابل المالي إلى فترتين شهرياً لثلاثة مراكز، لاستثمار المبالغ المحصَّلة"}, {"id": "f32", "page": 86, "cat": "shared", "en": "Shared-services programme for the national centres established under the Fund by ministerial decision 15216430 dated 1446/9/13; scope: HR, finance, procurement & contracts, IT, records", "ar": "تأسيس برنامج الخدمات المشتركة للمراكز الوطنية تحت مظلة الصندوق بقرار الوزير رقم 15216430 وتاريخ 1446/9/13هـ؛ النطاق: الموارد البشرية، المالية، المشتريات والعقود، تقنية المعلومات، الوثائق"}, {"id": "f33", "page": 87, "cat": "shared", "en": "12 of 33 approved services launched (36 %); SLAs signed for recruitment and procurement services with the centres; 22 workshops; 5 staff borrowed for recruitment, 7 for procurement", "ar": "إطلاق 12 خدمة من 33 معتمدة (36%)؛ توقيع اتفاقيات مستوى الخدمة للتوظيف والمشتريات بالمراكز؛ 22 ورشة عمل؛ استعارة 5 موظفين للاستقطاب و7 للمشتريات"}, {"id": "f34", "page": 87, "cat": "shared", "en": "KABI recruitment system 100 % live at NCM and NCEC, 50 % at NCVC (UAT stage); Oracle ERP support SLA signed with MEWA's IT agency for the centres; EPM budgeting system launched for the Fund and centres", "ar": "نظام KABI للتوظيف مفعّل 100% في المركز الوطني للأرصاد والمركز الوطني للرقابة على الالتزام البيئي، و50% في المركز الوطني لتنمية الغطاء النباتي (مرحلة UAT)؛ اتفاقية دعم Oracle ERP للمراكز مع وكالة تقنية المعلومات بالوزارة؛ إطلاق نظام EPM للتخطيط المالي"}, {"id": "f35", "page": 96, "cat": "shared", "en": "The Fund's own procurement cycle: 83 days average in 2025 vs 129 in 2024, against an EXPRO target of 130; 13 % cost saving on project contracts; 46 days saved", "ar": "متوسط مدة عمليات المشتريات والعقود بالصندوق: 83 يوماً في 2025 مقابل 129 في 2024 والمستهدف 130؛ وفر مالي 13% في عقود المشروعات؛ وفر زمني 46 يوماً"}, {"id": "f36", "page": 71, "cat": "grantees", "en": "Grant-funded private project — lead-acid battery recycling: 50,000 t of vehicle batteries to be diverted from landfill; lead and sulphuric acid recovered as industrial inputs", "ar": "مشروع قطاع خاص مموّل — إعادة تدوير البطاريات التالفة: 50 ألف طن من بطاريات المركبات ستُستبعد من المرادم؛ استرجاع الرصاص وحمض الكبريتيك كمدخلات صناعية"}, {"id": "f37", "page": 70, "cat": "grantees", "en": "Grant-funded private project — smart recycling stations, Riyadh phase 1: 3 stations, 1,000 t collected and sorted, 400 t CO₂ avoided; recycling rate target from under 5 % to over 35 %", "ar": "مشروع قطاع خاص مموّل — المحطات الذكية لإعادة التدوير، الرياض المرحلة الأولى: 3 محطات، 1,000 طن تجميع وفرز، 400 طن تخفيض انبعاثات؛ رفع معدلات إعادة التدوير من أقل من 5% إلى أكثر من 35%"}, {"id": "f38", "page": 71, "cat": "grantees", "en": "Grant-funded private project — animal-waste treatment facility in Al-Kharj using ABVRS thermal drying: 2,240 t/yr of slaughterhouse and fallen-stock waste into animal fat and meat-and-bone meal for feed and biofuel", "ar": "مشروع قطاع خاص مموّل — منشأة متخصصة لمعالجة النفايات الحيوانية في الخرج بتقنية ABVRS: 2,240 طناً سنوياً من نفايات المسالخ والحيوانات النافقة إلى دهون ومسحوق لحم وعظم للأعلاف والوقود الحيوي"}, {"id": "f39", "page": 61, "cat": "grantees", "en": "Beach protection and treatment initiative in Jeddah with MWAN, under the Governor's patronage: 2 beaches, 1 M m² surveyed by AI and drones, 8.4 t of waste collected and recycled, 5 waste types, 200+ volunteers, 210,000 annual visitors; Makkah Environmental Excellence Award", "ar": "مبادرة معالجة وحماية شواطئ المملكة في جدة مع المركز الوطني لإدارة النفايات برعاية محافظ جدة: شاطئان، مسح مليون م² بالذكاء الاصطناعي والدرون، جمع وتدوير +8.4 طن، 5 أنواع نفايات، +200 متطوع، 210 آلاف زائر سنوياً؛ جائزة مكة للتميز البيئي"}, {"id": "f40", "page": 66, "cat": "grantees", "en": "Green Factory initiative with NCEC: 100 target factories and 300 staff trained on compliance and circular-economy principles, supporting Council of Ministers resolution 533 on responsible industrial growth", "ar": "مبادرة المصنع الأخضر مع المركز الوطني للرقابة على الالتزام البيئي: 100 مصنع مستهدف و300 موظف للتدريب على الالتزام البيئي والاقتصاد الدائري، استجابةً لقرار مجلس الوزراء رقم 533"}, {"id": "f41", "page": 60, "cat": "grantees", "en": "Sedrah Hackathon with MEWA's Research & Innovation Agency: 300 participants, 3 winners, 86 environmental products and solutions (circular economy, air quality, climate, afforestation, desertification)", "ar": "هاكاثون سدرة مع وكالة البحث والابتكار بالوزارة: 300 مشارك، 3 فائزين، 86 منتجاً وحلاً بيئياً (الاقتصاد الدائري، جودة الهواء، التغير المناخي، التشجير، مكافحة التصحر)"}, {"id": "f42", "page": 47, "cat": "carbon", "en": "First carbon-investment strategy for the Fund, widened to MEWA's water and agriculture sectors; 20+ awareness rounds; 50+ additional candidate projects; SLAs with NCW and NCVC in review for pilot projects and credit issuance", "ar": "أول استراتيجية للاستثمار في الكربون، توسيع نطاقها لقطاعَي المياه والزراعة؛ أكثر من 20 جولة تعريفية؛ أكثر من 50 مشروعاً محتملاً إضافياً؛ اتفاقيات مستوى خدمات مع مركزَي الحياة الفطرية والغطاء النباتي قيد المراجعة للمشاريع التجريبية واعتماد الأرصدة"}, {"id": "f43", "page": 50, "cat": "carbon", "en": "Partnership with Saudi Electricity Company assessed jointly with NCVC to build a carbon-credit business model for the centre; MoU prepared with Soudah Development; coordination with National Water Company on water-sector credits", "ar": "تقييم فرص الشراكة مع الشركة السعودية للكهرباء بالتعاون مع المركز الوطني لتنمية الغطاء النباتي لإعداد نموذج عمل لأرصدة الكربون؛ إعداد مذكرة تفاهم مع شركة السودة للتطوير؛ التنسيق مع شركة المياه الوطنية"}, {"id": "f44", "page": 51, "cat": "carbon", "en": "Fund team participates in the national compliance-carbon-market study led by the national CDM committee; participation in GCOM nature-based initiatives; farm-to-credit study covering 300 farms with the Agricultural Development Fund", "ar": "مشاركة الصندوق في دراسة سوق الكربون الإلزامي بقيادة اللجنة الوطنية لآلية التنمية النظيفة؛ المشاركة في مبادرات GCOM القائمة على الطبيعة؛ حصر بيانات 300 مزرعة مع صندوق التنمية الزراعية لدراسة الأرصدة الزراعية"}, {"id": "f45", "page": 109, "cat": "esg", "en": "ESG programme with the national centres: readiness survey of the five centres, gap assessments, five centre-specific monitoring plans with KPIs, training workshop; 2024 ESG report, ESG library, GRI-based data collection, ESG handbook for SMEs, ESG scorecards covering 90+ initiatives", "ar": "برنامج المعايير البيئية والاجتماعية والحوكمة مع المراكز الوطنية: استبيان جاهزية المراكز الخمسة، دراسات تقييم الفجوات، خمس خطط رصد بمؤشرات أداء، ورشة تدريبية؛ تقرير 2024، مكتبة المعايير، جمع بيانات وفق GRI، كتيب للشركات الصغيرة والمتوسطة، بطاقات عمل تغطي أكثر من 90 مبادرة"}, {"id": "f46", "page": 108, "cat": "esg", "en": "Certifications: ISO/IEC 27001:2022 (information security), ISO 22301 (business continuity), ISO 31000 renewed (risk), ISO 27701 (privacy)", "ar": "شهادات: ISO/IEC 27001:2022 لأمن المعلومات، ISO 22301 لاستمرارية الأعمال، تجديد ISO 31000 لإدارة المخاطر، ISO 27701 لحماية البيانات"}, {"id": "f47", "page": 94, "cat": "people", "en": "136 staff at end-2025 (97 men, 39 women), 100 % Saudi; 104 trained in 2025 vs 68 in 2024; 116 training courses", "ar": "136 موظفاً وموظفة بنهاية 2025 (97 و39)، نسبة السعودة 100%؛ 104 متدربين في 2025 مقابل 68 في 2024؛ 116 دورة تدريبية"}, {"id": "f48", "page": 92, "cat": "people", "en": "Four sectors under the CEO: Investment & Treasury (Investment, Treasury, Impact Investments, Portfolio Impact); Strategy & Partnerships (Strategic Planning & Performance, Project Management, Incentives & Grants, Marketing & Communication, Economic Affairs); Shared Services (Human Capital, IT & Digital Transformation, Procurement & Contracts, Facilities); Finance (Accounting, Financial Planning & Budget, Financial Control & Reporting); plus Legal, Internal Audit, GRC & Cybersecurity, Board Secretariat, Executive Office", "ar": "أربعة قطاعات تحت الرئيس التنفيذي: الاستثمار والخزينة (الاستثمار، الخزينة، استثمارات الأثر، أثر المحافظ)؛ الاستراتيجية والشراكات (التخطيط الاستراتيجي وإدارة الأداء، إدارة المشاريع، الحوافز والمنح، التسويق والتواصل، الشؤون الاقتصادية)؛ الخدمات المشتركة (رأس المال البشري، تقنية المعلومات، المشتريات والعقود، المرافق)؛ المالية (المحاسبة، التخطيط المالي والميزانية، الرقابة المالية والتقارير)؛ إضافة إلى القانونية والمراجعة الداخلية والحوكمة والمخاطر والالتزام والأمن السيبراني وأمانة المجلس والمكتب التنفيذي"}, {"id": "f49", "page": 106, "cat": "digital", "en": "Digital-transformation score 78.64 % in 2025 (45.02 % in 2024) — 11th among financial entities and funds; 48 IT projects; bilingual chatbot launched; 160+ automated processes", "ar": "نتيجة قياس التحول الرقمي 78.64% في 2025 (45.02% في 2024) — المركز الحادي عشر بين الجهات المالية والصناديق؛ 48 مشروعاً تقنياً؛ إطلاق المساعد الذكي ثنائي اللغة؛ أكثر من 160 عملية مؤتمتة"}, {"id": "f50", "page": 98, "cat": "comms", "en": "Social reach: 99,691 followers (50,952 new), 3.22 M impressions, 502 posts; LinkedIn 81,422 followers; X 15,756; first issue of the bilingual magazine «رؤى بيئية»", "ar": "إجمالي المتابعين 99,691 (50,952 جدد)، 3.22 مليون ظهور، 502 منشور؛ لينكدإن 81,422 متابعاً؛ إكس 15,756؛ إطلاق عددين من مجلة «رؤى بيئية» بالعربية والإنجليزية"}], "opportunities": [{"group": "money", "horizon": "Now", "owner": "Finance", "page": 55, "en": "The loan-guarantee product is operational: four bank frameworks plus Kafalah, and MoF approval to issue direct and indirect guarantees. This is subsidised credit for environmental infrastructure — the category Al-Juhfah expansion or a new treatment line falls into.", "ar": "منتج ضمانات القروض أصبح فعلياً: أربع اتفاقيات بنكية إضافة إلى كفالة، وموافقة وزير المالية على إصدار الضمانات المباشرة وغير المباشرة. تمويل مدعوم للبنية التحتية البيئية — الفئة التي يقع فيها توسيع الجحفة أو أي خط معالجة جديد.", "action_en": "Finance to request the guarantee terms (ceiling, tenor, coverage %) from the Incentives & Grants department and from Riyad Bank's and SAB's environmental desks; put one named capex project against it.", "action_ar": "تطلب المالية شروط الضمان (الحد الأعلى، المدة، نسبة التغطية) من إدارة الحوافز والمنح ومن بنك الرياض والبنك السعودي الأول؛ وتُقابله بمشروع رأسمالي واحد مُسمّى."}, {"group": "money", "horizon": "Now", "owner": "Finance", "page": 17, "en": "Loan support — a non-refundable subsidy of the bank margin at set percentages — is a separate product from the guarantee, explicitly aimed at private investment in environmental infrastructure and services. It stacks with the guarantee.", "ar": "دعم القروض — دعم غير مسترد لهامش الربح البنكي بنسب محددة — منتج مستقل عن الضمان، وموجَّه صراحةً لاستثمارات القطاع الخاص في البنية التحتية البيئية وخدماتها. يمكن الجمع بينه وبين الضمان.", "action_en": "Ask the same department whether the two products can be combined on one facility and what percentage of the margin is covered.", "action_ar": "استفسار من الإدارة نفسها عن إمكانية الجمع بين المنتجَين على تسهيل واحد ونسبة الهامش المغطاة."}, {"group": "money", "horizon": "2026", "owner": "BD", "page": 46, "en": "PLAN — the impact-investment portfolio starts Q1 2026 with a stated thesis of local and international environmental start-ups and bringing international firms into the Kingdom. EH is not a start-up, but it is exactly the local operating partner an international entrant in hazardous-waste treatment would need.", "ar": "خطة — تنطلق محفظة استثمارات الأثر في الربع الأول من 2026 بأطروحة معلنة: الشركات البيئية الناشئة محلياً ودولياً واستقطاب الشركات العالمية. آفاق البيئة ليست شركة ناشئة، لكنها الشريك المحلي التشغيلي الذي تحتاجه أي شركة عالمية تدخل مجال معالجة النفايات الخطرة.", "action_en": "BD to register EH's profile with the Impact Investments department (Investment & Treasury sector) as a local partner for incoming international companies, and to ask SVC about the co-investment channel opened by their MoU.", "action_ar": "يسجّل تطوير الأعمال ملف الشركة لدى إدارة استثمارات الأثر (قطاع الاستثمار والخزينة) كشريك محلي للشركات العالمية الوافدة، ويستفسر من SVC عن قناة الاستثمار المشترك التي فتحتها مذكرة التفاهم."}, {"group": "money", "horizon": "2026", "owner": "Consulting/EIA", "page": 31, "en": "Grants are addressed to universities, research institutions and non-profits — not to companies directly. The route in is co-applying with a university on a research grant (the Fund funded a 5-project research fellowship, a seed-bank study and a coral-regrowth study in 2025).", "ar": "المنح موجَّهة للجامعات والمؤسسات البحثية والمنظمات غير الربحية — لا للشركات مباشرة. المدخل هو التقديم المشترك مع جامعة على منحة بحثية (موّل الصندوق في 2025 زمالة بحثية بخمسة أبحاث ودراسة بنك بذور ودراسة استعادة الشعاب المرجانية).", "action_en": "Consulting to propose one applied-research topic from EH's operating data (e.g. hazardous-waste characterisation in the Western Region) to KAU or KSU as a joint grant application through the portal.", "action_ar": "تقترح إدارة الاستشارات موضوعاً بحثياً تطبيقياً واحداً من بيانات التشغيل (مثل توصيف النفايات الخطرة في المنطقة الغربية) على جامعة الملك عبدالعزيز أو جامعة الملك سعود كطلب منحة مشترك عبر البوابة."}, {"group": "tenders", "horizon": "Now", "owner": "BD", "page": 79, "en": "The environmental-inspection PPP has an RFQ already issued under the national privatisation framework. Inspection of licensed facilities is squarely within EH's consulting licence scope — but a PPP of this size will be won by a consortium, not a single consultancy.", "ar": "مشروع الشراكة لخدمة التفتيش البيئي طُرحت له وثيقة طلب التأهيل فعلاً وفق الإطار الوطني للتخصيص. التفتيش على المنشآت المرخصة يقع في صميم نطاق ترخيص الاستشارات لدى آفاق البيئة — لكن شراكة بهذا الحجم يفوز بها تحالف لا شركة استشارية منفردة.", "action_en": "BD to obtain the RFQ from NCEC / the privatisation team this month, decide the consortium role (inspection operator vs. technical sub-contractor), and line up an international inspection-services partner before the RFP stage.", "action_ar": "يحصل تطوير الأعمال على وثيقة التأهيل من المركز الوطني للرقابة على الالتزام البيئي أو فريق التخصيص هذا الشهر، ويحدد دور الشركة في التحالف (مشغّل للتفتيش أم مقاول فني من الباطن)، ويرتّب شريكاً عالمياً في خدمات التفتيش قبل مرحلة طلب العروض."}, {"group": "tenders", "horizon": "2026", "owner": "Operations", "page": 79, "en": "EXPRO has approved the air, water and soil monitoring projects and the environmental emergency-response project for execution. Emergency response (spills, illegal dumping, industrial incidents) is a hazardous-waste operator's business; monitoring is a lab-and-field business EH can bid with a partner.", "ar": "وافقت هيئة كفاءة الإنفاق على مشاريع رصد جودة الهواء والمياه والتربة ومشروع الاستجابة للطوارئ البيئية للانتقال إلى التنفيذ. الاستجابة للطوارئ (الانسكابات، الردم غير النظامي، الحوادث الصناعية) عمل مشغّل نفايات خطرة؛ أما الرصد فعمل مختبرات وميدان يمكن المنافسة عليه مع شريك.", "action_en": "Operations to prepare a Western-Region emergency-response capability statement (fleet, storage, response times from Al-Juhfah) now, so it is ready when the tender documents appear on Etimad.", "action_ar": "تُعدّ العمليات بيان قدرات للاستجابة للطوارئ في المنطقة الغربية (الأسطول، التخزين، أزمنة الاستجابة من الجحفة) الآن، ليكون جاهزاً عند ظهور وثائق الطرح على اعتماد."}, {"group": "tenders", "horizon": "2026", "owner": "BD", "page": 83, "en": "80 of the 123 investment opportunities the Fund catalogued are in the waste activity — but only 4 are listed as MWAN private-sector attraction opportunities, so most of the 80 sit with the other centres or in the Fund's own studies. The list itself is the asset; the report does not publish it.", "ar": "80 من 123 فرصة استثمارية حصرها الصندوق في نشاط النفايات — لكن 4 فقط مدرجة كفرص جذب لدى المركز الوطني لإدارة النفايات، فأغلب الثمانين لدى المراكز الأخرى أو في دراسات الصندوق. القائمة نفسها هي الأصل؛ والتقرير لا ينشرها.", "action_en": "BD to request the waste-opportunity list and the 45 feasibility studies from the Economic Affairs department (Strategy & Partnerships sector) — the Fund presents these at investor workshops and chambers of commerce, so attendance at the next one is the low-cost route.", "action_ar": "يطلب تطوير الأعمال قائمة فرص النفايات ودراسات الجدوى الـ45 من إدارة الشؤون الاقتصادية (قطاع الاستراتيجية والشراكات) — يعرضها الصندوق في ورش المستثمرين والغرف التجارية، فحضور الورشة القادمة هو الطريق الأقل تكلفة."}, {"group": "tenders", "horizon": "Now", "owner": "BD", "page": 96, "en": "The Fund's own procurement runs at 83 days from tender to contract (2025), against an EXPRO ceiling of 130. EH's one tender to the Fund so far — ESG consulting for the national centres, bid 17/26 — was cancelled; the Fund then delivered the ESG programme with the centres itself (p. 109).", "ar": "دورة المشتريات في الصندوق نفسه 83 يوماً من الطرح إلى التعاقد (2025) مقابل حد أقصى 130 يوماً من هيئة كفاءة الإنفاق. المنافسة الوحيدة التي تقدمت لها آفاق البيئة لدى الصندوق — خدمات استشارية للمعايير البيئية والاجتماعية للمراكز، المنافسة 17/26 — أُلغيت؛ ثم نفّذ الصندوق برنامج المعايير مع المراكز بنفسه (ص 109).", "action_en": "Use 83 days as the planning parameter for any Fund tender. Ask the Strategic Planning & Performance department whether the ESG scope will be re-tendered for phase two (monitoring-plan implementation at the five centres).", "action_ar": "اعتماد 83 يوماً كمعيار تخطيط لأي منافسة لدى الصندوق. الاستفسار من إدارة التخطيط الاستراتيجي وإدارة الأداء عمّا إذا كان نطاق المعايير سيُطرح مجدداً للمرحلة الثانية (تنفيذ خطط الرصد في المراكز الخمسة)."}, {"group": "rules", "horizon": "2026", "owner": "Consulting/EIA", "page": 78, "en": "NCEC is moving 14 licences, 34 services and 4 clearances onto a fee schedule, and NCW 12 licences and 8 permits. Paid licensing raises the cost of non-compliance and makes clients want the application right the first time — that increases demand for permitting and EIA support, while price-sensitive clients will push back on consultancy fees to offset the new state fees.", "ar": "المركز الوطني للرقابة على الالتزام البيئي ينقل 14 ترخيصاً و34 خدمة و4 فسوحات إلى جدول مقابل مالي، والمركز الوطني لتنمية الحياة الفطرية 12 ترخيصاً و8 تصاريح. الترخيص المدفوع يرفع كلفة عدم الامتثال ويجعل العملاء يريدون طلباً صحيحاً من المرة الأولى — ما يزيد الطلب على خدمات التصاريح ودراسات الأثر، في حين سيضغط العملاء الحساسون للسعر على أتعاب الاستشارات لتعويض الرسوم الجديدة.", "action_en": "Consulting to map EH's permitting products to the 14 NCEC licences and 4 clearances once the schedule is published, and to price a fixed-fee 'licence pack' for repeat industrial clients.", "action_ar": "تُطابق إدارة الاستشارات منتجات التصاريح لدى الشركة مع التراخيص الـ14 والفسوحات الـ4 فور نشر الجدول، وتُسعّر «حزمة ترخيص» بأتعاب ثابتة للعملاء الصناعيين المتكررين."}, {"group": "rules", "horizon": "2026", "owner": "BD", "page": 87, "en": "WATCH — procurement for the five centres is being centralised under the Fund's shared-services programme: 12 of 33 services live (36 %), SLAs signed for procurement, staff seconded, Oracle ERP support in place. EH's 30 tenders to NCEC, NCVC, MWAN and MEWA are all still Pending or Cancelled in the tracker — none decided — which is consistent with procurement in transition.", "ar": "متابعة — يجري تركيز مشتريات المراكز الخمسة تحت برنامج الخدمات المشتركة في الصندوق: 12 من 33 خدمة فعّالة (36%)، اتفاقيات مستوى خدمة للمشتريات، موظفون منتدَبون، دعم Oracle ERP. منافسات آفاق البيئة الثلاثون لدى المراكز الوطنية والوزارة كلها ما تزال «قيد الانتظار» أو «ملغاة» في جدول العطاءات — لم يُحسم أي منها — وهو ما يتفق مع مرحلة انتقال المشتريات.", "action_en": "BD to confirm with each centre's procurement contact whether vendor registration and tender publication now run through the shared-services programme, and where; add the programme's Procurement & Contracts department to the stakeholder map as a Tier 1 contact.", "action_ar": "يتأكد تطوير الأعمال من جهة المشتريات في كل مركز عمّا إذا كان تسجيل الموردين ونشر المنافسات يمرّان الآن عبر برنامج الخدمات المشتركة، وأين؛ وتُضاف إدارة المشتريات والعقود في البرنامج إلى خريطة أصحاب المصلحة كجهة تواصل من الفئة الأولى."}, {"group": "rules", "horizon": "2027+", "owner": "BD", "page": 39, "en": "The five-year infrastructure portfolio for all five centres now has completed baselines and identified funding sources, and the medium-term financial plan to 2030 is done. This is the capital-project pipeline EH's clients will tender from for the rest of the decade.", "ar": "محفظة البنية التحتية الخمسية للمراكز الخمسة صار لها خطوط أساس مكتملة ومصادر تمويل محددة، واكتملت الخطة المالية متوسطة المدى حتى 2030. هذه هي محفظة المشاريع الرأسمالية التي ستطرح منها جهات آفاق البيئة العميلة منافساتها لبقية العقد.", "action_en": "Request the published portion of the portfolio (EXPRO-methodology baselines are typically shared with pre-qualified vendors) and align EH's 2027 pre-qualification calendar to it.", "action_ar": "طلب الجزء المنشور من المحفظة (خطوط الأساس وفق منهجية هيئة كفاءة الإنفاق تُشارَك عادةً مع الموردين المؤهلين) ومواءمة تقويم التأهيل المسبق لعام 2027 معه."}, {"group": "competitors", "horizon": "Now", "owner": "BD", "page": 71, "en": "Three private waste projects received Fund grants in 2025: a lead-acid battery recycler (50,000 t), a smart-recycling-station operator in Riyadh (3 stations, 1,000 t), and an ABVRS animal-waste plant in Al-Kharj (2,240 t/yr). The report does not name the companies. The Kharj plant overlaps EH's biogas / organic-waste interest; the battery recycler is a hazardous-waste peer.", "ar": "ثلاثة مشاريع نفايات خاصة تلقّت منحاً من الصندوق في 2025: معيد تدوير بطاريات الرصاص (50 ألف طن)، مشغّل محطات إعادة تدوير ذكية في الرياض (3 محطات، 1,000 طن)، ومنشأة معالجة نفايات حيوانية بتقنية ABVRS في الخرج (2,240 طناً سنوياً). التقرير لا يذكر أسماء الشركات. منشأة الخرج تتقاطع مع اهتمام الشركة بالغاز الحيوي والنفايات العضوية؛ ومعيد تدوير البطاريات نظير في النفايات الخطرة.", "action_en": "Identify the three grantees (Incentives & Grants publishes MoU signings on X and LinkedIn — the 18 agreements are there) and add them to the stakeholder map as competitors/partners with 'EF grantee 2025' in the notes.", "action_ar": "تحديد المستفيدين الثلاثة (تنشر إدارة الحوافز والمنح توقيعات مذكرات التفاهم على إكس ولينكدإن — الاتفاقيات الـ18 موجودة هناك) وإضافتهم إلى خريطة أصحاب المصلحة كمنافسين/شركاء مع ملاحظة «مستفيد من منح الصندوق 2025»."}, {"group": "competitors", "horizon": "Now", "owner": "BD", "page": 50, "en": "Saudi Electricity Company — EH's largest client by tenders and value — is building a carbon-credit business model with NCVC and the Fund. EH is not in that conversation, and it is adjacent to EH's landfill-gas and organic-waste work.", "ar": "الشركة السعودية للكهرباء — أكبر عملاء آفاق البيئة بعدد المنافسات وقيمتها — تبني نموذج عمل لأرصدة الكربون مع المركز الوطني لتنمية الغطاء النباتي والصندوق. آفاق البيئة ليست طرفاً في هذا الحوار، وهو ملاصق لعملها في غاز المرادم والنفايات العضوية.", "action_en": "BD to raise carbon-credit MRV (measurement, reporting, verification) for waste-sector methane with the SEC environment team at the next account meeting, positioned as a service EH can deliver under the Fund's carbon strategy.", "action_ar": "يطرح تطوير الأعمال خدمات القياس والإبلاغ والتحقق لأرصدة الكربون من ميثان قطاع النفايات مع فريق البيئة في الشركة السعودية للكهرباء في اجتماع الحساب القادم، بوصفها خدمة يمكن للشركة تقديمها ضمن استراتيجية الصندوق للكربون."}, {"group": "competitors", "horizon": "2026", "owner": "Training", "page": 66, "en": "The Green Factory initiative with NCEC targets 100 factories and 300 staff for compliance and circular-economy training. That is the audience of EH's Training Center, being trained by the regulator's own programme.", "ar": "مبادرة المصنع الأخضر مع المركز الوطني للرقابة على الالتزام البيئي تستهدف 100 مصنع و300 موظف للتدريب على الالتزام والاقتصاد الدائري. هذا هو جمهور مركز التدريب في آفاق البيئة، يتدرّب عبر برنامج الجهة الرقابية نفسها.", "action_en": "Training Center to offer itself to NCEC / the Fund as a delivery partner for the factory training (accredited environmental training is a listed EH service) rather than compete with the initiative.", "action_ar": "يعرض مركز التدريب نفسه على المركز الوطني للرقابة على الالتزام البيئي أو الصندوق كشريك تنفيذ لتدريب المصانع (التدريب البيئي المعتمد خدمة مدرجة لدى الشركة) بدلاً من منافسة المبادرة."}, {"group": "competitors", "horizon": "Now", "owner": "Operations", "page": 61, "en": "The Fund's flagship beach clean-up initiative ran in Jeddah with MWAN under the Governor's patronage — EH's home city — with 200+ volunteers and AI/drone surveys, and won the Makkah Environmental Excellence Award. EH was not a named partner.", "ar": "مبادرة حماية الشواطئ الرائدة نُفّذت في جدة مع المركز الوطني لإدارة النفايات برعاية محافظ جدة — مدينة آفاق البيئة — بأكثر من 200 متطوع ومسوحات بالذكاء الاصطناعي والدرون، ونالت جائزة مكة للتميز البيئي. لم تكن آفاق البيئة شريكاً مُسمّى.", "action_en": "Offer EH's licensed collection and disposal capacity for the next round (the 8.4 t of mixed waste needed a licensed disposal route) — a const OWN={'BD':'تطوير الأعمال','Finance':'المالية','Operations':'العمليات','Consulting/EIA':'الاستشارات/دراسات الأثر','Training':'التدريب'};
const HOR={'Now':'الآن','2026':'2026','2027+':'2027+'};
function setLang(l){LANG=l;try{localStorage.setItem('ef.lang',l)}catch(e){};document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';render();}
function setDark(d){DARK=d;document.body.classList.toggle('dark',d);}
window.addEventListener('message',e=>{const d=e.data||{};if(d.ehhub==='lang'&&(d.lang==='ar'||d.lang==='en'))setLang(d.lang);if(d.ehhub==='theme')setDark(d.theme==='dark');});
function render(){
 const m=EF.meta;
 $('title').textContent=L('Environment Fund — 2025 Annual Report: what it means for EH','صندوق البيئة — التقرير السنوي 2025: ماذا يعني لآفاق البيئة');
 $('sub').textContent=L(m.source_en,m.source_ar)+' · '+L('read as a map of where EH\'s clients\' money, rules and tenders will come from in 2026–2030','قراءةٌ لمصادر تمويل عملاء آفاق البيئة وقواعدهم ومنافساتهم في 2026–2030');
 document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
 $('stamp').innerHTML=`<span>${L('Source','المصدر')}: <b>${esc(L(m.source_en,m.source_ar))}</b> (${m.pages} ${L('pages','صفحة')})</span><span>·</span><span>${L('extracted','تاريخ الاستخراج')} <b dir="ltr">${m.extracted}</b></span><span>·</span><span>${L('bid-tracker cross-reference as of','مطابقة جدول العطاءات حتى')} <b dir="ltr">${m.tracker_xref_as_of}</b></span>`;
 $('kstrip').innerHTML=EF.headline.map(h=>`<div class="kc"><div class="v" dir="ltr">${esc(L(h.value,h.ar_value))}</div><div class="l">${esc(L(h.en,h.ar))} ${P(h.page)}</div></div>`).join('');
 // xref
 const x=EF.xref;
 $('xref').innerHTML=`<h2>${L("EH's own record with the Fund and the national centres","سجل آفاق البيئة مع الصندوق والمراكز الوطنية")}</h2><div class="note">${esc(L(x.note_en,x.note_ar))}</div>
 <table class="t xr"><thead><tr><th>${L('Client','الجهة')}</th><th style="text-align:center">${L('Tenders','منافسات')}</th><th style="text-align:center">${L('Value (SAR)','القيمة (ريال)')}</th><th style="text-align:center">${L('Pending','قيد الانتظار')}</th><th style="text-align:center">${L('Cancelled','ملغاة')}</th><th style="text-align:center">${L('Decided','محسومة')}</th><th>${L('Note','ملاحظة')}</th></tr></thead><tbody>
 ${x.rows.map(r=>`<tr><td><b>${esc(L(r.client_en,r.client_ar))}</b></td><td class="num">${r.tenders}</td><td class="num" dir="ltr">${r.value?fmtM(r.value):'—'}</td><td class="num">${r.pending}</td><td class="num">${r.cancelled}</td><td class="num ${r.tenders&&!r.decided?'zero':''}">${r.decided}</td><td style="color:var(--muted)">${esc(L(r.note_en,r.note_ar))}</td></tr>`).join('')}</tbody></table>
 <div class="read">${esc(L(x.reading_en,x.reading_ar))} ${P(87)}</div>`;
 // opportunities
 $('h-opp').textContent=L('What it means for EH — filed by question, tagged by horizon and owner','ماذا يعني لآفاق البيئة — مصنَّف بحسب السؤال، ومعلَّم بالأفق والجهة المسؤولة');
 const G=[['money',L('Money EH can access','تمويل يمكن لآفاق البيئة الوصول إليه')],['tenders',L('Tenders EH will see','منافسات ستراها آفاق البيئة')],['rules',L('Rules and costs that shift','قواعد وتكاليف تتغير')],['competitors',L('Competitors and partners the Fund is funding','منافسون وشركاء يموّلهم الصندوق')]];
 $('tabs').innerHTML=G.map(([k,l])=>`<button class="${k===GROUP?'on':''}" onclick="GROUP='${k}';render()">${l} <span style="opacity:.7">(${EF.opportunities.filter(o=>o.group===k).length})</span></button>`).join('');
 $('opps').innerHTML=EF.opportunities.filter(o=>o.group===GROUP).map(o=>`<div class="opp"><div class="chips"><span class="chip h-${o.horizon}">${esc(L(o.horizon,HOR[o.horizon]||o.horizon))}</span><span class="chip o">${esc(L(o.owner,OWN[o.owner]||o.owner))}</span>${P(o.page)}</div><div><div class="st">${esc(L(o.en,o.ar))}</div><div class="ac"><b>${L('Action','الإجراء')}:</b> ${esc(L(o.action_en,o.action_ar))}</div></div></div>`).join('');
 // programme map
 $('pmwrap').innerHTML=programmeMap();
 // stakeholders + events
 $('stk').innerHTML=`<h2>${L('Stakeholders to add or update in the map','أصحاب مصلحة لإضافتهم أو تحديثهم في الخريطة')}</h2><div class="note">${L('Field values ready to paste into the stakeholder workbook.','قيم الحقول جاهزة للنقل إلى مصنّف أصحاب المصلحة.')}</div>
 <table class="t"><thead><tr><th></th><th>${L('Name','الاسم')}</th><th>${L('Category · Tier','الفئة · المستوى')}</th><th>${L('Role for EH','الدور بالنسبة لآفاق البيئة')}</th><th></th></tr></thead><tbody>
 ${EF.stakeholders.map(s=>`<tr><td><span class="tag ${s.status}">${esc(L({add:'Add',update:'Update',identify:'Identify'}[s.status],{add:'إضافة',update:'تحديث',identify:'تحديد'}[s.status]))}</span></td><td><b dir="auto">${esc(L(s.name_en,s.name_ar))}</b><div style="color:var(--muted);font-size:11.5px" dir="auto">${esc(L(s.name_ar,s.name_en))}</div></td><td style="white-space:nowrap">${esc(s.cat)} · ${esc(s.tier)}</td><td>${esc(L(s.role_en,s.role_ar))}${s.notes_en?`<div style="color:var(--muted);font-size:11.5px;margin-top:3px">${esc(L(s.notes_en,s.notes_ar))}</div>`:''}</td><td>${P(s.page)}</td></tr>`).join('')}</tbody></table>`;
 $('evt').innerHTML=`<h2>${L('Events calendar for BD attendance','تقويم الفعاليات لحضور تطوير الأعمال')}</h2><div class="note">${L('Where the Fund shows up, and why it matters for EH.','أين يظهر الصندوق، ولماذا يهم آفاق البيئة.')}</div>
 <table class="t"><thead><tr><th>${L('Event','الفعالية')}</th><th>${L('When','التوقيت')}</th><th>${L('Why go','لماذا الحضور')}</th><th></th></tr></thead><tbody>
 ${EF.events.map(e=>`<tr><td><b>${esc(L(e.en,e.ar))}</b></td><td style="white-space:nowrap;color:var(--muted)">${esc(L(e.when_en,e.when_ar))}</td><td>${esc(L(e.why_en,e.why_ar))}</td><td>${P(e.page)}</td></tr>`).join('')}</tbody></table>`;
 $('gaps').innerHTML=`<h2>${L("What we don't know","ما لا نعرفه")}</h2><div class="note">${L('The report does not say — and how to find out.','لا يذكره التقرير — وكيف نعرفه.')}</div>${EF.gaps.map(g=>`<div class="gap"><div>${esc(L(g.en,g.ar))}</div><div class="how">→ ${esc(L(g.how_en,g.how_ar))}</div></div>`).join('')}`;
 // facts ledger (collapsible)
 $('facts').innerHTML=`<summary style="cursor:pointer;font-weight:700">${L('Extraction ledger — every figure with its page','سجل الاستخراج — كل رقم بصفحته')} (${EF.facts.length})</summary><table class="t" style="margin-top:10px"><tbody>${EF.facts.map(f=>`<tr><td style="white-space:nowrap">${P(f.page)}</td><td style="color:var(--muted);white-space:nowrap">${esc(f.cat)}</td><td>${esc(L(f.en,f.ar))}</td></tr>`).join('')}</tbody></table>`;
 $('foot').innerHTML=esc(L(m.method_en,m.method_ar));
}
function programmeMap(){
 const pm=EF.programme_map, W=1100, rowH=40, top=56;
 const prods=pm.products, cen=pm.centres, ehl=pm.eh_lines;
 const H=top+Math.max(prods.length,cen.length,ehl.length)*rowH+30;
 const xP=40,xC=W/2-40,xE=W-300, bw=[250,120,200];
 const yP=i=>top+i*rowH+ (Math.max(prods.length,cen.length,ehl.length)-prods.length)*rowH/2;
 const yC=i=>top+i*rowH+(Math.max(prods.length,cen.length,ehl.length)-cen.length)*rowH/2;
 const yE=i=>top+i*rowH+(Math.max(prods.length,cen.length,ehl.length)-ehl.length)*rowH/2;
 const col={grants:'#1F7A4C',loansup:'#2A3F80',guar:'#1A5FAB',impact:'#7B4FA6',ppp:'#E8862E',fees:'#C0504D',shared:'#5F7078',carbon:'#2E9E8E'};
 let s=`<svg id="ex-pm" class="pm" viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" dir="ltr">
 <text x="${xP}" y="24" font-size="15" font-weight="800" fill="${DARK?'#E6EDF1':'#16333F'}">${esc(L("Environment Fund programmes → national centres they touch → EH service lines they concern","برامج الصندوق ← المراكز الوطنية التي تمسّها ← خطوط خدمات آفاق البيئة المعنية"))}</text>
 <text x="${xP}" y="42" font-size="11" fill="#6B7C86">${esc(L('Source: Annual Report 2025, pages cited on each programme · a line means the report links them explicitly','المصدر: التقرير السنوي 2025، الصفحات مذكورة على كل برنامج · الخط يعني أن التقرير يربطهما صراحةً'))}</text>`;
 prods.forEach((p,i)=>{p.centres.forEach(c=>{const j=cen.findIndex(x=>x[0]===c);if(j<0)return;s+=`<path d="M${xP+bw[0]} ${yP(i)+14} C ${xP+bw[0]+90} ${yP(i)+14}, ${xC-90} ${yC(j)+14}, ${xC} ${yC(j)+14}" stroke="${col[p.id]}" stroke-width="2" fill="none" opacity=".55"/>`;});
  p.eh.forEach(e=>{const j=ehl.findIndex(x=>x[0]===e);if(j<0)return;const x0=p.centres.length?xC+bw[1]:xP+bw[0];const y0=p.centres.length?yC(cen.findIndex(x=>x[0]===p.centres[0]))+14:yP(i)+14;s+=`<path d="M${x0} ${y0} C ${x0+90} ${y0}, ${xE-90} ${yE(j)+14}, ${xE} ${yE(j)+14}" stroke="${col[p.id]}" stroke-width="2" fill="none" opacity=".55"/>`;});});
 prods.forEach((p,i)=>{s+=`<rect x="${xP}" y="${yP(i)}" width="${bw[0]}" height="28" rx="6" fill="${col[p.id]}"/><text x="${xP+10}" y="${yP(i)+19}" font-size="12.5" font-weight="700" fill="#fff">${esc(L(p.en,p.ar))}</text><text x="${xP+bw[0]-8}" y="${yP(i)+19}" font-size="10" fill="#fff" text-anchor="end" opacity=".85">${L('p.','ص')} ${p.page}</text>`;});
 cen.forEach((c,i)=>{s+=`<rect x="${xC}" y="${yC(i)}" width="${bw[1]}" height="28" rx="6" fill="${DARK?'#1E2830':'#F0F5F2'}" stroke="${DARK?'#3A4B55':'#DCE8DF'}"/><text x="${xC+bw[1]/2}" y="${yC(i)+18}" font-size="12" font-weight="700" fill="${DARK?'#E6EDF1':'#16333F'}" text-anchor="middle">${esc(L(c[0],c[1]))}</text>`;});
 ehl.forEach((e,i)=>{s+=`<rect x="${xE}" y="${yE(i)}" width="${bw[2]}" height="28" rx="6" fill="${DARK?'#1E2830':'#fff'}" stroke="#1F7A4C" stroke-width="1.5"/><text x="${xE+10}" y="${yE(i)+18}" font-size="12.5" font-weight="700" fill="${DARK?'#E6EDF1':'#1F7A4C'}">EH · ${esc(L(e[0],e[1]))}</text>`;});
 s+='</svg>';
 return `<div class="hd"><h2>${L('Programme map — what touches whom','خريطة البرامج — ما يمسّ من')}</h2><button class="png" onclick="exPNG('ex-pm','programme_map')">${L('Export PNG','تصدير PNG')}</button></div><div class="note">${L('Loan support, guarantees and impact investment reach EH directly; grants, PPP, fees and shared services reach EH through the centres it is licensed by and bids to.','دعم القروض والضمانات واستثمارات الأثر تصل آفاق البيئة مباشرة؛ أما المنح والتخصيص والمقابلات المالية والخدمات المشتركة فتصلها عبر المراكز التي ترخّصها وتتقدم لمنافساتها.')}</div>${s}`;
}
function exPNG(id,name){const svg=$(id);if(!svg)return;const cl=svg.cloneNode(true);const vb=svg.viewBox.baseVal;cl.setAttribute('width',vb.width);cl.setAttribute('height',vb.height);cl.removeAttribute('class');
 cl.querySelectorAll('text').forEach(t=>t.setAttribute('font-family',"'Segoe UI',Tahoma,Arial,sans-serif"));
 const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');bg.setAttribute('width',vb.width);bg.setAttribute('height',vb.height);bg.setAttribute('fill',DARK?'#151C21':'#fff');cl.insertBefore(bg,cl.firstChild);
 const xml=new XMLSerializer().serializeToString(cl),img=new Image(),S=2.5;img.onload=()=>{const c=document.createElement('canvas');c.width=vb.width*S;c.height=vb.height*S;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const a=document.createElement('a');a.download=`EH_EnvFund2025_${name}_${LANG}_${new Date().toISOString().slice(0,10)}.png`;a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);}
document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';render();
</script>
<script src="eh-shared.js" defer></script>
