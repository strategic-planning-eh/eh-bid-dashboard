# Rebuilds the EH Bid dashboard every hour from the live bid files and publishes
# the full Strategic Intelligence Hub (bids + stakeholder map + client bubbles).
name: Update Bid Dashboard

on:
  schedule:
    - cron: '0 * * * *'        # every hour, on the hour (UTC)
  workflow_dispatch:
    inputs:
      changelog_init:
        description: "First-ever What's New run (no previous snapshot exists). Leave false normally."
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Write the robot key from the secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > pipeline/service_account.json

      - name: Rebuild the dashboard
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          SHEET_ID_2025: ${{ vars.SHEET_ID_2025 }}
          SHEET_ID_2026: ${{ vars.SHEET_ID_2026 }}
        run: python pipeline/run_pipeline.py

      - name: Prepare the published site (hub + all three apps)
        run: |
          mkdir -p site
          cp hub/EH_Hub.html site/index.html
          cp pipeline/EH_Bid_Analysis.html site/EH_Bid_Analysis_CURRENT.html
          cp hub/EH_Stakeholder_Map_CURRENT.html site/
          cp hub/EH_Client_Bubble_Map_CURRENT.html site/
          cp hub/vision2030_dashboard.html site/ 2>/dev/null || true
          cp hub/saudi_fiscal_monitor_2026.html site/ 2>/dev/null || true
          cp hub/eh_news_intelligence.html site/ 2>/dev/null || true
          cp hub/pif_intelligence_hub.html site/ 2>/dev/null || true
          cp hub/pif_strategy_2026_2030.html site/ 2>/dev/null || true
          cp hub/eh-shared.css hub/eh-shared.js hub/eh-ar-dashboard.js site/ 2>/dev/null || true
          cp -r hub/vendor site/vendor 2>/dev/null || true
          echo "{\"built\":\"$(TZ='Asia/Riyadh' date +'%d %b %Y, %H:%M (KSA)')\",\"built_iso\":\"$(TZ='Asia/Riyadh' date +'%Y-%m-%dT%H:%M+03:00')\"}" > site/build_info.json
      - name: Detect changes, update changelog, notify
        working-directory: pipeline
        env:
          SITE_URL: https://strategic-planning-eh.github.io/eh-bid-dashboard
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python notify_and_log.py || true
          cp state.json ../site/state.json 2>/dev/null || true
          # the bid-digest log keeps its own name; site/changelog.json is the weekly What's New (built below)
          cp changelog.json ../site/bid_digest.json 2>/dev/null || true

      # ---------- What's New: previous dataset snapshot (artefact of the last successful run) ----------
      - name: Restore previous dataset snapshot
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: update-dashboard.yml
          workflow_conclusion: success
          name: whatsnew-snapshot
          path: pipeline/snapshot_prev
          search_artifacts: true

      - name: Restore previous published changelog (retention across runs)
        run: |
          curl -fsSL "$SITE_URL/changelog.json" -o pipeline/changelog_prev.json && cp pipeline/changelog_prev.json site/changelog.json || cp pipeline/changelog.seed.json site/changelog.json 2>/dev/null || echo "no published changelog yet"
        env:
          SITE_URL: https://strategic-planning-eh.github.io/eh-bid-dashboard

      - name: Build What's New (diff snapshot, parse CHANGES.md)
        run: |
          INIT=""
          if [ "${{ github.event.inputs.changelog_init }}" = "true" ]; then INIT="--init"; fi
          if [ ! -f pipeline/snapshot_prev/snapshot.json ] && [ -f pipeline/snapshots/snapshot.json ]; then
            mkdir -p pipeline/snapshot_prev && cp pipeline/snapshots/snapshot.json pipeline/snapshot_prev/
          fi
          if [ ! -f pipeline/snapshot_prev/snapshot.json ]; then INIT="--init"; echo "no snapshot found — initialising (data diff empty this week only)"; fi
          python pipeline/build_changelog.py --hub site --prev pipeline/snapshot_prev --changes pipeline/CHANGES.md \
            --out site/changelog.json --snapshot-out pipeline/snapshot_new $INIT

      - name: Keep the new snapshot as an artefact (next week's diff)
        uses: actions/upload-artifact@v4
        with:
          name: whatsnew-snapshot
          path: pipeline/snapshot_new/snapshot.json
          retention-days: 90
          overwrite: true

      # ---------- Visual regression gate (roadmap X7): every page, EN + AR, must render with painted charts and no script errors,
      #            and must not have changed by more than 6 % of pixels since the last good build (baseline = artefact) ----------
      - name: Restore visual baseline
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: update-dashboard.yml
          workflow_conclusion: success
          name: visual-baseline
          path: pipeline/visual_baseline
          search_artifacts: true

      - name: Visual regression check
        run: |
          pip install playwright pillow >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
          python pipeline/visual_check.py --site site --baseline pipeline/visual_baseline --out pipeline/visual_out

      - name: Keep screenshots (always) and the new baseline (on pass)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screens
          path: |
            pipeline/visual_out
            pipeline/visual_baseline
          retention-days: 30
      - name: Update visual baseline artefact
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline
          path: pipeline/visual_baseline
          retention-days: 90
          overwrite: true

      - name: Package the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
