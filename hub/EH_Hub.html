<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Environmental Horizons — Strategic Intelligence Hub</title>
<style>
:root{--green:#2BAE68;--blue:#027DC3;--ink:#1C2B33;--line:#E2E9EE}
*{box-sizing:border-box;margin:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F5F8FA;height:100vh;display:flex;flex-direction:column}
header{background:#fff;border-bottom:3px solid var(--green);padding:10px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;color:var(--ink)}
.brand span{color:var(--green)}
.tabs{display:flex;gap:6px;margin-inline-start:auto}
.tab{padding:8px 18px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:13.5px;font-weight:600;color:#51626D}
.tab.on{background:var(--green);border-color:var(--green);color:#fff}
.tab:hover:not(.on){background:#EEF5F0}
main{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
iframe.on{display:block}
.foot{font-size:11px;color:#5A6B76;padding:4px 22px;background:#fff;border-top:1px solid var(--line)}
:focus-visible{outline:2px solid #027DC3;outline-offset:2px}
.tab[aria-pressed="true"]{}
</style>
</head>
<body>
<header>
  <div class="brand">Environmental Horizons — <span>Strategic Intelligence Hub</span></div>
  <div class="tabs">
    <button class="tab on" data-f="stake" aria-pressed="true" onclick="go(this)">🗺️ Stakeholder &amp; Competitive Map</button>
    <button class="tab" data-f="bids" aria-pressed="false" onclick="go(this)">📊 Bid &amp; Tender Intelligence</button>
    <button class="tab" data-f="bubbles" aria-pressed="false" onclick="go(this)">🫧 Client Portfolio Bubbles</button>
  </div>
</header>
<main>
  <iframe id="f-stake" title="Stakeholder and competitive map" class="on" src="EH_Stakeholder_Map_CURRENT.html" loading="eager"></iframe>
  <iframe id="f-bids" title="Bid and tender intelligence" data-src="EH_Bid_Analysis_CURRENT.html" loading="lazy"></iframe>
  <iframe id="f-bubbles" title="Client portfolio bubble chart" data-src="EH_Client_Bubble_Map_CURRENT.html" loading="lazy"></iframe>
</main>
<div class="foot">One link · three integrated views · bid data auto-refreshes from the live tracker via GitHub Actions · stakeholder &amp; client data rebuilt from source workbooks on commit</div>
<script>
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('iframe').forEach(function(f){
    f.addEventListener('error',function(){hubErr(f)});
    f.addEventListener('load',function(){try{ if(f.contentDocument&&!f.contentDocument.body.childElementCount) hubErr(f);}catch(e){/* cross-origin: hosted fine */}});
  });
});
function hubErr(f){
  var d=document.createElement('div');
  d.style.cssText='position:absolute;inset:0;display:grid;place-items:center;background:#fff;font:600 14px system-ui;color:#B23A3A;z-index:5';
  d.textContent='This view failed to load — check that its file is published in the site build.';
  f.parentElement.appendChild(d); f.addEventListener('load',function(){d.remove();},{once:true});
}
function go(btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===btn));
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',t===btn?'true':'false'));
  document.querySelectorAll('iframe').forEach(f=>{
    const on = f.id==='f-'+btn.dataset.f;
    if(on && !f.src && f.dataset.src) f.src=f.dataset.src;   // lazy-load heavy apps on first open
    f.classList.toggle('on',on);
  });
}
</script>
</body>
</html>
