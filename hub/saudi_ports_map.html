<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Saudi Ports Intelligence Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>@font-face{font-family:"IBM Plex Sans Arabic";src:url("vendor/fonts/plex-sans-arabic-400.woff2") format("woff2");font-weight:300 400;font-display:swap}@font-face{font-family:"IBM Plex Sans Arabic";src:url("vendor/fonts/plex-sans-arabic-500.woff2") format("woff2");font-weight:500;font-display:swap}@font-face{font-family:"IBM Plex Sans Arabic";src:url("vendor/fonts/plex-sans-arabic-600.woff2") format("woff2");font-weight:600 700;font-display:swap}</style>
<style>
/* Layout: the chart is the page. A fixed top band (brand + KPI strip), the SVG sea-chart filling the viewport,
   a filter/list rail floating left, a tabbed port dossier floating right; on phones both rails become bottom sheets. */
:root{
  --sea:#dbe7ee; --sea-deep:#c3d6e1; --land:#efe8d8; --land-edge:#cdbfa2; --border:#b8a98a;
  --panel:rgba(255,255,255,.92); --panel-solid:#ffffff; --line:#d9dfe3; --fg:#17232c; --muted:#5f6c76; --faint:#8b969e;
  --blue:#0072bb; --green:#54ab5d; --blue-ink:#005a95; --green-ink:#3f8f48; --grey:#9aa5ad;
  --warn:#c98a1a; --bad:#c2452d; --ok:#2f8f5b; --chip:#eef2f4; --focus:#0072bb;
  --bg:var(--sea);
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
  --r:10px; --shadow:0 10px 30px rgba(20,40,55,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sea:#0b1821; --sea-deep:#071118; --land:#27343c; --land-edge:#45535e; --border:#5c6b77;
  --panel:rgba(18,27,33,.9); --panel-solid:#141d23; --line:#2a353d; --fg:#e7edf1; --muted:#9fadb6; --faint:#6f7d87;
  --blue:#4ea8e6; --green:#6fc77c; --blue-ink:#7cc0f0; --green-ink:#8fd99a; --grey:#6e7a83;
  --warn:#e0a63b; --bad:#e26b55; --ok:#4fbf83; --chip:#1f2a31; --focus:#7cc0f0; --bg:var(--sea);
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{
  --sea:#0b1821; --sea-deep:#071118; --land:#27343c; --land-edge:#45535e; --border:#5c6b77;
  --panel:rgba(18,27,33,.9); --panel-solid:#141d23; --line:#2a353d; --fg:#e7edf1; --muted:#9fadb6; --faint:#6f7d87;
  --blue:#4ea8e6; --green:#6fc77c; --blue-ink:#7cc0f0; --green-ink:#8fd99a; --grey:#6e7a83;
  --warn:#e0a63b; --bad:#e26b55; --ok:#4fbf83; --chip:#1f2a31; --focus:#7cc0f0; --bg:var(--sea);
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel-solid)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
a{color:var(--blue-ink)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* top band */
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;background:var(--panel-solid);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;min-height:52px;padding-block:6px;flex-wrap:wrap}
.brand>div:nth-child(2){min-width:0;flex:1 1 240px}
.brand img{height:34px;width:34px;border-radius:6px;object-fit:cover}
.brand h1{font-size:16px;letter-spacing:.01em}
.brand .sub{font-size:12px;color:var(--muted);font-weight:400}
.brand .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.kpis{display:flex;gap:8px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.kpis::-webkit-scrollbar{display:none}
.kpi{flex:0 0 auto;min-width:128px;padding:6px 10px;border-inline-start:3px solid var(--blue);background:var(--chip);border-radius:4px}
.kpi.g{border-color:var(--green)} .kpi.n{border-color:var(--grey)}
.kpi b{display:block;font-size:17px;font-weight:600;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi small{display:block;font-size:10.5px;color:var(--faint)}

/* map */
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.land{fill:var(--land);stroke:var(--land-edge);stroke-width:.6;vector-effect:non-scaling-stroke}
.ksa{fill:var(--land);stroke:var(--border);stroke-width:1.2;vector-effect:non-scaling-stroke}
.lane{fill:none;stroke:var(--blue);stroke-opacity:.25;stroke-width:1;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:var(--fg);stroke-opacity:.07;stroke-width:.5;vector-effect:non-scaling-stroke}
.sea-label{fill:var(--fg);fill-opacity:.35;letter-spacing:.14em;font-weight:500;pointer-events:none}
.plabel.hid{display:none}
.plabel{fill:var(--fg);font-weight:500;paint-order:stroke;stroke:var(--sea);stroke-linejoin:round;pointer-events:none}
.mk{cursor:pointer}
.mk .core{stroke:var(--panel-solid);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mk.t3 .core{fill-opacity:.18;stroke-dasharray:3 2;stroke-width:1.6}
.mk .halo{fill:none;stroke-width:2;opacity:0;vector-effect:non-scaling-stroke}
.mk.sel .halo{opacity:.9} .mk:hover .halo{opacity:.6}
.mk.dim{opacity:.18;pointer-events:none}
.zoom{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:25;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel-solid);font-size:18px;line-height:1}
.legend{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:25;background:var(--panel);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;font-size:11.5px;color:var(--muted);display:grid;gap:4px}
.legend .row{display:flex;align-items:center;gap:8px}
.legend svg{width:16px;height:16px;flex:none}
.sw{width:10px;height:10px;border-radius:50%;flex:none}

/* floating rails */
.rail{position:fixed;z-index:20;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.rail-l{left:max(16px,env(safe-area-inset-left,0px));width:292px;top:calc(var(--topH) + 12px);max-height:calc(100% - var(--topH) - 184px)} /* EH hub: leave room for the legend so the filter panel scrolls instead of sliding under it in the hub's shorter frame */
.rail-r{right:max(16px,env(safe-area-inset-right,0px));width:min(440px,calc(100% - 32px));top:calc(var(--topH) + 12px);max-height:calc(100% - var(--topH) - 24px)}
.rail header{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.rail header h2{font-size:13px;font-weight:600;flex:1;min-width:0}
.rail .body{overflow:auto;padding:10px 12px;min-height:0;-webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent);mask-image:linear-gradient(#000 calc(100% - 22px),transparent)}
.iconbtn{border:1px solid var(--line);background:none;border-radius:6px;width:26px;height:26px;display:grid;place-items:center;color:var(--muted)}
.filters{display:grid;gap:8px}
.filters label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--panel-solid);border-color:var(--fg)}
.search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-solid)}
.plist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}
.plist li button{width:100%;text-align:start;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center}
.plist li button:hover{background:var(--chip)} .plist li button[aria-current="true"]{border-color:var(--blue);background:var(--chip)}
.plist .n{font-size:12.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .m{font-size:11px;color:var(--muted)}
.plist svg{width:14px;height:14px}
.count{font-size:11.5px;color:var(--muted);margin-top:8px}

/* dossier */
.dossier header{align-items:flex-start;padding:12px 14px 0;border:0;display:block}
.dossier .ttl{display:flex;gap:10px;align-items:flex-start}
.dossier .ttl h2{font-size:17px;line-height:1.2;flex:1}
.dossier .ar{font-size:13px;color:var(--muted);font-weight:400;display:block;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 10px}
.badge{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.badge.opp-High{background:var(--green);color:#fff;border-color:transparent} .badge.opp-Medium{background:var(--blue);color:#fff;border-color:transparent} .badge.opp-Low{background:var(--grey);color:#fff;border-color:transparent}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:7px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--blue);font-weight:600}
.dossier .body{padding:12px 14px 20px}
.sec{margin-bottom:16px}
.sec h3{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stat4{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.stat4 div{background:var(--chip);border-radius:6px;padding:7px 9px}
.stat4 b{display:block;font-size:16px;font-weight:600} .stat4 span{font-size:11px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:start;font-weight:600;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line);font-size:11.5px}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tblwrap{overflow-x:auto}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.won{background:var(--ok);color:#fff}.pill.lost{background:var(--bad);color:#fff}.pill.submitted{background:var(--blue);color:#fff}.pill.pending{background:var(--warn);color:#fff}.pill.cancelled,.pill.declined{background:var(--grey);color:#fff}
.note{font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:6px;padding:8px 10px;margin-top:6px}
.note.opp{border-inline-start:3px solid var(--green);color:var(--fg)}
.cite{font-size:10.5px;color:var(--blue-ink);text-decoration:none;cursor:pointer;margin-inline-start:3px}
.src{font-size:12px;display:grid;gap:6px}
.src li{list-style:none;overflow-wrap:anywhere}
.src ol{padding:0;margin:0}
.src .id{color:var(--muted);font-weight:600;margin-inline-end:6px}
.gaps li{font-size:12px;color:var(--muted);margin-bottom:4px}
.chart{width:100%;height:auto;display:block;margin-top:4px}
.chart text{font-size:10px;fill:var(--muted)} .chart .bar{fill:var(--blue)} .chart .bar.t{fill:var(--green)} .chart .ax{stroke:var(--line)}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);max-width:240px}
.marp{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.marp div{background:var(--chip);border-radius:6px;padding:6px 4px;text-align:center;font-size:11px;color:var(--muted)}
.marp b{display:block;font-size:12.5px;color:var(--fg)}
.marp .y b{color:var(--ok)} .marp .n b{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--panel-solid);padding:8px 14px;border-radius:999px;font-size:12.5px;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.ctx{font-size:12.5px;color:var(--muted);line-height:1.5}
.ctx b{color:var(--fg)}
.intro{padding:12px 14px 16px;font-size:13px;color:var(--muted)}
.intro h2{font-size:16px;color:var(--fg);margin-bottom:6px}
.intro ul{padding-inline-start:18px;margin:8px 0}

/* ship-waste market view */
:root{--pAH:#0072bb;--pAFZ:#c9711f;--pGEMS:#7b5cc4;--pEST:#c04f7e;--pEH:#3f9a4a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--pAH:#3d8fd1;--pAFZ:#c97d2e;--pGEMS:#8f72cc;--pEST:#d4578a;--pEH:#45a356} }
:root[data-theme="dark"]{--pAH:#3d8fd1;--pAFZ:#c97d2e;--pGEMS:#8f72cc;--pEST:#d4578a;--pEH:#45a356}
.mk-sec{margin:26px 0}
.mk-sec h3{font-size:16px;margin-bottom:4px}
.mk-sec .why{font-size:13px;color:var(--muted);max-width:75ch;margin-bottom:10px}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hl div{background:var(--panel-solid);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.hl b{display:block;font-size:22px;font-weight:600;line-height:1.1}.hl span{font-size:12px;color:var(--muted)}
.sentence{background:var(--panel-solid);border-inline-start:4px solid var(--green);border-radius:8px;padding:12px 16px;font-size:14.5px;line-height:1.55;max-width:80ch}
.pv{display:inline-block;min-width:34px;text-align:center;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;color:#fff;letter-spacing:.02em}
.pv.AH{background:var(--pAH)}.pv.AFZ{background:var(--pAFZ)}.pv.GEMS{background:var(--pGEMS)}.pv.EST{background:var(--pEST)}.pv.EH{background:var(--pEH)}
.pv.none{background:transparent;color:var(--faint);border:1px dashed var(--line)}
.pv.eh-nonhaz{background:transparent;color:var(--pEH);border:1.5px solid var(--pEH)}.pv.eh-check{background:transparent;color:var(--warn);border:1.5px dashed var(--warn)}
.mx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel-solid)}
.mx{border-collapse:separate;border-spacing:0;font-size:12px;min-width:900px}
.mx th,.mx td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.mx th{font-weight:600;color:var(--muted);font-size:11.5px;background:var(--chip);position:sticky;top:0;z-index:2}
.mx th.coast{background:var(--panel-solid);color:var(--fg);font-size:12px;border-bottom:2px solid var(--line)}
.mx td.cat{text-align:start;font-weight:500;color:var(--fg);position:sticky;inset-inline-start:0;background:var(--panel-solid);z-index:1;min-width:210px;border-inline-end:1px solid var(--line)}
.mx tr.grp td{background:var(--chip);color:var(--muted);font-weight:600;text-align:start;font-size:11.5px;letter-spacing:.02em}
.mx td.ehc{border-inline-start:2px solid var(--pEH)} .mx th.ehc{border-inline-start:2px solid var(--pEH)}
.mx tr.dim{opacity:.25}
.mx td .pv+.pv{margin-inline-start:2px}
.mx td.warnp{box-shadow:inset 0 3px 0 var(--warn)}
.rank{display:grid;gap:8px}
.rank .r{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--panel-solid);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.rank .n{font-size:16px;font-weight:600;color:var(--muted)}
.rank .bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:4px}.rank .bar i{display:block;height:100%;background:var(--green)}
.rank .why2{font-size:12px;color:var(--muted);margin-top:3px}
.rank .sc{font-size:18px;font-weight:600;min-width:40px;text-align:end}
.cmp th:first-child,.cmp td:first-child{text-align:start}
.cmp td{text-align:center}
.vbar{display:grid;grid-template-columns:140px 1fr 70px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
.vbar .t{height:14px;border-radius:3px}
details.tblx summary{cursor:pointer;color:var(--blue-ink);font-size:13px;margin:6px 0}
.flt{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px;align-items:center}
.flt .lbl{font-size:12px;color:var(--muted);margin-inline-end:4px}
/* full-page views */
.view{position:fixed;left:0;right:0;bottom:0;top:var(--topH);z-index:22;overflow:auto;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.view .wrap{max-width:1100px;margin:0 auto}
.view h2{font-size:22px;margin-bottom:6px}
.view .lead{font-size:14.5px;color:var(--muted);max-width:70ch;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:15.5px}
.card .kind{font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;display:inline-block;width:max-content}
.k-us{background:var(--green);color:#fff}.k-incumbent{background:var(--blue);color:#fff}.k-rival{background:var(--warn);color:#fff}.k-industrial,.k-project,.k-owner{background:var(--chip);color:var(--muted)}
.card p{margin:0;font-size:13px;line-height:1.5}
.card .lbl{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px}
.card .eh{border-inline-start:3px solid var(--green);padding-inline-start:9px}
.card .ports{display:flex;flex-wrap:wrap;gap:4px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px 24px;font-size:13.5px}
.gloss dt{font-weight:600}.gloss dd{margin:0 0 8px;color:var(--muted)}
.steps{counter-reset:s;display:grid;gap:10px;max-width:70ch;font-size:14px}
.steps li{list-style:none;padding-inline-start:34px;position:relative}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;inset-inline-start:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;display:grid;place-items:center}
.legend-inline{display:grid;gap:6px;font-size:13.5px;margin:10px 0 18px}
.legend-inline .row{display:flex;align-items:center;gap:10px}
.legend-inline svg{width:18px;height:18px}
.nav .seg button{padding:5px 14px}
@media (max-width:900px){
  .brand .sub{display:none} .brand h1{font-size:15px} .brand .grow{display:none} .brand>div:nth-child(2){flex:1 1 100%} .nav .seg button{padding:5px 10px;font-size:12px} .seg button{padding:5px 9px}
  .rail-l{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:max(12px,env(safe-area-inset-bottom,0px));max-height:38vh}
  .rail-r{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:max(12px,env(safe-area-inset-bottom,0px));max-height:62vh}
  .legend{display:none} .zoom{bottom:auto;top:calc(var(--topH) + 12px)}

er Plan for Logistics Centres (27 Aug 2023): 59 centres, >100m m2, by 2030 (12 Riyadh, 12 Makkah, 17 Eastern, 18 other). Mawani privatisation: SAR 3.5bn ($950m) 2023–24 infrastructure programme (150+ projects); June 2025 20-yr BOT contracts for multipurpose terminals at 8 ports (RSGT SAR 1.6bn+ West; SGP SAR 600m+ East; total >SAR 2.2bn; headline package >SAR 4.4bn with the National Center for Privatization); earlier 30-yr concessions: DP World Jeddah South (2020) + JLP (2022), SGP Dammam (2020, SAR 7bn expansion 2023). 2026 war: US/Israeli strikes on Iran → Strait of Hormuz 'effectively closed' from ~late Feb/early Mar 2026; Dammam & Jubail (>25% of imports) effectively lost; Jeddah share of ship calls 64%→76%, wait times ~doubled; KAP ~5% of calls; Saudi Logistics Corridors Initiative (12 Mar 2026) and five new Red Sea routes (64,000 TEU); 20 Jul 2026 Houthis declared embargo on all Saudi ports (Yanbu crude exports exposed), coalition began Bab el-Mandeb protection measures; PIF now ~80% domestic-focused; 2026 contract awards $68bn through Sep.","authority_en":"Ministry of Transport and Logistic Services / Saudi Ports Authority (Mawani) / National Center for Privatization / PIF","authority_ar":"وزارة النقل والخدمات اللوجستية / الهيئة العامة للموانئ / المركز الوطني للتخصيص / صندوق الاستثمارات العامة","owner_en":"Government of Saudi Arabia","terminals":[],"key_roles":[{"role":"Minister of Transport & Logistic Services; Chairman of Mawani","org":"MoTLS / Mawani","name":"Saleh bin Nasser Al-Jasser","src":["S4","S6"]},{"role":"Acting President, Mawani (Jun 2025)","org":"Mawani","name":"Mazen Al-Turki","src":["S6"]},{"role":"President, Mawani (to 2024)","org":"Mawani","name":"Omar Bin Talal Hariri","src":["S8"]}],"berths":null,"max_draft_m":null,"max_loa_m":null,"quay_length_m":null,"capacity":{"teu_design":40000000,"teu_actual_latest":8317235,"teu_year":2025,"cargo_tonnes_latest":242068641,"cargo_year":2025,"liquid_bulk_tonnes":176325077,"dry_bulk_tonnes":53737829,"gen EC supply chains hit but government/PIF won't pull the plug\" — internal analyst opinion, not a sourced fact.","env_notes_ar":"الإطار القطاعي: عقود البناء والتشغيل والتحويل لمدة 20 عاماً (2025) تنقل التزامات النفايات وماربول على مستوى المحطات إلى محطة البوابة للبحر الأحمر وموانئ السعودية العالمية؛ وتدير هيئات المشاريع العملاقة (نيوم، البحر الأحمر الدولية) أنظمتها الخاصة لصفر نفايات إلى المرادم. آثار الحرب موثقة من AGBI/كبلر/دروري وميد وبلومبرغ؛ لم يُعثر على بيان رسمي من موانئ. رأي محلل آفاق البيئة (أكتوبر 2026) — رأي داخلي وليس حقيقة موثقة."},"sources":[{"id":"S1","title":"AJOT: Saudi Arabia's Vision 2030 program designed to build global logistics hub (NTLS $133bn, 40m TEU)","url":"https://ajot.com/premium/ajot-saudi-arabias-vision-2030-program-designed-to-build-global-logistics-hub","publisher":"AJOT","year":2023,"accessed":"2026-10-22"},{"id":"S2","title":"Mawani reports 10.58% growth in container throughput in 2025","url":"https://container-news.com/mawani-reports-10-58-growth-in-container-throughput-in-2025","publisher":"Container News (Mawani data)","year":2026,"accessed":"2026-10-22"},{"id":"S3","title":"Saudi Arabia's logistics master plan to improve infrastructure and transport: minister (59 centres)","url":"https://www.arabnews.com/node/2362871/amp","publisher":"Arab News","year":2023,"accessed":"2026-10-22"},{"id":"S4","title":"Mawani implements $950m of Saudi port projects","url":"https://guest.meed.com/saudi-ports-authority-implements-950m-of-projects","publisher":"MEED","year":2023,"accessed":"2026-10-22"},{"id":"S5","title":"Mawani signs privatization contracts for cargo terminals at eight Saudi ports","url":"https://container-news.com/mawani-signs-privatization-contracts-for-cargo-terminals-at-eight-saudi-ports","publisher":"Container News","year":2025,"accessed":"2026-10-22"},{"id":"S6","title":"MAWANI signs privatization contracts worth over SAR 4.4bn","url":"https://sharikatmubasher.com/news/article/21492672/mawani-signs-privatization-contracts-worth-over-sar-44-bn?lang=en","publisher":"Sharikat Mubasher","year":2025,"accessed":"2026-10-22"},{"id":"S7","title":"Saudi ports struggle with imports redirected from Strait of Hormuz","url":"https://www.agbi.com/analysis/logistics/2026/03/saudi-ports-struggle-with-imports-redirected-from-strait-of-hormuz/","publisher":"AGBI (Kpler, Drewry, IMF PortWatch)","year":2026,"accessed":"2026-10-22"},{"id":"S8","title":"DP World and Mawani break ground on SAR900m logistics park at Jeddah Islamic Port","url":"https://www.dpworld.com/en/news/releases/uae/dp-world-and-mawani-break-ground-on-sar900-million-logistics-park-at-jeddah-islamic-port","publisher":"DP World","year":2024,"accessed":"2026-10-22"},{"id":"S9","title":"SRSA presents RSG with operating licenses for AMAALA Marina and Shura Marina","url":"https://cyprusshippingnews.com/2026/10/07/saudi-red-sea-authority-presents-red-sea-global-with-operating-licenses-for-amaala-marina-and-shura-marina/","publisher":"Cyprus Shipping News","year":2026,"accessed":"2026-10-22"},{"id":"S10","title":"DP World sees Red Sea port volumes rising as Hormuz shuts","url":"https://guest.meed.com/?p=15769","publisher":"MEED","year":2026,"accessed":"2026-10-22"},{"id":"S11","title":"Houthis warn all ships against calling at Saudi Arabia's ports","url":"https://gcaptain.com/houthis-warn-all-ships-against-calling-at-saudi-arabias-ports/","publisher":"gCaptain (Bloomberg)","year":2026,"accessed":"2026-10-22"},{"id":"S12","title":"Neom's industrial pivot gathers pace (PIF 80% domestic; $68bn 2026 awards)","url":"https://guest.meed.com/?p=18068","publisher":"MEED","year":2026,"accessed":"2026-10-22"},{"id":"S13","title":"Neom pushes back container terminal ramp-up into 2027 (Iran war from Feb 2026)","url":"https://www.agbi.com/analysis/logistics/2026/08/neom-pushes-back-container-terminal-ramp-up-into-2027/","publisher":"AGBI","year":2026,"accessed":"2026-10-22"}],"gaps":["lat/lon — national record; Saudi Arabia centroid used as placeholder for map rendering (not a port)","NTLS 40m TEU target — sourced via AJOT (2023) only; official MoTLS/NTLS document not retrieved","Mawani privatisation total programme value — SAR 4.4bn headline (Jun 2025) not reconciled with SAR 2.2bn component contracts in source; no cumulative programme value published","war effects — no official Mawani/SPA statement retrieved; per-port 2026 monthly volumes not retrieved; Houthi embargo effectiveness unclear per Bloomberg","logistics zones — current count of operating logistics centres (of 59) not found","Jubail/Yanbu new berths — no distinct new-terminal records beyond RSGT/SGP BOTs and Petrotank hub"],"confidence":"Medium"},"overlay":{"regulatory_frame":[{"body_en":"Saudi Ports Authority (Mawani)","body_ar":"الهيئة العامة للموانئ","instrument":"Operational Regulation, Arts. 199–206 — Pollution & environmental protection; Art. 200 Port waste management (ship-waste reception facilities)","what_it_requires_at_ports":"Port waste (collection, transport, sorting, storage, treatment, disposal) is governed by MWAN's Waste Management Law. Procedure: ship sends Advance Notification Form (ANF) to its shipping agent → agent selects a carrier licensed by Mawani/competent authority → carrier delivers to a licensed treatment centre → centre issues Waste Delivery Receipt (WDR) → agent returns stamped WDR to ship and copies ANF+WDR to the authority. No single port concessionaire: open, agent-selected, licence-based market. Absolute ban on discharging oil/oily mixtures/harmful substances within port limits; P&I and clean-up insurance mandatory; spills reported immediately. Art. 211: pollution violations fined SAR 500–10,000.","src":["MW-6"]},{"body_en":"Saudi Ports Authority (Mawani)","body_ar":"الهيئة العامة للموانئ","instrument":"Port Services Fees & Charges System — Schedule (A) item 1.3 (Board decision 202/ج21/د2, 19 Dec 2023)","what_it_requires_at_ports":"Waste-disposal fee SAR 100 per ship per day or part, collected whether or not the ship uses the service; dangerous goods +25% on handling. No per-tonne sludge/oily-residue/garbage tariff exists in the system (Schedule خ lists only labour/diver rates).","src":["MW-4"]},{"body_en":"Saudi Ports Authority (Mawani)","body_ar":"الهيئة العامة للموانئ","instrument":"General Licences & Permits Regulation (25 Mar 2024)","what_it_requires_at_ports":"Terminal/port/marina licensees must provide waste reception and sewage disposal, hold a waste-management plan and dangerous-goods plan, and comply with ISO 14000 / Blue Flag-type environmental standards. No separate Mawani licence class for ship-waste carriers — the carrier licence is MWAN's.","src":["MW-5"]},{"body_en":"Transport General Authority (TGA)","body_ar":"الهيئة العامة للنقل","instrument":"Executive Regulation of the International Convention for the Prevention of Pollution from Ships (MARPOL 73/78) — issued March 2022","what_it_requires_at_ports":"Flag-state and port-state enforcement of MARPOL in Saudi waters: all ships may be inspected and detained until non-compliance is corrected; masters must report any pollutant discovered in Saudi waters; oil tankers must transfer dirty ballast and tank washings to approved oil-residue tanks; tankers >=150 GT and other ships >=400 GT must carry a shipboard oil pollution emergency plan; certificates/licences not renewed until fees and fines paid. Creates the demand side for shore reception of oily residues but the article does not itself specify port reception facility obligations.","src":["E1"]},{"body_en":"Transport General Authority (TGA)","body_ar":"الهيئة العامة للنقل","instrument":"Executive Regulation of the International Convention on the Control of Harmful Anti-fouling Systems on Ships (AFS) — announced January 2025; six fineable violations; 180-day compliance window","what_it_requires_at_ports":"Applies to Saudi-flagged ships anywhere, foreign ships in Saudi waters, and Saudi shipbuilding/repair yards. Removal of anti-fouling systems must not endanger life or the marine ecosystem — i.e. hull-coating removal waste at yards (King Fahd yards at Jeddah/Dammam, IMI Ras Al-Khair) becomes a regulated hazardous stream. No port-reception clause.","src":["E2"]},{"body_en":"Ministry of Environment, Water and Agriculture / National Center for Environmental Compliance (NCEC)","body_ar":"وزارة البيئة والمياه والزراعة / المركز الوطني للرقابة على الالتزام البيئي","instrument":"Implementing Regulation for the Sustainable Management of the Marine and Coastal Environment — Instrument No. 481531028, Umm Al-Qura issue 5178 dated 2026-08-21 (replaces Ministerial Decision 25964/1/1443)","what_it_requires_at_ports":"Art. 7(1)(K): 'transport and port activities' require an NCEC environmental permit. Art. 3: NCEC coordinates with Mawani and TGA to inspect ships and run environmental tests, and maintains national/local oil-pollution emergency plans. Art. 4: prohibits discharge of untreated sewage, oils and derivatives, toxic/hazardous chemicals and disposal of hazardous waste to the marine/coastal environment. Art. 6: regulates ballast water, cargo residues and vessel liquid discharges. Art. 4(5)/6(3)(E): vessel owner/operator must notify NCEC immediately on any oil spill and contain it. Penalties up to SAR 5,000,000 for failure to contain a spill, SAR 1,000,000 for failure to notify. Effectively makes every port operator and terminal concessionaire an NCEC permit-holder needing a compliant waste/spill chain.","src":["E3"]},{"body_en":"Saudi Ports Authority (Mawani)","body_ar":"الهيئة العامة للموانئ (موانئ)","instrument":"Ports Service Fees and Charges System (نظام رسوم وأجور خدمات الموانئ), Royal Decree M/42, latest edition 1443 — and Mawani board 4th amendment to fees, effective April 2024","what_it_requires_at_ports":"The April-2024 amendment sets a flat port 'waste disposal' charge of SAR 100 per ship per day (or part), alongside SAR 1,000 per ship arrival/departure and SAR 50 per departing passenger. This is a Mawani-collected levy, implying Mawani (or its appointed contractor) provides the baseline garbage/waste reception service at Mawani ports; the underlying fee system text fetched did not expose the additional-services schedule (Annex B) so the oily-waste / sludge tariff line could not be verified.","src":["E4","E5"]},{"body_en":"Saudi Ports Authority (Mawani) + ZATCA","body_ar":"موانئ + هيئة الزكاة والضريبة والجمارك","instrument":"Joint mechanism for abandoned goods and containers at ports (January 2021)","what_it_requires_at_ports":"Defines roles of port parties for general, perishable and hazardous abandoned goods beyond the statutory storage period; disposal options are re-export, destruction or auction across all Saudi ports. No contractor is named in the framework; destruction of hazardous abandoned cargo requires an MWAN-licensed disposer (EH already holds a ZATCA disposal framework — per task brief, not independently sourced here).","src":["E6"]},{"body_en":"National Center for Waste Management (MWAN)","body_ar":"المركز الوطني لإدارة النفايات (موان)","instrument":"Waste Management Law and MWAN licensing — June 2026: 17 technical/operational requirements for licensing final disposal of hazardous waste","what_it_requires_at_ports":"Any hazardous waste (including ship-generated oily waste, slops, asbestos from ship repair) can only move through MWAN-licensed collectors/transporters and licensed treatment/disposal sites; disposal licensees must keep inbound waste records (type, quantity, source), lab results, periodic reports to MWAN, and refuse waste without approved transport documents or from unlicensed carriers. MWAN has stated separately that collecting/transporting used batteries requires a hazardous-waste licence. The mwan.gov.sa licence-category page could not be fetched (robots), so the exact category codes are not recorded.","src":["E7","E8"]},{"body_en":"Royal Commission for Jubail and Yanbu (RCJY)","body_ar":"الهيئة الملكية للجبيل وينبع","instrument":"Royal Commission Environmental Regulations RCER-2015 (4th revision, supersedes RCER-2010)","what_it_requires_at_ports":"Applies in Jubail, Yanbu, Ras Al-Khair and Jazan industrial cities (incl. the RCJY-run industrial ports). Section 3 'Marine-related Discharge Regulations' and Table 3E Ballast Water Discharge Standard; Section 4 Hazardous Materials Management; Section 5 Waste Management incl. Waste Manifest, Waste Transportation, Hazardous and Non-Hazardous Industrial Waste Treatment and Disposal regulations; Section 6 Dredging; p.92 'Waste Transporter Registration Regulations' and Appendix C 'Environmental Authorization to Transport Industrial and Hazardous Waste'. Industrial waste in RC cities must be treated to RC standards by an RC-authorised agency; operators hold RC Environmental Permit to Construct / Permit to Operate.","src":["E9","E10","E11"]},{"body_en":"Saudi Ports Authority (Mawani) — King Fahd Industrial Port Jubail","body_ar":"ميناء الملك فهد الصناعي بالجبيل","instrument":"Port-level MARPOL implementation (statement of DG, July 2018)","what_it_requires_at_ports":"Port applies MARPOL provisions, has a dedicated marine pollution unit, a marine-pollution emergency plan coordinated with other bodies, multipurpose tugs with oil-water separation, and regular spill drills. No reception facility or contractor named.","src":["E12"]},{"body_en":"National oil-spill framework (NCEC-led, formerly PME) with Aramco, Mawani, RCJY, Border Guard","body_ar":"الخطة الوطنية لمكافحة التلوث البحري","instrument":"National Contingency Plan for Combating Marine Pollution by Oil and Other Harmful Substances; OPRC 1990 ratified; MARPOL Annexes III–VI marked ratified in ITOPF profile (Annex I/II status not marked in that 2009 profile — verify); Jeddah and Kuwait regional conventions","what_it_requires_at_ports":"Area committees for Red Sea and Gulf coasts; Mawani holds spill equipment at all ports; Aramco holds the largest national stockpile with full-time clean-up groups at export terminals and bases at Tanajib, Jazan, Jeddah, Yanbu, Duba; NCEC runs 'Estijaba' national drills (Jazan, Jeddah, Ras Tanura 2021) with ~40 entities. Notification points: Jeddah Islamic Port, KFIP Jubail, KFIP Yanbu, King Abdulaziz Port Dammam, Ras Al-Khafji.","src":["E13","E14"]},{"body_en":"Saudi Ports Authority (Mawani) — Green Ports Initiative","body_ar":"مبادرة الموانئ الخضراء","instrument":"Mawani Green Ports Initiative under the National Transport and Logistics Strategy / Saudi Green Initiative (2023–); Mawani–NetZero cooperation at King Abdulaziz Port (May 2026)","what_it_requires_at_ports":"2023 targets: cut Jeddah Islamic Port carbon footprint by 1,046 t in 2023 and energy use by 15% across trade hubs via electrification and diesel phase-out; the Reviva waste complex at JIP is explicitly framed under this initiative. 2026 NetZero deal links operational KPIs to environmental metrics across Eastern Province ports. No shore-power (cold-ironing) commitment or ship-waste target was found in any source.","src":["E15","E16","E17"]}],"competitors":[{"company_en":"AH Group","company_ar":"مجموعة AH","port_footprint":["jeddah-islamic","yanbu-commercial","kfip-yanbu","jazan-port","dhiba-duba"],"services":"Declared MARPOL reception provider for all 24 waste types at every Red Sea port (tank truck); business hours, 48h notice","evidence":"IMO GISIS Saudi Arabia declaration, updated 18 Feb 2025","src":["GISIS"]},{"company_en":"Alfahhad Zegward (AFZ Co.)","company_ar":"الفهاد زجوارد","port_footprint":["kfip-jubail","jubail-commercial","king-abdulaziz-dammam"],"services":"Declared MARPOL reception provider, all 24 waste types (tank truck) at Jubail Industrial, Jubail Commercial and Dammam","evidence":"IMO GISIS Saudi Arabia declaration, updated 17–18 Feb 2025","src":["GISIS"]},{"company_en":"Estedama","company_ar":"استدامة","port_footprint":["king-abdulaziz-dammam"],"services":"Declared reception provider for 5 waste types at Dammam","evidence":"IMO GISIS Saudi Arabia declaration, Feb 2025","src":["GISIS"]},{"company_en":"SIRC / Reviva (Global Environmental Management Services)","company_ar":"سرك / ريفيفا","port_footprint":["jeddah-islamic","king-abdulaziz-dammam","king-abdullah-port","petro-rabigh-marine-terminal"],"services":"Marine & industrial waste recycling, solid-waste treatment inside JIP, national ship-waste reception + spill-response framework with Mawani; partnered with HEC (Greece) for marine-waste treatment plants","evidence":"PIF-backed incumbent with the only announced in-port waste facility at a Mawani port; the Mawani–SIRC 2023 framework positions it as default partner for reception facilities at all Mawani ports | GISIS: GEMS (Reviva) declared at Dammam (19 types) and Rabigh (19 types), Feb 2025","src":["E17","E18","E19","E21","E29"]},{"company_en":"Hellenic Environmental Center (HEC)","company_ar":"المركز البيئي الهيليني","port_footprint":[],"services":"Marine waste and petroleum (slops/oily waste) treatment specialist (Greece), entering KSA through SIRC","evidence":"Exclusive SIRC partnership to build marine waste treatment facilities — direct overlap with EH's oily-sludge / hydrocarbon-recovery offer","src":["E29"]},{"company_en":"Averda","company_ar":"أفيردا","port_footprint":["red-sea-project"],"services":"Integrated waste management incl. sea-side collection, MRF, incineration, composting","evidence":"TRSDC contract covering land and sea operations","src":["E27"]},{"company_en":"Saudi Gulf Environmental Protection Company","company_ar":"شركة الخليج السعودية لحماية البيئة (الاسم العربي غير مؤكد)","port_footprint":[],"services":"Jeddah-based MWAN-type hazardous waste collector (used oils, asbestos, batteries, medical), marine/coastal clean-up waste collection, oil transfer between watercraft at sea after contamination","evidence":"Muqawil registration lists marine clean-up and at-sea oil transfer activities — a Jeddah competitor for spill-waste and oily-water work; no port contract evidence","src":["E30"]},{"company_en":"Shanaya Ltd / EPCA","company_ar":"شانايا / الجمعية التعاونية للمشاريع البيئية","port_footprint":["jeddah-islamic"],"services":"Proposed integrated cruise & ship waste treatment facility near JIP","evidence":"2023 feasibility collaboration; status unknown","src":["E20"]},{"company_en":"Saudi Aramco (Marine Department / Industrial Services — in-house)","company_ar":"أرامكو السعودية — إدارة الخدمات البحرية","port_footprint":["ras-tanura","juaymah","kfip-yanbu","jazan","dhiba"],"services":"Largest national oil-spill stockpile, full-time clean-up groups at export terminals, aerial dispersant, bases at Tanajib/Jazan/Jeddah/Yanbu/Duba","evidence":"Aramco self-performs marine spill response at its terminals; waste off-take contractors not named publicly","src":["E13","E14"]}],"market_signals":[{"signal":"IMO GISIS (Saudi declaration, Feb 2025): only four reception-facility providers are declared Kingdom-wide — AH Group (all Red Sea ports: Jeddah, Yanbu Commercial, Yanbu Industrial/King Fahd, Jizan, Dhuba; all 24 waste types incl. Annex I slops/sludge, by tank truck), Alfahhad Zegward (Jubail Commercial, Jubail Industrial, Dammam), GEMS/Reviva (Dammam and Rabigh sites) and Estedama (Dammam, 5 types). Alleged inadequacies are on file for Jeddah, Jizan, Jubail and Yanbu Industrial. Ras Tanura and Ju'aymah are listed with no declared facilities.","relevance_to_eh":"The Annex I (oily waste) gap is now named: AH Group is the sole declared oily-waste receiver on the whole Red Sea coast, by truck, business hours only, 48h notice, 'refer to shipping agent'. Alleged-inadequacy flags at four ports are a documented service-quality opening. Under Mawani Art. 200 EH can be added as a licensed carrier/treatment centre without displacing anyone; getting EH onto the next GISIS declaration (via Mawani/TGA) is the strategic ask.","src":["GISIS","MW-6"]},{"signal":"Mawani Operational Regulation Art. 200: ship-waste removal is agent-selected and licence-based, not concessioned — any MWAN-licensed hazardous carrier/treater can serve ships at any Mawani port once recognised by the port.","relevance_to_eh":"Route to market is via shipping agents (RSGT/DP World/SGP agency desks, Bahri, Kanoo, GAC, etc.) and port recognition, not a Mawani tender. EH's MWAN treatment licence at Al-Juhfah already satisfies the treatment-centre leg for Red Sea ports.","src":["MW-6"]},{"signal":"MWAN register (Oct 2026): 219 companies hold hazardous-waste licences (215 collection/transport rows, 43 treatment, 42 final disposal, 23 storage); Dammam 44, Jeddah 24, Rabigh/Al-Juhfah ~36, Jubail 22, Yanbu 9 rows.","relevance_to_eh":"Under Mawani Art. 200 any of these licensed carriers can be chosen by a shipping agent — the competitor set for ship-waste carriage is this list, not a port concessionaire. Stakeholder-map coverage of these licensees is reported per port.","src":["MWAN-REG"]},{"signal":"Mawani 20-year BOT privatisation of multipurpose terminals at 8 ports (June 2025): Saudi Global Ports takes Dammam, Jubail Commercial, KFIP Jubail, Ras Al-Khair; RSGT takes Jeddah, Yanbu Commercial, KFIP Yanbu, Jazan; >SAR 2.2bn private investment","relevance_to_eh":"Two concessionaires now control waste/environmental procurement across 8 Mawani ports; each needs an NCEC environmental permit (2026 marine regulation) and MWAN-licensed hazardous-waste chains — a two-account sales target (SGP east, RSGT west) rather than port-by-port","src":["E23","E3"]},{"signal":"New Implementing Regulation for Sustainable Management of the Marine and Coastal Environment (Aug 2026) — NCEC permit for port activities, spill-notification/containment duties with fines up to SAR 5m","relevance_to_eh":"Creates compliance pull for spill-response retainers, oily-waste off-take and environmental studies/permitting at every port operator and terminal; EH's emergency-response + permits practice maps directly","src":["E3"]},{"signal":"Mawani–SIRC framework (2023) + Reviva JIP complex (2024/25) + SIRC–HEC marine-waste plants (2024)","relevance_to_eh":"PIF-backed SIRC is being positioned as the default ship-waste reception partner; EH should target sub-contract/off-take (oily sludge, slops, hazardous fractions SIRC/Reviva cannot treat) and the non-Mawani ports (Aramco, RCJY, KAP, NEOM, Red Sea) where SIRC has no announced presence","src":["E17","E21","E29"]},{"signal":"Mawani flat SAR 100/ship/day waste-disposal fee (April 2024)","relevance_to_eh":"Confirms Mawani monetises baseline ship-waste reception; oily waste/sludge is typically outside the flat fee and priced separately — the commercial opening for a licensed oily-waste collector","src":["E4"]},{"signal":"MWAN tightening of hazardous-waste final-disposal licensing (17 requirements, June 2026) and insistence on licensed carriers/manifests","relevance_to_eh":"Raises barrier for unlicensed port-area collectors; EH's MWAN-licensed Al-Juhfah facility is a differentiator for Jeddah/Rabigh/KAP/Yanbu catchment","src":["E7","E8"]},{"signal":"Red Sea conflict: Houthi strikes on Saudi tankers (Encelia ablaze near Jizan outer port limits, July 2026); TGA said measures taken to protect marine environment, no spill reported","relevance_to_eh":"Elevated spill-response readiness demand on the Red Sea coast (Jazan, Jeddah, Yanbu); opportunity for standby/response contracts with Mawani, RSGT, Aramco and NCEC area committees","src":["E31"]},{"signal":"TGA AFS Convention regulation (Jan 2025) applying to Saudi shipyards","relevance_to_eh":"Hull-coating/anti-fouling removal waste at King Fahd yards (Jeddah, Dammam) and IMI Ras Al-Khair becomes a regulated hazardous stream — adjacent to EH asbestos/hazardous competence","src":["E2"]},{"signal":"Mawani Green Ports Initiative (2023) and Mawani–NetZero environmental-KPI programme at KAP/Eastern ports (May 2026); Minerva floating bunker storage at Jeddah (Sept 2025)","relevance_to_eh":"Green-port KPI reporting creates demand for waste-diversion data and licensed off-take partners; bunkering FSU at Jeddah adds a tank-cleaning/slop-generation node","src":["E15","E16","E32"]},{"signal":"Mawani–ZATCA abandoned-goods mechanism (2021) incl. hazardous abandoned cargo","relevance_to_eh":"EH's existing ZATCA disposal framework can be extended to port-side hazardous abandoned cargo at the 8 privatised terminals","src":["E6"]}],"sources":[{"id":"E1","title":"النقل تصدر اللائحة التنفيذية لاتفاقية منع التلوث من السفن (ماربول)","url":"https://www.okaz.com.sa/news/local/2099067","publisher":"Okaz","year":2022,"accessed":"2026-10-22"},{"id":"E2","title":"النقل: 6 مخالفات في لائحة ضبط النظم المقاومة للالتصاق (AFS)","url":"https://www.alwatan.com.sa/article/1159325","publisher":"Al Watan","year":2025,"accessed":"2026-10-22"},{"id":"E3","title":"Implementing Regulation for the Sustainable Management of the Marine and Coastal Environment (Instrument 481531028, UQN 5178)","url":"https://qanoniah.com/en/File/Pj1RJOmdzLRqeO8oDZAYpM5wN-Implementing-Regulation-for-the-Sustainable-Management-of-the-Marine-and-Coastal-Environment","publisher":"MEWA via Qanoniah","year":2026,"accessed":"2026-10-22"},{"id":"E4","title":"موانئ تعدل رسوم خدمات الموانئ — التخلص من المخلفات 100 ريال للسفينة يومياً","url":"https://www.aleqtsad.org/?p=240129","publisher":"Al-Eqtisad","year":2024,"accessed":"2026-10-22"},{"id":"E5","title":"نظام رسوم وأجور خدمات الموانئ 1443 (Royal Decree M/42)","url":"https://qanoniah.com/File/yK0YvZw29QnORWY76Ol3AG8bq-نظام-رسوم-وأجور-خدمات-الموانئ-1443","publisher":"Qanoniah","year":2022,"accessed":"2026-10-22"},{"id":"E6","title":"موانئ والجمارك: آلية جديدة للبضائع المتروكة في الموانئ","url":"https://www.aleqtsad.org/?p=159358","publisher":"Al-Eqtisad","year":2021,"accessed":"2026-10-22"},{"id":"E7","title":"موان: 17 اشتراطاً لترخيص التخلص النهائي من النفايات الخطرة","url":"https://www.alwatan.com.sa/article/1181436","publisher":"Al Watan","year":2026,"accessed":"2026-10-22"},{"id":"E8","title":"موان: جمع البطاريات التالفة ونقلها يستلزم ترخيصاً خاصاً بوصفها نفايات خطرة","url":"https://sabq.org/article/g7fjt57","publisher":"Sabq","year":2025,"accessed":"2026-10-22"},{"id":"E9","title":"Royal Commission Environmental Regulations RCER-2015 Vol. I (TOC)","url":"https://pdf4pro.com/view/royal-commission-environmental-regulations-647bc5.html","publisher":"RCJY (mirror)","year":2015,"accessed":"2026-10-22"},{"id":"E10","title":"The Saudi Waste Spectrum","url":"https://tamimi.com/law-update-articles/the-saudi-waste-spectrum","publisher":"Al Tamimi & Co","year":2021,"accessed":"2026-10-22"},{"id":"E11","title":"Marafiq — Environmental performance (RC Environmental Permits)","url":"https://www.marafiq.com.sa/en/building-value/environmental-performance/","publisher":"Marafiq","year":2025,"accessed":"2026-10-22"},{"id":"E12","title":"مدير ميناء الملك فهد الصناعي بالجبيل: تطبيق الإجراءات الدولية لمنع التلوث البحري","url":"https://www.alyaum.com/ampArticle/6043265","publisher":"Al Yaum","year":2018,"accessed":"2026-10-22"},{"id":"E13","title":"Saudi Arabia country profile (oil spill response)","url":"https://www.itopf.org/knowledge-resources/countries-territories-regions/saudi-arabia/","publisher":"ITOPF","year":2009,"accessed":"2026-10-22"},{"id":"E14","title":"Oil spill drill supported by Marine Department (Estijaba 4/5/6)","url":"https://www.aramcolife.com/en/publications/the-arabian-sun/articles/2021/week-47-articles/oil-spill-drill-supported-by-marine-department","publisher":"Saudi Aramco — The Arabian Sun","year":2021,"accessed":"2026-10-22"},{"id":"E15","title":"Jeddah Islamic Port boosts decarbonization drive (Green Ports Initiative)","url":"https://www.hellenicshippingnews.com/jeddah-islamic-port-boosts-decarbonization-drive/","publisher":"Hellenic Shipping News","year":2023,"accessed":"2026-10-22"},{"id":"E16","title":"Mawani, NetZero launch green ports initiative in Saudi Arabia","url":"https://en.sharikatmubasher.com/media-hub/news/21551823/mawani-netzero-launch-green-ports-initiative-in-saudi-arabia?lang=en","publisher":"Sharikat Mubasher","year":2026,"accessed": <script id="cos" type="application/json">[{"id":"eh","name_en":"Environmental Horizons (EH)","name_ar":"آفاق البيئة","kind":"us","kind_en":"That's us","kind_ar":"نحن","what_en":"Saudi environmental-services company since 2007. Collects, transports, treats and disposes of industrial and hazardous waste; cleans fuel tanks and recovers oil; responds to spills; writes environmental studies and permits. Runs a licensed hazardous-waste complex at Al-Juhfah near Rabigh, 25–30 km from King Abdullah Port and Petro Rabigh.","what_ar":"شركة خدمات بيئية سعودية منذ 2007. تجمع النفايات الصناعية والخطرة وتنقلها وتعالجها وتتخلص منها؛ تنظّف خزانات الوقود وتستعيد الزيوت؛ تستجيب للانسكابات؛ وتعدّ الدراسات والتصاريح البيئية. تدير مجمعاً مرخّصاً للنفايات الخطرة في الجحفة قرب رابغ على بعد 25–30 كم من ميناء الملك عبدالله وبترو رابغ.","ports_en":"Licensed by MWAN at Al-Juhfah (Rabigh). Already serving Red Sea Gateway Terminal (Jeddah), Aramco, Marafiq (Jubail), Ma'aden (Ras Al-Khair) and ZATCA's abandoned-goods disposal at the ports.","ports_ar":"مرخّصة من موان في الجحفة (رابغ). تخدم بالفعل محطة بوابة البحر الأحمر (جدة) وأرامكو ومرافق (الجبيل) ومعادن (رأس الخير) والتخلص من البضائع المتروكة لهيئة الزكاة والضريبة والجمارك في الموانئ.","eh_en":"Not yet on the official IMO list of companies that take waste from ships. Getting on it (through Mawani / the Transport General Authority) is the single most valuable step.","eh_ar":"ليست بعد على القائمة الرسمية لدى المنظمة البحرية الدولية للشركات التي تستقبل نفايات السفن. الانضمام إليها (عبر موانئ / الهيئة العامة للنقل) هو الخطوة الأعلى قيمة.","ports":["jeddah-islamic","king-abdullah-port","petro-rabigh-marine-terminal","kfip-jubail","ras-al-khair-industrial"],"src":["EH company profile","MWAN-REG","EH bids tracker 2026"]},{"id":"ah-group","name_en":"AH Group = Feal Arabian Industrial Co. (شركة فيل العربية)","name_ar":"مجموعة AH = شركة فيل العربية الصناعية","kind":"incumbent","kind_en":"Official ship-waste receiver — Red Sea","kind_ar":"المستقبِل الرسمي لنفايات السفن — البحر الأحمر","what_en":"\"AH Group\" in the IMO register is Feal Arabian Industrial Co. Ltd, a Jeddah hazardous-waste company founded in 1999 (same phone and address). The only company Saudi Arabia has declared to the IMO as receiving waste from ships at the Red Sea ports: Jeddah, Yanbu Commercial, Yanbu Industrial, Jizan and Dhuba. Declared for every kind of ship waste (oily sludge and slops, chemicals, sewage, garbage, air-pollution residues, ballast). Works with tank trucks, business hours only, 48 hours' notice, and tells ships to 'refer to shipping agent'. Beyond ships it runs oil-spill response, hazardous and industrial waste treatment (800 + 300 t/day), evaporation ponds, landfill cells and an incinerator — at Jeddah and at Rabigh–Al-Juhfah, the same complex as EH. Its website lists \"ports & ships\" as a sector but names no port-operations contract; the site was suspended in October 2026.","what_ar":"«مجموعة AH» في سجل المنظمة البحرية الدولية هي شركة فيل العربية الصناعية، شركة نفايات خطرة في جدة تأسست 1999 (الهاتف والعنوان نفسهما). الشركة الوحيدة التي أعلنتها السعودية للمنظمة البحرية الدولية كمستقبِل لنفايات السفن في موانئ البحر الأحمر: جدة وينبع التجاري وينبع الصناعي وجازان وضباء. معلنة لكل أنواع نفايات السفن (الحمأة والمخلفات الزيتية، الكيميائيات، الصرف الصحي، القمامة، بقايا تلوث الهواء، الصابورة). تعمل بشاحنات صهريجية، في أوقات الدوام فقط، بإشعار 48 ساعة، وتحيل السفن إلى وكيلها الملاحي. وإلى جانب السفن تدير الاستجابة للانسكابات النفطية ومعالجة النفايات الخطرة والصناعية (800 + 300 طن/يوم) وبرك التبخير وخلايا الردم ومحرقة — في جدة وفي رابغ–الجحفة، المجمع نفسه الذي تعمل فيه آفاق البيئة. يذكر موقعها «الموانئ والسفن» قطاعاً لكنه لا يسمّي عقد تشغيل في ميناء؛ وقد عُلّق الموقع في أكتوبر 2026.","ports_en":"Jeddah Islamic, Yanbu Commercial, King Fahd Industrial Yanbu, Jazan, Dhuba (6 IMO port codes, 144 declared waste-type entries).","ports_ar":"جدة الإسلامي، ينبع التجاري، الملك فهد الصناعي بينبع، جازان، ضباء (6 رموز موانئ، 144 بنداً معلناً).","eh_en":"EH's closest competitor in every sense: same waste streams, same Al-Juhfah complex, and the only declared ship-waste receiver on the Red Sea. It was sitting in EH's map as a Tier 4 \"limited data\" row — now Tier 1. EH's main competitor for ship waste on the Red Sea. Ships have filed complaints about the service at Jeddah, Jizan and Yanbu Industrial (recorded by the IMO). A truck-only, office-hours service next to EH's own treatment site is a clear opening.","eh_ar":"أقرب منافس لآفاق البيئة بكل المقاييس: التيارات نفسها، ومجمع الجحفة نفسه، والمستقبِل الوحيد المعلن لنفايات السفن على البحر الأحمر. كانت في خريطة آفاق البيئة صفاً من الفئة الرابعة «بيانات محدودة» — وأصبحت الآن من الفئة الأولى. المنافس الرئيسي لآفاق البيئة في نفايات السفن على البحر الأحمر. سجّلت سفن شكاوى عن الخدمة في جدة وجازان وينبع الصناعي (موثّقة لدى المنظمة البحرية الدولية). خدمة بالشاحنات في أوقات الدوام فقط بجوار موقع معالجة آفاق البيئة تمثل فرصة واضحة.","ports":["jeddah-islamic","yanbu-commercial","kfip-yanbu","jazan-port","dhiba-duba"],"src":["GISIS"],"in_map":true},{"id":"afz","name_en":"Alfahhad Zegward (AFZ)","name_ar":"الفهاد زجوارد","kind":"incumbent","kind_en":"Official ship-waste receiver — Jubail & Dammam","kind_ar":"المستقبِل الرسمي لنفايات السفن — الجبيل والدمام","what_en":"Declared to the IMO as the receiver for every kind of ship waste at both Jubail ports, and one of three at Dammam. Tank-truck service. Al Fahhad Zegwaard is a Saudi–Dutch industrial-services contractor founded in 1979 (Dammam HQ; Jubail, Yanbu, Abqaiq branches; ~100 trucks and 40 specialist vehicles reported in 2000): vacuum trucks, tank cleaning, hydroblasting, catalyst handling and hazardous-waste disposal for Saudi Aramco and SABIC plants. Ship-waste reception is an extension of that vacuum-truck business; no port-operations contract with Mawani was found.","what_ar":"معلنة للمنظمة البحرية الدولية كمستقبِل لكل أنواع نفايات السفن في ميناءي الجبيل، وواحدة من ثلاث شركات في الدمام. خدمة بشاحنات صهريجية. الفهاد زجوارد مقاول خدمات صناعية سعودي–هولندي تأسس 1979 (المقر الدمام؛ فروع الجبيل وينبع وبقيق؛ نحو 100 شاحنة و40 مركبة متخصصة بحسب تقرير 2000): شاحنات شفط، تنظيف خزانات، تنظيف بضغط الماء، مناولة المحفزات، والتخلص من النفايات الخطرة لمصانع أرامكو وسابك. استقبال نفايات السفن امتداد لعمل شاحنات الشفط؛ ولم يُعثر على عقد تشغيل مع موانئ.","ports_en":"King Fahd Industrial Port Jubail, Jubail Commercial, King Abdulaziz Port Dammam (72 declared entries).","ports_ar":"ميناء الملك فهد الصناعي بالجبيل، الجبيل التجاري، ميناء الملك عبدالعزيز بالدمام (72 بنداً معلناً).","eh_en":"The incumbent in the Kingdom's biggest industrial-waste catchment. Ships have complained about the service at Jubail Commercial. Now classed in EH's map as a Tier 1 direct competitor.","eh_ar":"الحاضنة في أكبر حوض للنفايات الصناعية في المملكة. سجّلت سفن شكاوى عن الخدمة في الجبيل التجاري. مصنّفة الآن في خريطة آفاق البيئة منافساً مباشراً من الفئة الأولى.","ports":["kfip-jubail","jubail-commercial","king-abdulaziz-dammam"],"src":["GISIS"],"in_map":true},{"id":"reviva","name_en":"Reviva / GEMS (part of SIRC, owned by PIF)","name_ar":"ريفيفا / جيمس (تابعة لسرك، مملوكة لصندوق الاستثمارات العامة)","kind":"incumbent","kind_en":"State-backed waste group inside the ports","kind_ar":"مجموعة نفايات مدعومة من الدولة داخل الموانئ","what_en":"Global Environmental Management Services (brand: Reviva) is the hazardous-waste arm of SIRC, the national recycling company owned by the Public Investment Fund. Signed a Kingdom-wide framework with Mawani in 2023 to build waste facilities at all its ports; opened a SAR 30 million marine and industrial waste complex inside Jeddah Islamic Port (contract June 2024, operating 2025). Declared to the IMO as a receiver at Dammam and Rabigh.","what_ar":"الشركة العالمية لخدمات إدارة البيئة (علامتها ريفيفا) هي ذراع النفايات الخطرة لشركة سرك، شركة التدوير الوطنية المملوكة لصندوق الاستثمارات العامة. وقّعت اتفاقية إطارية مع موانئ عام 2023 لبناء مرافق نفايات في كل موانئها؛ وافتتحت مجمعاً للنفايات البحرية والصناعية بقيمة 30 مليون ريال داخل ميناء جدة الإسلامي (العقد يونيو 2024، التشغيل 2025). معلنة لدى المنظمة البحرية الدولية كمستقبِل في الدمام ورابغ.","ports_en":"Jeddah Islamic (in-port complex), Dammam and Rabigh (IMO-declared), framework covering all Mawani ports.","ports_ar":"جدة الإسلامي (مجمع داخل الميناء)، الدمام ورابغ (معلنة لدى المنظمة)، واتفاقية إطارية تغطي كل موانئ موانئ.","eh_en":"Both a client and the strongest strategic competitor: state-owned, inside the port gates, and partnered with Greece's Hellenic Environmental Center for more marine-waste plants. EH should expect Reviva at every Mawani tender.","eh_ar":"عميل ومنافس استراتيجي أقوى في آن: مملوكة للدولة، داخل بوابات الميناء، ومتشاركة مع المركز البيئي الهيليني اليوناني لمزيد من محطات النفايات البحرية. على آفاق البيئة توقّع ريفيفا في كل منافسة لموانئ.","ports":["jeddah-islamic","king-abdulaziz-dammam","king-abdullah-port","petro-rabigh-marine-terminal"],"src":["GISIS","overlay"],"in_map":true},{"id":"estedama","name_en":"Estedama (Rowad Al-Estedama Environmental Services)","name_ar":"استدامة (شركة رواد الاستدامة للخدمات البيئية)","kind":"incumbent","kind_en":"Official ship-waste receiver — Dammam (partial)","kind_ar":"مستقبِل رسمي لنفايات السفن — الدمام (جزئي)","what_en":"Declared to the IMO for five kinds of ship waste at Dammam only. Already in EH's map (Tier 1 direct competitor, Dammam; two tender encounters with EH).","what_ar":"معلنة لدى المنظمة البحرية الدولية لخمسة أنواع من نفايات السفن في الدمام فقط. موجودة في خريطة آفاق البيئة (منافس مباشر من الفئة الأولى، الدمام؛ لقاءان في منافسات مع آفاق البيئة).","ports_en":"King Abdulaziz Port, Dammam.","ports_ar":"ميناء الملك عبدالعزيز بالدمام.","eh_en":"A small, specialised player; shows Dammam is the one port with real competition among receivers.","eh_ar":"لاعب صغير متخصص؛ يبيّن أن الدمام هو الميناء الوحيد ذو منافسة حقيقية بين المستقبِلين.","ports":["king-abdulaziz-dammam"],"src":["GISIS"],"in_map":true},{"id":"veolia","name_en":"Veolia Tahwil","name_ar":"فيوليا تحويل","kind":"industrial","kind_en":"Hazardous-waste incinerator in Jubail","kind_ar":"محرقة نفايات خطرة في الجبيل","what_en":"Veolia's Saudi joint venture runs the hazardous-waste-to-energy plant in Jubail's PlasChem Park: up to 121,000 tonnes a year, anchor customer Sadara. Takes industrial waste from the plants around the port rather than waste from ships.","what_ar":"المشروع المشترك لفيوليا في السعودية يدير محطة تحويل النفايات الخطرة إلى طاقة في حديقة بلاسكيم بالجبيل: حتى 121 ألف طن سنوياً، وعميلها الرئيسي صدارة. تستقبل النفايات الصناعية من المصانع المحيطة بالميناء لا نفايات السفن.","ports_en":"Jubail industrial cluster (King Fahd Industrial Port Jubail).","ports_ar":"المجمع الصناعي بالجبيل (ميناء الملك فهد الصناعي بالجبيل).","eh_en":"The incumbent for industrial hazardous waste in Jubail. EH's realistic niches there are oily sludge, tank cleaning and asbestos, not incineration.","eh_ar":"الحاضنة للنفايات الصناعية الخطرة في الجبيل. مجالات آفاق البيئة الواقعية هناك هي الحمأة الزيتية وتنظيف الخزانات والأسبستوس لا الحرق.","ports":["kfip-jubail","jubail-commercial"],"src":["overlay"],"in_map":true},{"id":"averda","name_en":"Averda","name_ar":"أفيردا","kind":"project","kind_en":"Waste contractor for the Red Sea tourism project","kind_ar":"مقاول النفايات لمشروع البحر الأحمر السياحي","what_en":"International waste company holding Red Sea Global's zero-waste-to-landfill contract (awarded 2021), covering the resorts, marinas and 'land and sea' collection.","what_ar":"شركة نفايات دولية تحتفظ بعقد «صفر نفايات إلى المرادم» لدى البحر الأحمر الدولية (رسا عام 2021)، ويغطي المنتجعات والمراسي والجمع «براً وبحراً».","ports_en":"Red Sea Project marinas (Shura Island) and, by extension, AMAALA.","ports_ar":"مراسي مشروع البحر الأحمر (جزيرة شورى)، وبالامتداد أمالا.","eh_en":"Locked in at the tourism giga-projects; low priority for EH except for the Saudi Water Authority permit tenders nearby (Umluj).","eh_ar":"راسخة في المشاريع السياحية الكبرى؛ أولوية منخفضة لآفاق البيئة باستثناء منافسات تصاريح هيئة المياه القريبة (أملج).","ports":["red-sea-shura-marina","amaala-triple-bay-marina"],"src":["overlay"],"in_map":true},{"id":"alsamer","name_en":"Al-Samer Arabian Environmental Services","name_ar":"شركة السامر العربية للخدمات البيئية","kind":"rival","kind_en":"Beat EH on price in 2026","kind_ar":"تفوّقت على آفاق البيئة سعرياً في 2026","what_en":"Jeddah-based environmental services company with two MWAN licences for treating hazardous waste. Won the Saudi Water Authority tender to remove carbon ash from the Shuaibah desalination plant against EH's SAR 864,000 bid (reason given: the lowest price).","what_ar":"شركة خدمات بيئية مقرها جدة، تحمل ترخيصين من موان لمعالجة النفايات الخطرة. فازت بمنافسة هيئة المياه لنقل الرماد الكربوني من محطة تحلية الشعيبة مقابل عرض آفاق البيئة البالغ 864 ألف ريال (السبب المعلن: السعر الأقل).","ports_en":"Jeddah / Shuaibah coast.","ports_ar":"ساحل جدة / الشعيبة.","eh_en":"A direct price competitor on the same coast and for the same desalination clients.","eh_ar":"منافس سعري مباشر على الساحل نفسه ولدى عملاء التحلية أنفسهم.","ports":["jeddah-islamic"],"src":["EH bids tracker 2026","MWAN-REG"],"in_map":true},{"id":"ges","name_en":"Global Environmental Services (الشركة العالمية للخدمات البيئية)","name_ar":"الشركة العالمية للخدمات البيئية","kind":"rival","kind_en":"Beat EH on price in 2026","kind_ar":"تفوّقت على آفاق البيئة سعرياً في 2026","what_en":"Won the Saudi Water Authority environmental-permit job for the Ras Al-Khair desalination plant against EH (EH's SAR 97,000 was the higher price).","what_ar":"فازت بمنافسة هيئة المياه لاستخراج الرخصة البيئية لمحطة تحلية رأس الخير مقابل آفاق البيئة (كان عرض آفاق البيئة 97 ألف ريال هو الأعلى سعراً).","ports_en":"Ras Al-Khair.","ports_ar":"رأس الخير.","eh_en":"Shows the permit-and-study work around the industrial ports is price-driven; EH re-bid the same site at SAR 167,000.","eh_ar":"تُظهر أن أعمال التصاريح والدراسات حول الموانئ الصناعية محكومة بالسعر؛ أعادت آفاق البيئة التقديم على الموقع نفسه بـ167 ألف ريال.","ports":["ras-al-khair","ras-al-khair-industrial"],"src":["EH bids tracker 2026"],"in_map":true},{"id":"aramco","name_en":"Saudi Aramco (in-house)","name_ar":"أرامكو السعودية (داخلياً)","kind":"owner","kind_en":"Runs its own terminals' spill response","kind_ar":"تدير الاستجابة للانسكابات في محطاتها بنفسها","what_en":"At Ras Tanura, Ju'aymah, Yanbu and Jazan, Aramco operates the oil terminals and handles spill response with its own teams. Its 2025 terminal rules route any ship waste through the ship's agent; Ju'aymah accepts no slops or ballast at all. The IMO list shows no declared waste receiver at Ras Tanura or Ju'aymah.","what_ar":"في رأس تنورة والجعيمة وينبع وجازان تشغّل أرامكو محطات النفط وتتولى الاستجابة للانسكابات بفرقها. تحيل قواعد محطاتها لعام 2025 أي نفايات سفن إلى وكيل السفينة؛ ولا تقبل الجعيمة أي مخلفات زيتية أو صابورة. ولا تُظهر قائمة المنظمة البحرية الدولية أي مستقبِل معلن في رأس تنورة أو الجعيمة.","ports_en":"Ras Tanura, Ju'aymah, Yanbu crude terminals, Jazan refinery terminal.","ports_ar":"رأس تنورة، الجعيمة، محطات ينبع للنفط الخام، محطة مصفاة جازان.","eh_en":"EH is already an Aramco supplier (SAR 2.6m). The terminals themselves offer little ship-waste work; the opportunity is Aramco's onshore tenders (asbestos, studies, tank cleaning).","eh_ar":"آفاق البيئة مورّد لأرامكو بالفعل (2.6 مليون ريال). المحطات ذاتها لا تتيح عملاً كبيراً في نفايات السفن؛ الفرصة في منافسات أرامكو البرية (الأسبستوس، الدراسات، تنظيف الخزانات).","ports":["ras-tanura-terminal","juaymah-terminal","yanbu-aramco-terminals","jazan-jcpdi-port"],"src":["tier2 research","GISIS"],"in_map":true},{"id":"sgepc","name_en":"Saudi Gulf Environmental Protection Co.","name_ar":"الشركة السعودية الخليجية لحماية البيئة","kind":"rival","kind_en":"Marine clean-up specialist, Jeddah","kind_ar":"متخصصة في التنظيف البحري، جدة","what_en":"Jeddah company registered for marine clean-up and ship-to-ship oil transfer, with MWAN hazardous-waste licences. No port contract found.","what_ar":"شركة في جدة مسجّلة لأعمال التنظيف البحري ونقل الزيوت بين السفن، وتحمل تراخيص موان للنفايات الخطرة. لم يُعثر على عقد ميناء لها.","ports_en":"Jeddah.","ports_ar":"جدة.","eh_en":"A possible partner or rival for spill response on the Red Sea.","eh_ar":"شريك أو منافس محتمل في الاستجابة للانسكابات على البحر الأحمر.","ports":["jeddah-islamic"],"src":["overlay","MWAN-REG"],"in_map":true}]</script>

 ar:{cmpT:'ممّ اشتكت السفن',cmpW:'كل شكوى قدّمتها سفينة إلى المنظمة البحرية الدولية بشأن استقبال النفايات في ميناء سعودي، 2018–2025. تبلّغ السفن عبر دولة العلم؛ وتنشر المنظمة التقرير وردّ دولة الميناء. جاءت التقارير الثلاثون كلها من سفن ترفع علم جزر مارشال.',cmpSum:'30 شكوى إجمالاً. 27 منها عن قمامة (بلاستيك، طعام، نفايات منزلية) رفض الميناء استلامها؛ و3 فقط عن نفايات زيتية. 24 تقول «لا يوجد مرفق متاح»، و4 تقول إن الخدمة موقوفة أو مرفوضة، و2 تشتكيان من الرسوم. ردّت السعودية على 11 منها بالرد نفسه — إحالة السفن إلى مرفق في ينبع ومردم بلدية جدة — وأشّرت على الباقي بـ«تم الاطلاع».',cmpPort:'الشكاوى المقدّمة عن هذا الميناء',cWhen2:'متى',cFlag:'علم السفينة',cWaste:'النفايات التي أرادت السفينة تفريغها',cProb:'المشكلة المبلّغ عنها',cCmt:'ما قالته السفينة',cResp:'الرد السعودي',cNone:'لا شكاوى مسجلة عن هذا الميناء.',cN:'شكاوى',cAll:'كل الموانئ',vMk:'سوق نفايات السفن',mkT:'سوق نفايات السفن، ميناءً بميناء',mkLead:'ما الذي تستطيع السفينة تفريغه في كل ميناء سعودي، ومن يستقبله رسمياً، وأين تستطيع آفاق البيئة المنافسة. مبني على إعلان السعودية للمنظمة البحرية الدولية (فبراير 2025) وتراخيص آفاق البيئة.',

 sent:'أربع شركات تمسك بالسوق المعلن كله. مجموعة AH وحدها تغطي كل موانئ البحر الأحمر لكل أنواع النفايات؛ والفهاد زجوارد تفعل الشيء نفسه في الجبيل وتتقاسم الدمام مع جيمس (ريفيفا) واستدامة. تسعة من عشرة موانئ تعتمد على شركة واحدة، واشتكت السفن رسمياً في أربعة منها. آفاق البيئة مرخّصة لـ20 من 24 نوعاً (23 بعد تأكيد ثلاثة)، ولديها موقع معالجة على بعد 20 كم من رابغ و136 كم من جدة، وهي مورّد داخل عدة موانئ منها بالفعل — لكنها ليست على قائمة المنظمة البحرية الدولية، فلا يراها الوكلاء.',
 mk1:'من يمسك بالسوق',mk1w:'حصة كل شركة من السوق المعلن. «البضائع المتاحة» هي البضائع السنوية للموانئ التي تخدمها الشركة — مؤشر على عدد نداءات السفن وكمية النفايات التي تمر عبر بواباتها.',
 mk2:'ما الذي يستقبله كل ميناء، ومن يستقبله',mk2w:'الصفوف هي أنواع النفايات الأربعة والعشرون في سجل المنظمة البحرية الدولية بكلمات بسيطة. كل شريحة هي الشركة التي أعلنتها السعودية مستقبِلاً. العمود الأخير يبيّن هل تستطيع آفاق البيئة استقبال هذا النوع بتراخيصها الحالية. الخط البرتقالي فوق عمود يعني أن السفن اشتكت في ذلك الميناء.',
 mk3:'أين تنافس آفاق البيئة أولاً',mk3w:'كل ميناء مقيَّم من 100 على خمسة عناصر: حجم البضائع (30)، هل تنفرد به شركة واحدة (20)، الشكاوى المسجلة (20)، المسافة من موقع آفاق البيئة في الجحفة (20)، وعملاء آفاق البيئة ومنافساتها هناك (10). التقييم رأي محلل آفاق البيئة لا حقيقة موثّقة.',
