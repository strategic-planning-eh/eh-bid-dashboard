border-color:var(--eh-sea);color:#fff}body .chip{font-size:11.5px;font-weight:600;border-radius:var(--eh-r-chip);padding:2px 9px;color:var(--eh-ink-2);background:var(--eh-muted-bg);border:0}body .chip.body{background:var(--eh-info-bg);color:var(--eh-info)}body .chip.src-official{background:var(--eh-good-bg);color:var(--eh-good)}body .chip.src-spa{background:var(--eh-muted-bg);color:var(--eh-muted)}body .chip.tag{background:var(--eh-tint);color:var(--eh-ink-2);border:0}body .chip.lang{background:transparent;color:var(--eh-ink-3);border:1px solid var(--eh-line)}body button.chip.body{background:var(--eh-sea);color:#fff}body .chip[class*="kind-"]{display:inline-flex;align-items:center;gap:5px;vertical-align:1px}body .chip[class*="kind-"]::before{content:"";width:7px;height:7px;flex:none;background:currentColor}body .chip.kind-risk{background:var(--eh-bad-bg);color:var(--eh-bad)}body .chip.kind-risk::before{border-radius:1px;transform:rotate(45deg)}body .chip.kind-opportunity{background:var(--eh-good-bg);color:var(--eh-good)}body .chip.kind-opportunity::before{border-radius:50%}body .chip.kind-licensing{background:var(--eh-info-bg);color:var(--eh-info)}body .chip.kind-licensing::before{background:none;border:1.5px solid currentColor;border-radius:50%}body .chip.kind-tender{background:var(--eh-warn-bg);color:var(--eh-warn)}body .chip.kind-tender::before{border-radius:1px}body .chip.kind-watch{background:var(--eh-muted-bg);color:var(--eh-muted)}body .chip.kind-watch::before{height:2px}body .bodies{gap:10px}body .bd{background:var(--eh-paper);border:1px solid var(--eh-line);border-radius:12px;padding:11px 13px;transition:border-color var(--eh-dur-1) var(--eh-ease),background-color var(--eh-dur-1) var(--eh-ease)}body .bd:hover{border-color:var(--eh-sea)}body .bd.on{outline:0;border-color:var(--eh-sea);box-shadow:inset 0 0 0 1px var(--eh-sea);background:var(--eh-info-bg)}body .bd .n{font-weight:600;font-size:13.5px;color:var(--eh-ink)}body .bd .m{font-size:12px;color:var(--eh-ink-3)}body .dot{width:8px;height:8px;background:var(--eh-ink-3)}body .dot.st-ok{background:var(--eh-good);border-radius:50%}body .dot.st-empty,body .dot.st-stale{background:#C98A1B;border-radius:1px}body .dot.st-error{background:var(--eh-bad);border-radius:1px;transform:rotate(45deg)}body .dot.st-skipped,body .dot.st-robots{background:var(--eh-ink-3);height:2.5px;border-radius:0}body .fl select,body .fl input{font:13px var(--eh-font);padding:7px 10px;border:1px solid var(--eh-line);border-radius:var(--eh-r-ctl);background:var(--eh-paper);color:var(--eh-ink)}body .fl select:focus,body .fl input:focus{border-color:var(--eh-sea);box-shadow:0 0 0 3px var(--eh-info-bg);outline:0}body .it{border-top:1px solid var(--eh-line);padding:12px 0}body .it .d{font-size:12.5px;color:var(--eh-ink-3)}body .it .d small{font-size:12px}body .it .t{font-size:14px;line-height:1.55}body .it .t a{color:var(--eh-ink);font-weight:600}body .it .t a:hover{color:var(--eh-sea)}body .empty{background:var(--eh-tint);color:var(--eh-ink-2);border-radius:12px}body table.t{font-size:13px}body table.t th{font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--eh-ink-2);background:var(--eh-tint);border-bottom:1px solid var(--eh-line);padding:8px 9px}body table.t td{border-bottom:1px solid var(--eh-line);padding:8px 9px}body .foot{font-size:12px;color:var(--eh-ink-3)}@media(max-width:640px){body header{padding:14px 16px 16px}body header h1{font-size:18px}main{padding:14px 16px 36px}body .kstrip{grid-template-columns:repeat(2,minmax(0,1fr))}body .kc .v{font-size:23px}body .fl input{min-width:0;flex:1 1 100%}body .card{padding:14px 15px}}</style>
<style>
:root{--bg:#F4F7F5;--card:#fff;--ink:#16333F;--muted:#5F7078;--line:#E3EAE5;--green:#1F7A4C;--blue:#1A5FAB;--amber:#E8862E;--red:#C0504D;--chip:#F0F5F2;--gov:#1A5FAB}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--eh-font,"Segoe UI",Tahoma,Arial,sans-serif);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
body.dark{--bg:#0F1519;--card:#151C21;--ink:#E6EDF1;--muted:#9FB3BE;--line:#2C3A43;--chip:#1E2830;--gov:#7FA7E6}
header{background:linear-gradient(90deg,#1A5FAB,#1F7A4C);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:19px;font-weight:800}header .sub{font-size:12px;opacity:.9;margin-top:2px}
header .ctl{margin-inline-start:auto;display:flex;gap:6px}
.tog{display:inline-flex;border:1px solid rgba(255,255,255,.5);border-radius:8px;overflow:hidden}.tog button{background:transparent;color:#fff;border:0;padding:6px 12px;cursor:pointer;font:600 12px inherit}.tog button.on{background:#fff;color:#1A5FAB}
main{max-width:1380px;margin:0 auto;padding:16px 22px 40px}
.stamp{font-size:12px;color:var(--muted);margin:0 0 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stamp b{color:var(--ink)}
.kstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:4px solid var(--gov)}
.kc .v{font-size:24px;font-weight:800;color:var(--gov);line-height:1.1}.kc .l{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}.card h2::before{content:"";width:4px;height:18px;background:var(--gov);border-radius:2px;display:inline-block}
.card .note{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.bodies{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:8px}
.bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg)}.bd.on{outline:2px solid var(--gov)}
.bd .n{font-weight:700;font-size:13px}.bd .m{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted);flex:none}.dot.st-ok{background:var(--green)}.dot.st-empty,.dot.st-stale{background:var(--amber)}.dot.st-error{background:var(--red)}.dot.st-skipped,.dot.st-robots{background:#9AABB5}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.fl select,.fl input{font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.fl input{min-width:220px}
.tabs{display:inline-flex;gap:4px;flex-wrap:wrap}.tabs button{background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 14px;cursor:pointer;font:600 12.5px inherit}.tabs button.on{background:var(--gov);color:#fff;border-color:var(--gov)}
.it{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;padding:11px 0;border-top:1px solid var(--line)}.it:first-of-type{border-top:0}
.it .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}.it .d small{display:block;font-size:10.5px}
.it .t{font-size:13.5px;line-height:1.55}.it .t a{color:var(--ink);text-decoration:none;font-weight:600}.it .t a:hover{text-decoration:underline;color:var(--gov)}
.it .meta{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 8px;color:#fff;background:var(--muted)}
.chip.body{background:var(--gov)}.chip.src-official{background:var(--green)}.chip.src-spa{background:#5F7078}.chip.tag{background:var(--chip);color:var(--ink);border:1px solid var(--line)}.chip.lang{background:transparent;color:var(--muted);border:1px solid var(--line)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;background:var(--chip);border-radius:10px}
.warn{font-size:12.5px;padding:10px 12px;background:var(--chip);border-radius:8px;border-inline-start:3px solid var(--amber);margin-top:10px}
.foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.6}
.bsum{font-size:14px;line-height:1.7;margin:4px 0 10px}.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.bgrid h3{font-size:12px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}.bb{font-size:13px;line-height:1.6;padding:8px 0;border-top:1px solid var(--line)}.bb:first-of-type{border-top:0}
.ref{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;font-size:10px;font-weight:700;border-radius:4px;background:var(--chip);color:var(--gov);border:1px solid var(--line);text-decoration:none;margin-inline-start:2px;vertical-align:1px}.ref.miss{color:var(--muted);text-decoration:line-through}
.chip.kind-risk{background:var(--red)}.chip.kind-opportunity{background:var(--green)}.chip.kind-licensing{background:var(--gov)}.chip.kind-tender{background:var(--amber)}.chip.kind-watch{background:var(--muted)}.bmeta{font-size:11px;color:var(--muted);margin-top:10px}
@media(max-width:760px){.bgrid{grid-template-columns:1fr}}
table.t{width:100%;border-collapse:collapse;font-size:12px}table.t th{text-align:start;font-size:11px;letter-spacing:.3px;color:var(--muted);text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}table.t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
details summary{cursor:pointer;font-weight:700}
@media(max-width:640px){.it{grid-template-columns:1fr}.it .d{padding:0}}
</style>
</head>
<body>
<header data-eh-contour="6">
 <div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
 <div class="ctl"><div class="tog" id="lang"><button data-l="en" onclick="setLang('en')">EN</button><button data-l="ar" onclick="setLang('ar')">عربي</button></div></div>
</header>
<main>
 <div class="stamp" id="stamp"></div>
 <div class="kstrip" id="kstrip"></div>
 <div class="card" id="brief"></div>
 <div class="card" id="bodies"></div>
 <div class="card" id="feed"></div>
 <details class="card" id="status"></details>
 <div class="foot" id="foot"></div>
</main>
<script>
let LANG=(localStorage.getItem('gov.lang')||localStorage.getItem('ef.lang')||'en'), DARK=false, FEED=null, LOADERR=null;
let BRIEF=null, BRIEF_OPEN=null;
const S={body:'all',period:'week',tag:'all',src:'all',q:'',sort:'desc'};
const L=(en,ar)=>LANG==='ar'?ar:en, $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TAGL={licence:['Licence','ترخيص'],tender:['Tender / contract','منافسة / عقد'],regulation:['Regulation','لائحة / نظام'],fine:['Fine / violation','غرامة / مخالفة'],mou:['MoU / agreement','مذكرة / اتفاقية'],event:['Event','فعالية'],investment:['Investment','استثمار']};
const STL={ok:['Fetched','تم الجلب'],empty:['Reachable, nothing found','متاح، لا عناصر'],stale:['Found only items older than the window','وُجدت عناصر أقدم من النافذة فقط'],error:['Fetch failed','فشل الجلب'],skipped:['Skipped','تم التخطي'],robots:['Site blocks robots — via the Saudi Press Agency','الموقع يمنع الروبوتات — عبر واس']};
function setLang(l){LANG=l;try{localStorage.setItem('gov.lang',l)}catch(e){};document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';render();}
function setDark(d){DARK=d;document.body.classList.toggle('dark',d);}
window.addEventListener('message',e=>{const d=e.data||{};if(d.ehhub==='lang'&&(d.lang==='ar'||d.lang==='en'))setLang(d.lang);if(d.ehhub==='theme')setDark(d.theme==='dark');});
const fmtD=iso=>{if(!iso)return L('date n/a','بدون تاريخ');const d=new Date(iso+'T00:00:00');return d.toLocaleDateString(LANG==='ar'?'ar-SA-u-nu-latn':'en-GB',{day:'2-digit',month:'short',year:'numeric'});};
const daysAgo=iso=>iso?Math.floor((Date.now()-new Date(iso+'T00:00:00'))/864e5):null;
function bodyOf(id){return ((FEED&&FEED.bodies)||[]).find(b=>b.id===id)||{id,en:id,ar:id,short:id.toUpperCase()};}
function bodyState(b,cnt){ // "ok" only if a source delivered AND something is on file; finds that all fell outside the window are "stale"
 const ss=b.sources||[];if(!ss.length)return 'skipped';
 if(ss.some(s=>s.status==='ok'))return cnt>0?'ok':'stale';
 if(b.robots_disallow&&ss.every(s=>s.type==='spa'&&s.status!=='ok'))return ss.some(s=>s.status==='error')?'error':'empty';
 if(ss.some(s=>s.status==='empty'))return 'empty';
 if(ss.some(s=>s.status==='error'))return 'error';return 'skipped';}
function inWeek(it){return it.date?(it.date>=FEED.week_from&&it.date<=FEED.week_to):(it.first_seen>=FEED.week_from);} // own date decides; collection day only when the date is unknown
function inPeriod(it){if(S.period==='all')return true;if(S.period==='week')return inWeek(it);const n=daysAgo(it.date||it.first_seen);return n!=null&&n<=30;}
function filtered(){const k=it=>(it.date||it.first_seen||'');return (FEED.items||[]).filter(it=>(S.body==='all'||it.body===S.body)&&inPeriod(it)&&(S.tag==='all'||(it.tags||[]).includes(S.tag))&&(S.src==='all'||it.source===S.src)&&(!S.q||it.title.toLowerCase().includes(S.q.toLowerCase()))).sort((a,b)=>S.sort==='asc'?k(a).localeCompare(k(b)):k(b).localeCompare(k(a)));}
const KINDL={risk:['Risk','مخاطر'],opportunity:['Opportunity','فرصة'],licensing:['Licensing & compliance','ترخيص والتزام'],tender:['Tenders & investment','منافسات واستثمار'],watch:['Watch','متابعة']};
const monthName=m=>{const [y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString(LANG==='ar'?'ar-SA-u-nu-latn':'en-GB',{month:'long',year:'numeric'});};
function refLinks(refs){if(!FEED)return '';const by=Object.fromEntries((FEED.items||[]).map(it=>[it.id,it]));return (refs||[]).map((id,i)=>{const it=by[id];return it?`<a href="${esc(it.url)}" target="_blank" rel="noopener" title="${esc(it.title)}" class="ref">${i+1}</a>`:`<span class="ref miss" title="${esc(L('story no longer on file','القصة لم تعد على السجل'))}">${i+1}</span>`;}).join('');}
function renderBrief(){
 const el=$('brief'); if(!BRIEF||!(BRIEF.briefs||[]).length){el.innerHTML=`<h2>${L('Monthly brief','الخلاصة الشهرية')}</h2><div class="note">${L('Written on the first Sunday of each month by Business Development from that month\'s announcements, with a section on what it means for EH. No brief has been published yet.','تكتبها إدارة تطوير الأعمال أول أحد من كل شهر من إعلانات ذلك الشهر، مع قسم عن دلالاتها لآفاق البيئة. لم تُنشر خلاصة بعد.')}</div>`;return;}
 const list=[...BRIEF.briefs].sort((a,b)=>b.month.localeCompare(a.month)); if(!BRIEF_OPEN)BRIEF_OPEN=list[0].month;
 el.innerHTML=`<h2>${L('Monthly brief — what it means for EH','الخلاصة الشهرية — ماذا تعني لآفاق البيئة')}</h2>
 <div class="note">${L('Written by Business Development on the first Sunday of each month from that month\'s announcements. Numbered links point to the source stories below.','تكتبها إدارة تطوير الأعمال أول أحد من كل شهر من إعلانات ذلك الشهر. الروابط المرقّمة تشير إلى القصص المصدرية أدناه.')}</div>
 <div class="tabs" style="margin:8px 0 12px">${list.map(b=>`<button class="${BRIEF_OPEN===b.month?'on':''}" onclick="BRIEF_OPEN='${b.month}';render()">${esc(monthName(b.month))}</button>`).join('')}</div>
 ${list.filter(b=>b.month===BRIEF_OPEN).map(b=>`
  <div class="bsum" dir="auto">${esc(L(b.summary_en,b.summary_ar))}</div>
  ${b.coverage_en?`<div class="warn">${esc(L(b.coverage_en,b.coverage_ar))}</div>`:''}
  <div class="bgrid">
   <div><h3>${L('By body','حسب الجهة')}</h3>${(b.by_body||[]).map(x=>`<div class="bb"><span class="chip body">${esc(bodyOf(x.body).short)}</span> <span dir="auto">${esc(L(x.en,x.ar))}</span> ${refLinks(x.refs)}</div>`).join('')}</div>
   <div><h3>${L('What it means for EH','ماذا تعني لآفاق البيئة')}</h3>${(b.for_eh||[]).map(x=>`<div class="bb"><span class="chip kind-${esc(x.kind)}">${esc(L(...(KINDL[x.kind]||[x.kind,x.kind])))}</span> <span dir="auto">${esc(L(x.en,x.ar))}</span> ${refLinks(x.refs)}</div>`).join('')}</div>
  </div>
  <div class="bmeta">${L('Written','كُتبت')} <span dir="ltr">${esc(b.written||'')}</span> · ${esc(L(b.author_en,b.author_ar))}</div>`).join('')}`;}
function render(){
 document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
 $('title').textContent=L('Regulatory news — what the regulators announced','الأخبار التنظيمية — ما أعلنته الجهات التنظيمية');
 $('sub').textContent=L('Official releases from the bodies EH is licensed and inspected by, collected every Sunday morning. Headlines in the language they were published in.','البيانات الرسمية للجهات التي ترخّص آفاق البيئة وتفتّش عليها، تُجمع كل صباح أحد. العناوين بلغة نشرها.');
 if(!FEED){$('stamp').innerHTML='';$('kstrip').innerHTML='';$('bodies').innerHTML='';$('status').innerHTML='';renderBrief();
  $('feed').innerHTML=`<div class="empty">${LOADERR?esc(L('The weekly feed file (gov_news.json) could not be loaded. It is published by the Sunday workflow; if you opened this page as a local file, it is only available from the published hub.','لم يُحمَّل ملف التغذية الأسبوعي (gov_news.json). يُنشره سير العمل صباح الأحد؛ وإن فتحت الصفحة كملف محلي فهو متاح من المركز المنشور فقط.')):esc(L('Loading…','جارٍ التحميل…'))}</div>`;return;}
 const all=FEED.items||[], items=S.body==='all'?all:all.filter(it=>it.body===S.body), wk=items.filter(inWeek);
 const m30=items.filter(it=>{const n=daysAgo(it.date||it.first_seen);return n!=null&&n<=30;});
 const bodies=FEED.bodies||[], reporting=bodies.filter(b=>all.some(it=>it.body===b.id)).length, problems=bodies.reduce((n,b)=>n+(b.sources||[]).filter(s=>s.status==='error').length,0);
 $('stamp').innerHTML=`<span>${L('Collected','تاريخ الجمع')} <b dir="ltr">${esc(FEED.generated_ksa||FEED.generated)}</b></span><span>·</span><span>${L('Feed week','أسبوع التغذية')} <b dir="ltr">${fmtD(FEED.week_from)} – ${fmtD(FEED.week_to)}</b></span><span>·</span><span>${L('keeps','الاحتفاظ')} <b>${FEED.retention_days}</b> ${L('days','يوماً')}</span>`;
 $('kstrip').innerHTML=[[wk.length,L('Announcements this collection week','إعلانات في أسبوع التغذية')+(S.body!=='all'?' — '+esc(bodyOf(S.body).short):'')],[m30.length,L('In the last 30 days','خلال 30 يوماً')],[`${reporting} / ${bodies.length}`,L('Bodies with at least one item on file','جهات لديها عنصر واحد على الأقل')],[problems,L('Sources that failed on the last run','مصادر فشلت في آخر تشغيل')]].map(([v,l])=>`<div class="kc"><div class="v" dir="ltr">${v}</div><div class="l">${l}</div></div>`).join('');
 // bodies with freshness
 $('bodies').innerHTML=`<h2>${L('Bodies followed — click one to filter','الجهات المتابَعة — انقر للتصفية')}</h2><div class="note">${L('Green: items on file. Amber: sources reachable but nothing found. Red: a fetch failed. Grey: not fetched yet. Stories older than 90 days are kept only as each body\'s newest five and marked "archive".','أخضر: عناصر على السجل. كهرماني: المصادر متاحة دون عناصر. أحمر: فشل جلب. رمادي: لم يُجلب بعد. تُحفظ القصص الأقدم من 90 يوماً كأحدث خمس لكل جهة فقط وتُعلَّم «أرشيف».')}</div>
 <div class="bodies">${bodies.map(b=>{const cnt=all.filter(it=>it.body===b.id).length;const st=bodyState(b,cnt);const last=all.filter(it=>it.body===b.id).map(it=>it.date||it.first_seen).sort().pop();
  const sk=b.robots_disallow&&(st==='skipped'||st==='error')?'robots':st;return `<div class="bd ${S.body===b.id?'on':''}" onclick="S.body=S.body==='${b.id}'?'all':'${b.id}';render()"><div class="n">${esc(L(b.en,b.ar))}</div><div class="m"><span class="dot st-${sk}" title="${esc(L(...(STL[sk]||[sk,sk])))}"></span><span>${cnt} ${L('on file','على السجل')}</span><span>·</span><span>${last?L('latest','الأحدث')+' '+fmtD(last):L('none yet','لا شيء بعد')}</span>${b.robots_disallow?`<span>· ${L('via SPA','عبر واس')}</span>`:''}</div></div>`;}).join('')}</div>`;
 // feed
 const list=filtered();
 const tags=[...new Set(all.flatMap(it=>it.tags||[]))];
 $('feed').innerHTML=`<h2>${L('Announcements','الإعلانات')} <span style="opacity:.6;font-weight:600;font-size:13px">(${list.length})</span></h2>
 <div class="fl"><div class="tabs">${[['week',L('This feed week','هذا الأسبوع')],['30',L('Last 30 days','آخر 30 يوماً')],['all',L('Everything on file','كل السجل')]].map(([k,l])=>`<button class="${S.period===k?'on':''}" onclick="S.period='${k}';render()">${l}</button>`).join('')}</div>
  <select onchange="S.tag=this.value;render()"><option value="all">${L('All topics','كل المواضيع')}</option>${tags.map(t=>`<option value="${t}" ${S.tag===t?'selected':''}>${esc(L(...(TAGL[t]||[t,t])))}</option>`).join('')}</select>
  <select onchange="S.src=this.value;render()"><option value="all">${L('Official + SPA','رسمي + واس')}</option><option value="official" ${S.src==='official'?'selected':''}>${L('Official sites only','المواقع الرسمية فقط')}</option><option value="spa" ${S.src==='spa'?'selected':''}>${L('SPA only','واس فقط')}</option></select>
  <input placeholder="${L('Search headlines…','ابحث في العناوين…')}" value="${esc(S.q)}" oninput="S.q=this.value;render()">
  <select onchange="S.sort=this.value;render()" title="${L('Order by date','الترتيب حسب التاريخ')}"><option value="desc" ${S.sort==='desc'?'selected':''}>${L('Newest first','الأحدث أولاً')}</option><option value="asc" ${S.sort==='asc'?'selected':''}>${L('Oldest first','الأقدم أولاً')}</option></select>
  ${S.body!=='all'?`<button class="chip body" style="cursor:pointer;border:0" onclick="S.body='all';render()">${esc(bodyOf(S.body).short)} ✕</button>`:''}</div>
 ${list.length?list.map(it=>`<div class="it"><div class="d" dir="ltr">${fmtD(it.date)}${!it.date?`<small>${L('seen','رُصد')} ${fmtD(it.first_seen)}</small>`:''}</div><div><div class="t" dir="auto" lang="${it.lang}"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></div><div class="meta"><span class="chip body">${esc(bodyOf(it.body).short)}</span><span class="chip src-${it.source}">${it.source==='official'?L('Official','رسمي'):L('SPA','واس')}</span><span class="chip lang">${it.lang==='ar'?'AR':'EN'}</span>${(it.tags||[]).map(t=>`<span class="chip tag">${esc(L(...(TAGL[t]||[t,t])))}</span>`).join('')}${(()=>{const n=daysAgo(it.date||it.first_seen);return n!=null&&n>FEED.retention_days?`<span class="chip lang" title="${esc(L('Kept because it is one of this body\'s newest stories on file','محفوظة لأنها من أحدث قصص هذه الجهة على السجل'))}">${L('archive','أرشيف')}</span>`:'';})()}</div></div></div>`).join('')
  :`<div class="empty">${S.period==='week'?L('No announcement was found for this selection in the collection week. That is a result, not a gap: the sources were checked on the date above.','لم يُرصد إعلان لهذا الاختيار في أسبوع التغذية. هذه نتيجة لا فجوة: فُحصت المصادر في التاريخ أعلاه.'):L('Nothing on file for this selection.','لا شيء على السجل لهذا الاختيار.')}</div>`}`;
 // status table
 $('status').innerHTML=`<summary>${L('Source status — last run','حالة المصادر — آخر تشغيل')}</summary><table class="t" style="margin-top:10px"><thead><tr><th>${L('Body','الجهة')}</th><th>${L('Source','المصدر')}</th><th>${L('Status','الحالة')}</th><th>${L('Found','وُجد')}</th><th>${L('New','جديد')}</th><th>${L('Note','ملاحظة')}</th></tr></thead><tbody>
 ${bodies.flatMap(b=>(b.sources||[]).map(s=>`<tr><td>${esc(b.short)}</td><td dir="ltr" style="word-break:break-all;max-width:360px">${esc(s.type.toUpperCase())} · ${esc(s.lang||'')} · ${esc((s.url||'').slice(0,90))}</td><td><span class="dot st-${s.status}"></span> ${esc(L(...(STL[s.status]||[s.status,s.status])))}</td><td dir="ltr">${s.count}</td><td dir="ltr">${s.new}</td><td>${esc(s.note||'')}</td></tr>`)).join('')}</tbody></table>
 ${bodies.some(b=>b.map_note)?`<div class="warn">${bodies.filter(b=>b.map_note).map(b=>esc(b.map_note)).join(' ')}</div>`:''}`;
 $('foot').textContent=L(FEED.note_en,FEED.note_ar);
 renderBrief();
}
document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';render();
fetch('reg_brief.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{BRIEF=j;render();}).catch(()=>{});
fetch('gov_news.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(j=>{FEED=j;render();}).catch(e=>{LOADERR=String(e);render();});
</script>
<script src="eh-shared.js" defer></script>
</body></html>
