const t=k=>(I18N[lang][k]??I18N.en[k]??k);
const fmt=n=>n==null?'—':new Intl.NumberFormat('en').format(n);
const fmtC=n=>{ if(n==null) return '—'; if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1)+'m'; if(n>=1e3) return (n/1e3).toFixed(0)+'k'; return String(n) };
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=(p,k)=>lang==='ar'&&p[k+'_ar']?p[k+'_ar']:(p[k+'_en']??p[k]??'');

/* ---------- projection ---------- */
const LON0=33.2,LON1=57.5,LAT0=15.2,LAT1=32.6, K=Math.cos(24.5*Math.PI/180);
const W=1000, H=Math.round(W*((LAT1-LAT0)/((LON1-LON0)*K)));
const px=lon=>(lon-LON0)/(LON1-LON0)*W, py=lat=>(LAT1-lat)/(LAT1-LAT0)*H;
const svg=document.getElementById('map');
let vb={x:0,y:0,w:W,h:H}; const fit=()=>{ const desk=innerWidth>900; vb={x:desk?-W*0.12:0,y:0,w:desk?W*1.15:W,h:desk?H*1.15:H}; applyVB() };
function applyVB(){ svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); svg.setAttribute('preserveAspectRatio','xMidYMid meet'); if(typeof scaleUI==='function') scaleUI() }
const NS='http://www.w3.org/2000/svg'; const el=(n,a={})=>{const e=document.createElementNS(NS,n); for(const k in a) e.setAttribute(k,a[k]); return e};
function ring(r){ return r.map((c,i)=>(i?'L':'M')+px(c[0]).toFixed(1)+' '+py(c[1]).toFixed(1)).join(' ')+'Z' }
const gBase=el('g'), gLanes=el('g'), gMk=el('g'), gLab=el('g');
svg.append(gBase,gLanes,gMk,gLab);
// graticule
for(let lon=35;lon<=55;lon+=5) gBase.append(el('path',{class:'grat',d:`M${px(lon)} 0V${H}`}));
for(let lat=16;lat<=32;lat+=4) gBase.append(el('path',{class:'grat',d:`M0 ${py(lat)}H${W}`}));
LAND.forEach(f=>{ const d=f.p.map(poly=>poly.map(ring).join(' ')).join(' '); gBase.append(el('path',{class:f.n==='Saudi Arabia'?'ksa':'land',d, 'fill-rule':'evenodd'})) });
// shipping corridors (schematic)
[[ [43.2,12.9],[40.2,18.5],[38.4,22.2],[36.5,26.5],[34.4,29.0] ],[ [56.4,26.2],[52.5,26.4],[50.9,27.0],[49.9,28.6],[48.4,29.6] ]].forEach(l=>gLanes.append(el('path',{class:'lane',d:l.map((c,i)=>(i?'L':'M')+px(c[0])+' '+py(c[1])).join(' ')})));
const seaLabels=[[37.6,20.2,'RED SEA','البحر الأحمر'],[51.4,27.8,'ARABIAN GULF','الخليج العربي']];
function drawSeaLabels(){ gLab.querySelectorAll('.sea-label').forEach(e=>e.remove()); seaLabels.forEach(s=>{const tx=el('text',{class:'sea-label',x:px(s[0]),y:py(s[1]),'text-anchor':'middle'}); tx.textContent=lang==='ar'?s[3]:s[2]; gLab.append(tx)}) }

/* ---------- markers ---------- */
const OPPC={High:'var(--green)',Medium:'var(--blue)',Low:'var(--grey)'};
const TIERC={1:'var(--blue)',2:'var(--green)',3:'var(--grey)'};
const COASTC={'Red Sea':'var(--blue)','Arabian Gulf':'var(--green)'};
let colorBy='opp';
const tonnes=p=>p.capacity?.cargo_tonnes_latest||0;
const maxT=Math.max(...P.map(tonnes));
const rad=p=>{ if(p.tier===3) return 6; const v=tonnes(p); return v? 6+Math.sqrt(v/maxT)*22 : 7 };
const colorOf=p=>colorBy==='opp'?OPPC[p.eh?.opportunity?.score||'Low']:colorBy==='tier'?TIERC[p.tier]:COASTC[p.coast]||'var(--grey)';
const MK={};
function scaleUI(){ const cw=svg.clientWidth||1000, ch=svg.clientHeight||700; const k=Math.max(vb.w/cw, vb.h/ch); const zoomed=vb.w<W*0.55; const boxes=[];
  Object.values(MK).sort((a,b)=>a.p.tier-b.p.tier||tonnes(b.p)-tonnes(a.p)).forEach(({core,halo,p,lab,r0,g})=>{ const r=r0*k, x=p._x, y=p._y;
    if(p.tier===2){ core.setAttribute('x',x-r*.85); core.setAttribute('y',y-r*.85); core.setAttribute('width',r*1.7); core.setAttribute('height',r*1.7) } else core.setAttribute('r',r);
    const rtl=lang==='ar'; halo.setAttribute('r',r+5*k); lab.setAttribute('x',rtl?x-r-4*k:x+r+4*k); lab.setAttribute('text-anchor',rtl?'end':'start'); lab.setAttribute('y',y+4*k); lab.style.fontSize=(10.5*k)+'px'; lab.style.strokeWidth=(3*k)+'px';
    let show=zoomed||(p.tier<3&&(tonnes(p)>=1e7||p.id==='port-of-neom'));
    if(show&&!g.classList.contains('dim')){ const w=(lab.textContent||'').length*6*k, h=12*k; const bx=rtl?x-r-w:x+r, by=y-h/2; if(boxes.some(b=>bx<b.x+b.w&&bx+w>b.x&&by<b.y+b.h&&by+h>b.y)) show=false; else boxes.push({x:bx,y:by,w,h}) }
    lab.classList.toggle('hid',!show) });
  gLab.querySelectorAll('.sea-label').forEach(e=>{ e.style.fontSize=(11*k)+'px' }) }
// spread overlapping markers slightly
const placed=[];
function pos(p){ let x=px(p.lon),y=py(p.lat); for(const q of placed){ if(Math.hypot(q.x-x,q.y-y)<12){ x+=10; y+=8 } } placed.push({x,y}); return {x,y} }
P.filter(p=>p.lat!=null&&p.lon!=null).sort((a,b)=>tonnes(b)-tonnes(a)).forEach(p=>{
  const {x,y}=pos(p); p._x=x;p._y=y;
  const g=el('g',{class:'mk t'+p.tier,'data-id':p.id,tabindex:'0',role:'button'}); const r=rad(p);
  const halo=el('circle',{class:'halo',cx:x,cy:y,r:r+5,stroke:'var(--fg)'});
  let core;
  if(p.tier===2){ core=el('rect',{class:'core',x:x-r*.85,y:y-r*.85,width:r*1.7,height:r*1.7,transform:`rotate(45 ${x} ${y})`}) }
  else core=el('circle',{class:'core',cx:x,cy:y,r});
  g.append(halo,core); gMk.append(g); MK[p.id]={g,core,halo,p,r0:r};
  const lab=el('text',{class:'plabel',x:x+r+4,y:y+4}); lab.dataset.id=p.id; gLab.append(lab); MK[p.id].lab=lab;
  g.addEventListener('click',()=>open(p.id,true)); g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(p.id,true)}});
  g.addEventListener('pointerenter',e=>showTip(p,e)); g.addEventListener('pointermove',e=>moveTip(e)); g.addEventListener('pointerleave',hideTip);
});
function paint(){ Object.values(MK).forEach(({core,p,lab})=>{ core.setAttribute('fill',colorOf(p)); core.setAttribute('stroke',p.tier===3?colorOf(p):'var(--panel-solid)'); lab.textContent=shortName(p) }) }
function shortName(p){ const n=L(p,'name'); if(p.tier===3) return n.replace(/\s*\(.*$/,'').replace(/\s+—\s+/,' · ').slice(0,40); return n.replace(/\s*[—(].*$/,'').replace(/^(ميناء|Port of)\s+/,'').slice(0,28) }

/* ---------- tooltip ---------- */
const tip=document.getElementById('tip');
function showTip(p,e){ tip.hidden=false; tip.innerHTML=`<b>${esc(L(p,'name'))}</b><br><span style="color:var(--muted)">${esc(t('t'+p.tier))} · ${esc(tonnes(p)?fmtC(tonnes(p))+' t':'—')} · ${esc(t(p.eh?.opportunity?.score||'Low'))}</span>`; moveTip(e) }
function moveTip(e){ const x=Math.min(e.clientX+14,innerWidth-250), y=e.clientY+14; tip.style.left=x+'px'; tip.style.top=y+'px' }
function hideTip(){ tip.hidden=true }

/* ---------- pan / zoom ---------- */
let drag=null;
svg.addEventListener('pointerdown',e=>{ if(e.target.closest('.mk')) return; drag={x:e.clientX,y:e.clientY,vb:{...vb}}; svg.setPointerCapture(e.pointerId) });
svg.addEventListener('pointermove',e=>{ if(!drag) return; const s=vb.w/svg.clientWidth; vb.x=drag.vb.x-(e.clientX-drag.x)*s; vb.y=drag.vb.y-(e.clientY-drag.y)*s; applyVB() });
svg.addEventListener('pointerup',()=>drag=null); svg.addEventListener('pointercancel',()=>drag=null);
function zoom(f,cx,cy){ const nw=Math.min(W*1.6,Math.max(W/9,vb.w*f)); const k=nw/vb.w; cx=cx??vb.x+vb.w/2; cy=cy??vb.y+vb.h/2; vb.x=cx-(cx-vb.x)*k; vb.y=cy-(cy-vb.y)*k; vb.w=nw; vb.h*=k; applyVB() }
svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); const s=vb.w/r.width; zoom(e.deltaY>0?1.15:0.87, vb.x+(e.clientX-r.left)*s, vb.y+(e.clientY-r.top)*s) },{passive:false});
document.getElementById('zin').onclick=()=>zoom(.75); document.getElementById('zout').onclick=()=>zoom(1.33); document.getElementById('zfit').onclick=fit;
function flyTo(p){ const target=Math.max(W/5,vb.w>W/3?W/3:vb.w); vb.w=target; vb.h=target*H/W; vb.x=p._x-vb.w*(innerWidth>900?0.42:0.5); vb.y=p._y-vb.h*0.5; applyVB() }

/* ---------- filters ---------- */
const F={tier:new Set([1,2,3]),coast:new Set(['Red Sea','Arabian Gulf']),opp:new Set(['High','Medium','Low']),bid:null,q:''};
function chips(id,items,get,set,single){ const c=document.getElementById(id); c.innerHTML=''; items.forEach(([v,label])=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=label; b.setAttribute('aria-pressed',String(get(v))); b.onclick=()=>{ set(v); render() }; c.append(b) }) }
function bidStatuses(p){ return new Set((p.eh?.bids||[]).map(b=>b.status)) }
function buildFilters(){
  chips('f-tier',[[1,t('t1')],[2,t('t2')],[3,t('t3')]],v=>F.tier.has(v),v=>F.tier.has(v)?F.tier.delete(v):F.tier.add(v));
  chips('f-coast',[['Red Sea',t('red')],['Arabian Gulf',t('gulf')]],v=>F.coast.has(v),v=>F.coast.has(v)?F.coast.delete(v):F.coast.add(v));
  chips('f-opp',[['High',t('High')],['Medium',t('Medium')],['Low',t('Low')]],v=>F.opp.has(v),v=>F.opp.has(v)?F.opp.delete(v):F.opp.add(v));
  chips('f-bid',[['any',t('anybid')],['won',t('won')],['submitted',t('submitted')],['lost',t('lost')],['none',t('none')]],v=>F.bid===v,v=>F.bid=F.bid===v?null:v);
  chips('f-color',[['opp',t('byOpp')],['tier',t('byTier')],['coast',t('byCoast')]],v=>colorBy===v,v=>{colorBy=v});
}
function hay(p){ return [p.name_en,p.name_ar,p.authority_en,p.owner_en,...(p.terminals||[]).map(x=>x.name+' '+x.operator),...(p.eh?.stakeholders||[]).map(s=>s.name),...(p.eh?.mwan_licensees?.companies||[]).map(c=>c.name_ar),...(p.environment?.waste_contractors||[]).map(c=>c.company)].join(' ').toLowerCase() }
function visible(p){ if(!F.tier.has(p.tier)||!F.coast.has(p.coast)||!F.opp.has(p.eh?.opportunity?.score||'Low')) return false;
  if(F.bid){ const s=bidStatuses(p); if(F.bid==='any'&&!s.size) return false; if(F.bid==='none'&&s.size) return false; if(F.bid!=='any'&&F.bid!=='none'&&!s.has(F.bid)) return false }
  if(F.q&&!hay(p).includes(F.q)) return false; return true }
document.getElementById('q').addEventListener('input',e=>{F.q=e.target.value.trim().toLowerCase(); render()});

/* ---------- list + KPIs ---------- */
const TI=`<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="currentColor"/></svg>`, TD=`<svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" transform="rotate(45 8 8)" fill="currentColor"/></svg>`, TO=`<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 2"/></svg>`;
function render(){
  buildFilters(); paint(); drawSeaLabels();
  const vis=P.filter(visible); const ids=new Set(vis.map(p=>p.id));
  Object.values(MK).forEach(({g,p,lab})=>{ g.classList.toggle('dim',!ids.has(p.id)); lab.style.display=ids.has(p.id)?'':'none' }); scaleUI();
  const ul=document.getElementById('plist'); ul.innerHTML='';
  vis.sort((a,b)=>a.tier-b.tier||tonnes(b)-tonnes(a)).forEach(p=>{ const li=document.createElement('li'); li.innerHTML=`<button data-id="${p.id}" aria-current="${p.id===cur}"><span style="color:${colorOf(p)}">${p.tier===1?TI:p.tier===2?TD:TO}</span><span class="n">${esc(L(p,'name'))}</span><span class="m num">${tonnes(p)?fmtC(tonnes(p))+' t':esc(t(p.eh?.opportunity?.score||'Low'))}</span></button>`; li.querySelector('button').onclick=()=>open(p.id,true); ul.append(li) });
  document.getElementById('cnt').textContent=`${vis.length} ${t('ofPorts')} ${P.length} ${t('ports')}`;
  // KPIs
  const teu=vis.reduce((s,p)=>s+(p.capacity?.teu_actual_latest||0),0), ton=vis.reduce((s,p)=>s+(tonnes(p)||0),0);
  const marp=vis.filter(p=>{const m=p.eh?.marpol_overlay||{}; const e=p.environment?.marpol_reception||{}; return [m,e].some(o=>['annex_i_oily','annex_ii_nls','annex_iv_sewage','annex_v_garbage','annex_vi'].some(k=>o[k]===true))}).length;
  const bids=vis.filter(p=>(p.eh?.bids||[]).length).length, high=vis.filter(p=>p.eh?.opportunity?.score==='High').length;
  document.getElementById('kpis').innerHTML=[
    ['',fmt(vis.length),t('kPorts'),''],['',fmtC(teu),t('kTeu'),t('teuNote')],['',fmtC(ton),t('kTon'),t('tonNote')],['g',fmt(marp),t('kMarpol'),''],['g',fmt(bids),t('kBids'),''],['g',fmt(high),t('kHigh'),'']
  ].map(([c,v,l,s])=>`<div class="kpi ${c}"><b class="num">${v}</b><span>${esc(l)}</span>${s?`<small>${esc(s)}</small>`:''}</div>`).join('');
  document.getElementById('legend').innerHTML=`<div class="row">${TI.replace('currentColor','var(--fg)')}<span>${t('t1')}</span></div><div class="row">${TD.replace('currentColor','var(--fg)')}<span>${t('t2')}</span></div><div class="row">${TO.replace('currentColor','var(--fg)')}<span>${t('t3')}</span></div>`+
    (colorBy==='opp'?`<div class="row"><i class="sw" style="background:var(--green)"></i>${t('High')}</div><div class="row"><i class="sw" style="background:var(--blue)"></i>${t('Medium')}</div><div class="row"><i class="sw" style="background:var(--grey)"></i>${t('Low')}</div>`:
     colorBy==='tier'?``:`<div class="row"><i class="sw" style="background:var(--blue)"></i>${t('red')}</div><div class="row"><i class="sw" style="background:var(--green)"></i>${t('gulf')}</div>`);
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n)); document.getElementById('q').placeholder=t('search');
  document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.getElementById('lang-en').setAttribute('aria-pressed',String(lang==='en')); document.getElementById('lang-ar').setAttribute('aria-pressed',String(lang==='ar'));
  setTop(); if(cur) renderDossier(cur); else renderIntro(); if(view==='co') renderCompanies(); if(view==='guide') renderGuide(); if(view==='mk') renderMarket();
}
function setTop(){ document.documentElement.style.setProperty('--topH',document.getElementById('top').offsetHeight+'px') }
addEventListener('resize',setTop);

/* ---------- dossier ---------- */
let cur=null, tab='overview';
const railr=document.getElementById('railr');
function open(id,fly){ cur=id; const p=P.find(x=>x.id===id); if(!p) return; Object.values(MK).forEach(m=>m.g.classList.toggle('sel',m.p.id===id)); document.querySelectorAll('#plist button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===id))); if(fly&&p._x!=null) flyTo(p); try{history.replaceState(null,'','#'+id)}catch(e){} renderDossier(id) }
function src(ids,p){ if(!ids||!ids.length) return ''; return ids.map(i=>`<a class="cite" title="${esc((p.sources||[]).find(s=>s.id===i)?.title||i)}" data-src="${esc(i)}">[${esc(i)}]</a>`).join('') }
function kv(rows){ return `<dl class="kv">${rows.filter(r=>r[1]!=null&&r[1]!=='').map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>` }
function trendChart(p){ const tr=(p.trend||[]).filter(x=>x.tonnes||x.teu); if(tr.length<2) return ''; const nT=tr.filter(x=>x.tonnes).length, nU=tr.filter(x=>x.teu).length; const useT=nT>nU; const tr2=tr.filter(x=>useT?x.tonnes:x.teu); if(tr2.length<2) return ''; tr.length=0; tr.push(...tr2); const vals=tr.map(x=>useT?x.tonnes:x.teu).map(v=>v||0); const mx=Math.max(...vals); const w=380,h=120,pad=28,bw=Math.min(40,(w-pad*2)/tr.length-8);
  const bars=tr.map((x,i)=>{ const v=vals[i]; const bh=mx?(v/mx)*(h-40):0; const bx=pad+i*((w-pad*2)/tr.length)+((w-pad*2)/tr.length-bw)/2; return `<rect class="bar ${useT?'t':''}" x="${bx}" y="${h-20-bh}" width="${bw}" height="${bh}" rx="3"/><text x="${bx+bw/2}" y="${h-7}" text-anchor="middle">${x.year}</text>${v?`<text x="${bx+bw/2}" y="${h-24-bh}" text-anchor="middle">${fmtC(v)}</text>`:''}` }).join('');
  return `<div class="sec"><h3>${t('trend')} · ${useT?t('tonnes'):'TEU'}</h3><svg class="chart" viewBox="0 0 ${w} ${h}" role="img"><line class="ax" x1="${pad}" x2="${w-pad}" y1="${h-20}" y2="${h-20}"/>${bars}</svg></div>` }
function marpolBlock(p){ const m=p.eh?.marpol_overlay||{}, e=p.environment?.marpol_reception||{}; const keys=[['annex_i_oily','aI'],['annex_ii_nls','aII'],['annex_iv_sewage','aIV'],['annex_v_garbage','aV'],['annex_vi','aVI']];
  const cell=([k,l])=>{ const v=m[k]===true||e[k]===true?true:(m[k]===false||e[k]===false?false:null); return `<div class="${v===true?'y':v===false?'n':''}"><b>${v===true?t('confirmed'):v===false?t('no'):'—'}</b>${t(l)}</div>` };
  const op=m.operator||e.operator; return `<div class="sec"><h3>${t('marpol')}</h3><div class="marp">${keys.map(cell).join('')}</div>${op?`<div class="note">${t('oper')}: ${esc(op)}</div>`:''}${(m.note||e.capacity_note)?`<div class="note">${esc(m.note||e.capacity_note)}</div>`:''}<div class="note" style="font-size:11.5px">${t('marpolNote')}</div></div>` }
function gisisBlock(p){ const g=p.eh?.gisis; if(!g) return ''; if(!g.facility_count) return `<div class="sec"><h3>${t('gisisT')}</h3><div class="note">${esc(g.port_name)} — ${t('gisisNone')}</div></div>`;
  const rows=g.providers.map(pr=>`<tr><td><b>${esc(pr.provider)}</b><br><span style="color:var(--muted);font-size:11px">${esc(pr.email||'')}${pr.phone?' · '+esc(pr.phone):''}</span></td><td>${pr.n} ${t('wastes')}<br><span style="color:var(--muted);font-size:11px">${esc(pr.facility_types.join(', '))}</span></td><td style="font-size:11.5px">${pr.availability?esc(pr.availability)+'<br>':''}${pr.notice_h?t('notice')+' '+esc(pr.notice_h)+' h<br>':''}${pr.info?esc(pr.info):''}</td></tr>`).join('');
  const ann=['I','II','IV','V','VI','BWM'].map(a=>{const x=g.annex[a]; return `<span class="chip" style="${x.declared?'background:var(--ok);color:#fff;border-color:transparent':''}">${t('ann'+a)}</span>`}).join('');
  return `<div class="sec"><h3>${t('gisisT')}</h3><div class="ctx"><b>${esc(g.port_name)}</b> · ${g.facility_count} ${t('wastes')} · ${t('decl')} ${esc(g.updated)}</div>${g.alleged_inadequacies?`<div class="note" style="border-inline-start:3px solid var(--warn);color:var(--fg)">⚠ ${t('inad')}</div>`:''}<div class="chips" style="margin:6px 0">${ann}</div><div class="tblwrap"><table class="tbl"><tr><th>${t('oper')}</th><th>${t('scope')}</th><th>${t('avail')}</th></tr>${rows}</table></div>${p.eh.gisis_secondary?`<div class="note">${esc(p.eh.gisis_secondary.port_name)}: ${p.eh.gisis_secondary.facility_count} ${t('wastes')} · ${esc(p.eh.gisis_secondary.providers.map(x=>x.provider).join(', '))}${p.eh.gisis_secondary.alleged_inadequacies?' · ⚠ '+t('inad'):''}</div>`:''}<div class="note" style="font-size:11.5px">${t('gisisNote')}</div></div>` }
function renderIntro(){ railr.innerHTML=`<div class="intro"><h2>${t('welcome')}</h2><ul><li>${t('w1')}</li><li>${t('w2')}</li><li>${t('w3')}</li><li>${t('w4')}</li></ul><p>${t('chooser')}</p><button class="chip" id="natbtn" style="margin-top:4px">${t('natT')} ↗</button></div>`; railr.querySelector('#natbtn').onclick=renderNational }
function renderNational(){ cur=null; const n=DATA.national, ov=DATA.overlay; const reg=ov.regulatory_frame.map(r=>`<tr><td><b>${esc(lang==='ar'&&r.body_ar?r.body_ar:r.body_en)}</b><br><span style="color:var(--muted)">${esc(r.instrument)}</span></td><td>${esc(r.what_it_requires_at_ports)}</td></tr>`).join('');
  const sig=ov.market_signals.map(s=>`<li><b>${esc(s.signal)}</b><br><span style="color:var(--muted)">${esc(s.relevance_to_eh)}</span></li>`).join('');

  const nb=(DATA.national_bids||[]).map(b=>bidRow(b)).join('');
  railr.innerHTML=`<header><div class="ttl"><h2>${t('natT')}<span class="ar">${t('natB')}</span></h2><button class="iconbtn" id="closer" aria-label="Close">×</button></div></header><div class="body">
   <div class="sec"><p class="ctx">${esc(n.status_note)}</p></div>
   <div class="sec"><h3>${t('regl')}</h3><div class="tblwrap"><table class="tbl">${reg}</table></div></div>
   <div class="sec"><h3>${t('sig')}</h3><ul class="gaps" style="padding-inline-start:16px">${sig}</ul></div>
   ${DATA.gisis_saudi?`<div class="sec"><h3>${t('gisisT')}</h3><div class="tblwrap"><table class="tbl"><tr><th>${t('oper')}</th><th class="num">${t('wastes')}</th><th>Ports (UN/LOCODE)</th></tr>${DATA.gisis_saudi.providers.map(x=>`<tr><td><b>${esc(x.provider)}</b></td><td class="num">${x.declared_waste_type_entries}</td><td>${esc(x.ports.join(', '))}</td></tr>`).join('')}</table></div><div class="note" style="font-size:11.5px">${t('gisisNote')} ${esc(DATA.gisis_saudi.ports_listed_without_records.length)} LOCODEs listed without facilities, incl. SARTA, SAJUT.</div></div>`:''}
   <div class="sec"><h3>${t('comp')}</h3><div class="tblwrap"><table class="tbl"><tr><th>${t('company')}</th><th>Ports</th><th>${t('scope')}</th></tr>${comp}</table></div></div>
   <div class="sec"><h3>${t('natBids')}</h3><div class="tblwrap"><table class="tbl"><tr><th>#</th><th>${t('bid')}</th><th>${t('client')}</th><th class="num">${t('priceH')}</th><th>${t('result')}</th></tr>${nb}</table></div></div>
   <div class="sec"><h3>${t('prop')} (${DATA.stakeholder_proposals.length})</h3><div class="tblwrap"><table class="tbl">${prop}</table></div></div>
   <div class="sec"><h3>${t('flags')}</h3><ul class="gaps">${DATA.workbook_flags.map(f=>`<li><b>${esc(f.row)}</b> — ${esc(f.issue)}</li>`).join('')}</ul></div>
   <div class="sec"><h3>${t('srcT')}</h3><ol class="src">${(n.sources||[]).concat(ov.sources||[]).map(s=>`<li><span class="id">${esc(s.id)}</span>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`:esc(s.title)} <span style="color:var(--muted)">${esc(s.publisher||'')} ${s.year||''}</span></li>`).join('')}</ol></div>
  </div>`; railr.querySelector('#closer').onclick=renderIntro; Object.values(MK).forEach(m=>m.g.classList.remove('sel')) }
function bidRow(b){ return `<tr><td class="num">${b.sn}</td><td>${esc(b.title)}</td><td>${esc(b.client)}</td><td class="num">${b.eh_price_sar_exvat!=null?fmt(b.eh_price_sar_exvat):'—'}</td><td><span class="pill ${b.status}">${t(b.status)}</span>${b.winner&&b.status!=='won'?`<br><span style="color:var(--muted);font-size:11px">${t('winner')}: ${esc(b.winner)}</span>`:''}${b.reason?`<br><span style="color:var(--muted);font-size:11px">${esc(b.reason)}</span>`:''}</td></tr>` }
function renderDossier(id){ const p=P.find(x=>x.id===id); if(!p) return; const o=p.eh||{}; const opp=o.opportunity||{};
  const tabs=[['overview',t('overview')],['capacity',t('capacity')],['trade',t('trade')],['env',t('env')],['eh',t('eh')],['sources',t('sources')]];
  let body='';
  if(tab==='overview'){ const mc=p.mawani_card;
    body=`<div class="sec">${kv([[t('authority'),esc((lang==='ar'&&p.authority_ar)||p.authority_en||'')+(p.owner_en&&p.owner_en!==p.authority_en?`<br><span style="color:var(--muted)">${esc(p.owner_en)}</span>`:'')],[t('status'),esc(p.status)+(p.status_note?`<br><span style="color:var(--muted)">${esc(p.status_note)}</span>`:'')],[t('coastL'),esc(p.coast==='Red Sea'?t('red'):t('gulf'))],[t('region'),esc(L(p,'region'))+(L(p,'city')?' · '+esc(L(p,'city')):'')],[t('conf'),esc(p.confidence||'')]])}</div>
    ${mc?`<div class="sec"><h3>${t('mawaniCard')}</h3><div class="stat4">${[[mc.area_km2!=null?mc.area_km2+' km²':null,t('area')],[mc.berths,t('berths')],[mc.terminals,t('termN')],[mc.design_capacity_mt!=null?mc.design_capacity_mt+' Mt':null,t('design')]].filter(x=>x[0]!=null).map(([v,l])=>`<div><b class="num">${v}</b><span>${l}</span></div>`).join('')}</div><div class="note">${esc(lang==='ar'?mc.notes_ar:mc.notes_en)}${src(mc.src,p)}</div></div>`:''}
    ${(p.terminals||[]).length?`<div class="sec"><h3>${t('terminals')}</h3><div class="tblwrap"><table class="tbl">${p.terminals.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span style="color:var(--muted)">${esc(x.type||'')}${x.concession_start?` · ${x.concession_start}–${x.concession_end||'?'}`:''}</span></td><td>${esc(x.operator||'—')}${src(x.src,p)}</td></tr>`).join('')}</table></div></div>`:''}
    ${(p.key_roles||[]).length?`<div class="sec"><h3>${t('roles')}</h3>${kv(p.key_roles.map(r=>[r.role+(r.org?' · '+r.org:''),esc(r.name||'—')+src(r.src,p)]))}</div>`:''}
    ${(p.facilities||[]).length?`<div class="sec"><h3>${t('facilities')}</h3><div class="chips">${p.facilities.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div></div>`:''}
    ${(p.related||[]).length?`<div class="sec"><h3>${t('related')}</h3><div class="chips">${p.related.map(r=>{const q=P.find(x=>x.id===r); return q?`<button class="chip" data-go="${r}">${esc(L(q,'name'))}</button>`:''}).join('')}</div></div>`:''}
    ${p.environment?.env_notes_en?`<div class="note"><b>${t('analyst')}</b><br>${esc(lang==='ar'&&p.environment.env_notes_ar?p.environment.env_notes_ar:p.environment.env_notes_en)}</div>`:''}`;
  } else if(tab==='capacity'){ const c=p.capacity||{};
    body=`<div class="sec"><div class="stat4">${[[c.teu_actual_latest!=null?fmtC(c.teu_actual_latest):null,`${t('teu')} ${c.teu_year||''}`],[c.cargo_tonnes_latest!=null?fmtC(c.cargo_tonnes_latest)+' t':null,`${t('tonnes')} ${c.cargo_year||''}`],[c.teu_design!=null?fmtC(c.teu_design):null,`TEU ${t('design')}`],[p.berths,t('berths')],[p.max_draft_m!=null?p.max_draft_m+' m':null,t('draft')],[p.quay_length_m!=null?fmt(p.quay_length_m)+' m':null,t('quay')],[c.liquid_bulk_tonnes!=null?fmtC(c.liquid_bulk_tonnes)+' t':null,'Liquid bulk'],[c.dry_bulk_tonnes!=null?fmtC(c.dry_bulk_tonnes)+' t':null,'Dry bulk'],[c.passengers!=null?fmtC(c.passengers):null,'Passengers']].filter(x=>x[0]!=null).map(([v,l])=>`<div><b class="num">${v}</b><span>${esc(l)}</span></div>`).join('')||`<div class="note">${t('notfound')}</div>`}</div>${src(c.src,p)}</div>${trendChart(p)}
    ${(p.trend||[]).length?`<div class="sec"><div class="tblwrap"><table class="tbl"><tr><th>${t('year')}</th><th class="num">TEU</th><th class="num">t</th></tr>${p.trend.map(x=>`<tr><td>${x.year}</td><td class="num">${fmt(x.teu)}</td><td class="num">${fmt(x.tonnes)}</td></tr>`).join('')}</table></div></div>`:''}`;
  } else if(tab==='trade'){ const tr=p.trade||{};
    const list=a=>(a||[]).length?`<ul class="gaps" style="padding-inline-start:16px">${a.map(x=>`<li><b style="color:var(--fg)">${esc(lang==='ar'&&x.commodity_ar?x.commodity_ar:x.commodity_en)}</b>${x.note?` — ${esc(x.note)}`:''}${src(x.src,p)}</li>`).join('')}</ul>`:`<div class="note">${t('notfound')}</div>`;
    body=`<div class="sec"><h3>${t('exports')}</h3>${list(tr.exports)}</div><div class="sec"><h3>${t('imports')}</h3>${list(tr.imports)}</div>
    ${(tr.shipping_lines||[]).length?`<div class="sec"><h3>${t('lines')}</h3>${kv(tr.shipping_lines.map(s=>[s.line,esc(s.service||'')+src(s.src,p)]))}</div>`:''}
    ${(tr.trade_lanes||[]).length||(tr.partner_countries||[]).length?`<div class="sec"><h3>${t('lanes')}</h3><div class="chips">${(tr.trade_lanes||[]).concat(tr.partner_countries||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`:''}
    ${L(tr,'hinterland')?`<div class="sec"><h3>${t('hinter')}</h3><p class="ctx">${esc(L(tr,'hinterland'))}</p></div>`:''}`;
  } else if(tab==='env'){ const e=p.environment||{}; const wc=(e.waste_contractors||[]).concat((o.waste_contractors_overlay||[]).map(x=>({company:(lang==='ar'&&x.company_ar)||x.company_en,scope:x.scope,status:x.contract_status,src:x.src})));
    const ml=o.mwan_licensees; const s=ml?.summary;
    body=`${marpolBlock(p)}${gisisBlock(p)}${(p.eh&&p.eh.complaints)?`<div class="sec"><h3>${t('cmpPort')} (${p.eh.complaints.length})</h3>${cmpTable(p.eh.complaints)}</div>`:''}
    <div class="sec"><h3>${t('contractors')}</h3>${wc.length?`<div class="tblwrap"><table class="tbl"><tr><th>${t('company')}</th><th>${t('scope')}</th><th>${t('ctr')}</th></tr>${wc.map(x=>`<tr><td><b>${esc(x.company)}</b></td><td>${esc(x.scope||'')}</td><td>${esc(x.status||'')}</td></tr>`).join('')}</table></div>`:`<div class="note">${t('notfound')}</div>`}</div>
    ${s?`<div class="sec"><h3>${t('mwan')}</h3><div class="stat4"><div><b class="num">${s.companies}</b><span>${t('mwanSum')}</span></div><div><b class="num">${s.collectors}</b><span>${t('collectors')}</span></div><div><b class="num">${s.treaters}</b><span>${t('treaters')}</span></div><div><b class="num">${s.oily_waste_capable}</b><span>${t('oily')}</span></div><div><b class="num">${s.in_stakeholder_map}</b><span>${t('inmap')}</span></div></div>${s.eh_present?`<div class="note opp">${t('ehhere')}</div>`:''}
      ${ml.companies.length?`<details style="margin-top:6px"><summary style="cursor:pointer;font-size:12.5px;color:var(--blue-ink)">${t('company')} (${ml.companies.length})</summary><div class="tblwrap"><table class="tbl"><tr><th>${t('company')}</th><th>${t('streams')}</th><th>${t('expiry')}</th></tr>${ml.companies.map(c=>`<tr><td>${esc(c.name_ar)}${c.is_eh?' ★':''}<br><span style="color:var(--muted);font-size:11px">${esc(c.cities.join(', '))} · ${esc(c.activities.join(' · '))}</span></td><td>${esc(c.streams.join(', '))}</td><td class="num">${esc(c.earliest_expiry||'—')}</td></tr>`).join('')}</table></div></details>`:''}<div class="note" style="font-size:11.5px">${t('mwanNote')}</div></div>`:''}
    ${(e.regulators||[]).length?`<div class="sec"><h3>${t('regulators')}</h3>${kv(e.regulators.map(r=>[r.body,esc(r.touchpoint)+src(r.src,p)]))}</div>`:''}
    ${(e.industrial_generators_nearby||[]).length?`<div class="sec"><h3>${t('gens')}</h3><div class="chips">${e.industrial_generators_nearby.map(g=>`<span class="chip" title="${esc(g.type)}">${esc(g.name)}</span>`).join('')}</div></div>`:''}`;
  } else if(tab==='eh'){
    body=`${opp.score?`<div class="sec"><h3>${t('oppTitle')}</h3><div class="note opp"><span class="badge opp-${opp.score}">${t(opp.score)}</span><br>${esc(lang==='ar'?opp.rationale_ar:opp.rationale_en)}</div></div>`:''}
    <div class="sec"><h3>${t('stake')}</h3>${(o.stakeholders||[]).length?`<div class="tblwrap"><table class="tbl"><tr><th>${t('company')}</th><th>${t('catg')}</th><th class="num">${t('val')}</th><th class="num">${t('enc')}</th></tr>${o.stakeholders.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.category||'')}${s.tier?' · '+esc(s.tier):''}</td><td class="num">${s.client_value_sar!=null?fmt(Math.round(s.client_value_sar)):'—'}</td><td class="num">${s.bid_encounters||0}</td></tr>`).join('')}</table></div>`:`<div class="note">${t('noStk')}</div>`}</div>
    <div class="sec"><h3>${t('bids')}</h3>${(o.bids||[]).length?`<div class="tblwrap"><table class="tbl"><tr><th>#</th><th>${t('bid')}</th><th>${t('client')}</th><th class="num">${t('priceH')}</th><th>${t('result')}</th></tr>${o.bids.map(bidRow).join('')}</table></div>`:`<div class="note">${t('noBids')}</div>`}</div>`;
  } else { body=`<div class="sec"><h3>${t('srcT')}</h3><ol class="src">${(p.sources||[]).map(s=>`<li id="s-${esc(s.id)}"><span class="id">${esc(s.id)}</span>${s.url&&/^https?:/.test(s.url)?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`:esc(s.title)} <span style="color:var(--muted)">${esc(s.publisher||'')} ${s.year||''}</span></li>`).join('')}</ol></div>
    <div class="sec"><h3>${t('gapsT')}</h3><ul class="gaps">${(p.gaps||[]).map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>` }
  railr.innerHTML=`<header><div class="ttl"><h2>${esc(lang==='ar'?p.name_ar:p.name_en)}<span class="ar">${esc(lang==='ar'?p.name_en:p.name_ar)}</span></h2><button class="iconbtn" id="copy" title="${t('copy')}" aria-label="${t('copy')}">⧉</button><button class="iconbtn" id="closer" aria-label="Close">×</button></div>
    <div class="badges"><span class="badge">${t('t'+p.tier)}</span><span class="badge">${p.coast==='Red Sea'?t('red'):t('gulf')}</span>${opp.score?`<span class="badge opp-${opp.score}">${t('opp')}: ${t(opp.score)}</span>`:''}${(o.bids||[]).length?`<span class="badge">${o.bids.length} ${t('bidsShort')}</span>`:''}</div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join('')}</div></header><div class="body">${body}</div>`;
  railr.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab; renderDossier(id); railr.querySelector('.body').scrollTop=0});
  railr.querySelector('#closer').onclick=()=>{cur=null; Object.values(MK).forEach(m=>m.g.classList.remove('sel')); try{history.replaceState(null,'',' ')}catch(e){} renderIntro()};
  railr.querySelector('#copy').onclick=()=>{ const u=location.href.split('#')[0]+'#'+id; const done=()=>toast(t('copied')); (navigator.clipboard?.writeText(u)||Promise.reject()).then(done).catch(()=>{ const i=document.createElement('input'); i.value=u; document.body.append(i); i.select(); try{document.execCommand('copy')}catch(e){} i.remove(); done() }) };
  railr.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(b.dataset.go,true));
  railr.querySelectorAll('.cite').forEach(a=>a.onclick=()=>{tab='sources'; renderDossier(id); const li=railr.querySelector('#s-'+CSS.escape(a.dataset.src)); if(li){li.scrollIntoView({block:'center'}); li.style.background='var(--chip)'}});
}
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1600) }

let view='map';
const GLOSS={en:[['Mawani','The Saudi Ports Authority: the government body that owns and regulates the commercial ports.'],['Terminal operator','A company that runs part of a port under a long contract (often 20–30 years), e.g. DP World or Red Sea Gateway Terminal.'],['TEU','A standard 20-foot shipping container. Port size is often measured in TEU per year.'],['MARPOL','The international treaty on pollution from ships. It requires ports to offer places where ships can offload oily waste, chemicals, sewage and garbage.'],['IMO register (GISIS)','The UN shipping agency\'s public list of which company receives ship waste at each port. Saudi Arabia keeps its own entries up to date.'],['MWAN','The National Center for Waste Management: licenses every company that collects, transports, treats or disposes of waste in Saudi Arabia.'],['NCEC','The National Center for Environmental Compliance: issues environmental permits and enforces pollution rules.'],['RCJY','The Royal Commission for Jubail and Yanbu: runs the two big industrial cities and their industrial ports.'],['Shipping agent','The local firm that handles a ship\'s paperwork in port. Under Mawani rules the agent chooses which licensed company takes the ship\'s waste.'],['Slops / sludge / bilge','Different kinds of oily waste from a ship\'s tanks and engine room. The most valuable waste stream for EH.'],['Opportunity score','EH\'s own judgement (High / Medium / Low) based on how much waste the port produces, whether EH already has a foothold, and whether a competitor is locked in.']],
 ar:[['موانئ','الهيئة العامة للموانئ: الجهة الحكومية التي تملك الموانئ التجارية وتنظّمها.'],['مشغّل المحطة','شركة تدير جزءاً من الميناء بعقد طويل (غالباً 20–30 سنة)، مثل موانئ دبي العالمية أو محطة بوابة البحر الأحمر.'],['الحاوية النمطية (TEU)','حاوية شحن قياسية بطول 20 قدماً. يُقاس حجم الميناء غالباً بعدد الحاويات النمطية سنوياً.'],['ماربول','المعاهدة الدولية لمنع التلوث من السفن. تُلزم الموانئ بتوفير أماكن تفرّغ فيها السفن نفاياتها الزيتية والكيميائية والصرف الصحي والقمامة.'],['سجل المنظمة البحرية الدولية (GISIS)','القائمة العامة لوكالة الأمم المتحدة للشحن التي تبيّن أي شركة تستقبل نفايات السفن في كل ميناء. تحدّث السعودية بياناتها بنفسها.'],['موان','المركز الوطني لإدارة النفايات: يرخّص كل شركة تجمع النفايات أو تنقلها أو تعالجها أو تتخلص منها في السعودية.'],['المركز الوطني للرقابة على الالتزام البيئي','يصدر التصاريح البيئية ويطبّق قواعد منع التلوث.'],['الهيئة الملكية للجبيل وينبع','تدير المدينتين الصناعيتين الكبيرتين وميناءيهما الصناعيين.'],['الوكيل الملاحي','الشركة المحلية التي تتولى أوراق السفينة في الميناء. بحسب قواعد موانئ، يختار الوكيل الشركة المرخّصة التي تستلم نفايات السفينة.'],['المخلفات الزيتية / الحمأة / مياه الآسن','أنواع مختلفة من النفايات الزيتية من خزانات السفينة وغرفة المحركات. أعلى تيارات النفايات قيمة لآفاق البيئة.'],['درجة الفرصة','تقدير آفاق البيئة (مرتفعة / متوسطة / منخفضة) بناءً على كمية النفايات في الميناء، ووجود موطئ قدم لها، وما إذا كان منافس راسخاً فيه.']]};
function renderCompanies(){ const v=document.getElementById('view-co'); const name=id=>{const q=P.find(x=>x.id===id); return q?L(q,'name'):id};
  v.innerHTML=`<div class="wrap"><h2>${t('coT')}</h2><p class="lead">${t('coLead')} <button class="chip" id="gomk">${t('vMk')} ↗</button></p><div class="cards">${COS.map(c=>`<article class="card"><span class="kind k-${c.kind}">${esc(lang==='ar'?c.kind_ar:c.kind_en)}</span><h3>${esc(lang==='ar'?c.name_ar:c.name_en)}</h3>
   <div class="lbl">${t('whatL')}</div><p>${esc(lang==='ar'?c.what_ar:c.what_en)}</p>
   <div class="lbl">${t('whereL')}</div><p>${esc(lang==='ar'?c.ports_ar:c.ports_en)}</p>
   <div class="lbl">${t('ehL')}</div><p class="eh">${esc(lang==='ar'?c.eh_ar:c.eh_en)}</p>
   <div class="lbl">${t('portsL')}</div><div class="ports">${c.ports.map(id=>`<button class="chip" data-port="${id}">${esc(name(id))}</button>`).join('')}</div>
   ${c.id!=='eh'?`<div style="font-size:11.5px;color:var(--muted)">${c.in_map?'✓ '+t('inMapL'):'○ '+t('notInMap')}</div>`:''}</article>`).join('')}</div></div>`;
  v.querySelectorAll('[data-port]').forEach(b=>b.onclick=()=>{ setView('map'); open(b.dataset.port,true) }); v.querySelector('#gomk').onclick=()=>setView('mk') }
function renderGuide(){ const v=document.getElementById('view-guide');
  v.innerHTML=`<div class="wrap"><h2>${t('gT')}</h2><p class="lead">${t('gLead')}</p>
   <h3 style="font-size:15px;margin-bottom:8px">${t('gShapes')}</h3><div class="legend-inline"><div class="row">${TI.replace('currentColor','var(--fg)')}<span>${t('t1')}</span></div><div class="row">${TD.replace('currentColor','var(--fg)')}<span>${t('t2')}</span></div><div class="row">${TO.replace('currentColor','var(--fg)')}<span>${t('t3')}</span></div><div class="row"><i class="sw" style="background:var(--green)"></i><span>${t('opp')}: ${t('High')}</span></div><div class="row"><i class="sw" style="background:var(--blue)"></i><span>${t('opp')}: ${t('Medium')}</span></div><div class="row"><i class="sw" style="background:var(--grey)"></i><span>${t('opp')}: ${t('Low')}</span></div></div>
   <h3 style="font-size:15px;margin-bottom:8px">${t('gSteps')}</h3><ol class="steps"><li>${t('s1')}</li><li>${t('s2')}</li><li>${t('s3')}</li><li>${t('s4')}</li><li>${t('s5')}</li></ol>
   <h3 style="font-size:15px;margin:22px 0 8px">${t('gWords')}</h3><dl class="gloss">${GLOSS[lang].map(([k,d])=>`<div><dt>${esc(k)}</dt><dd>${esc(d)}</dd></div>`).join('')}</dl></div>` }
const MKF={prov:null,coast:null,ehOnly:false,sort:['port',1],cport:null};
function pvChip(p){ return `<span class="pv ${p}">${p}</span>` }
function ehChip(k){ return k==='yes'?`<span class="pv EH">EH</span>`:k==='nonhaz'?`<span class="pv eh-nonhaz">EH*</span>`:k==='check'?`<span class="pv eh-check">?</span>`:`<span class="pv none">—</span>` }
function cmpTable(recs){ if(!recs||!recs.length) return `<div class="note">${t('cNone')}</div>`; return `<div class="tblwrap"><table class="tbl"><tr><th>${t('cWhen2')}</th><th>${t('portCol')}</th><th>${t('cWaste')}</th><th>${t('cProb')}</th><th>${t('cCmt')}</th><th>${t('cResp')}</th></tr>${recs.map(r=>`<tr><td class="num" style="white-space:nowrap">${r.occurred}<br><span style="color:var(--muted);font-size:11px">${esc(r.flag)}</span></td><td>${esc(r.port)}</td><td style="font-size:12px">${esc(r.waste)}</td><td><span class="pill ${r.problem_code==='A'?'lost':r.problem_code==='F'?'pending':''}">${esc(lang==='ar'?r.problem_ar:r.problem_en)}</span></td><td style="font-size:12px">${esc(r.comment||'—')}</td><td style="font-size:11.5px;color:var(--muted)">${esc(r.outcome)}<br>${r.response_date}</td></tr>`).join('')}</table></div>` }
function renderMarket(){ const v=document.getElementById('view-mk'); const M=MKT; const P4=['AH','AFZ','GEMS','EST']; const nm=(o)=>lang==='ar'?o.name_ar:o.name_en;

   ${[[t('cPorts'),p=>M.providers[p].n_ports,'0'],[t('cCoasts'),p=>M.providers[p].coasts.map(c=>t(c)).join(' · '),t('red')+' · '+t('gulf')],[t('cEntries'),p=>M.providers[p].entries,'—'],[t('cKinds'),p=>M.providers[p].n_cats+' / 24',ehSure+' / 24'],[t('cTon'),p=>fmtC(M.providers[p].addressable_tonnes),'—'],[t('cSole'),p=>M.providers[p].sole_ports.length,'—'],[t('cComp'),p=>M.providers[p].complaint_ports.length,'—'],[t('cHow'),p=>M.providers[p].ftypes.map(f=>/Tr/.test(f)?t('truck'):t('other')).join(', '),t('ehv')],[t('cWhen'),p=>M.providers[p].avail[0]?t('bh'):t('unk'),t('unk')],[t('cNotice'),p=>M.providers[p].notice[0]?M.providers[p].notice[0]+' h':t('unk'),'—'],[t('cCharge'),p=>M.providers[p].charging[0]||t('unk'),'—'],[t('cCap'),p=>M.providers[p].maxq[0]?fmt(+M.providers[p].maxq[0])+' m³':t('unk'),'1,500 m³/day'],[t('cContact'),p=>M.providers[p].email,'emd@eh.net.sa']].map(([l,f,e])=>`<tr><td>${l}</td>${P4.map(p=>`<td>${esc(String(f(p)))}</td>`).join('')}<td class="ehc">${esc(String(e))}</td></tr>`).join('')}</table></div>`;
  // matrix
  const locs=M.locs.filter(l=>!MKF.coast||l.coast===MKF.coast); const red=locs.filter(l=>l.coast==='red'), gulf=locs.filter(l=>l.coast==='gulf');
  const head=`<tr><th class="coast"></th>${red.length?`<th class="coast" colspan="${red.length}">${t('red')}</th>`:''}${gulf.length?`<th class="coast" colspan="${gulf.length}">${t('gulf')}</th>`:''}<th class="coast ehc" rowspan="2">${pvChip('EH')}<br><span style="font-weight:400">${t('ehCan')}</span></th></tr><tr><th>${t('kindCol')}</th>${locs.map(l=>`<th class="${l.complaints?'warnp':''}" title="${esc(nm(l))}"><button class="chip" data-port="${l.port_id}" style="font-size:11px;padding:2px 7px">${esc(nm(l).replace(/ Port|ميناء /,'').slice(0,22))}</button>${l.n_complaints?`<br><span title="${t('cmpPort')}">⚠ ${l.n_complaints}</span>`:''}</th>`).join('')}</tr>`;
  let body=''; let grp='';
  M.matrix.forEach(r=>{ if(MKF.ehOnly&&r.eh==='no') return; const show=!MKF.prov||locs.some(l=>r.cells[l.loc].includes(MKF.prov)); if(r.group!==grp){grp=r.group; body+=`<tr class="grp"><td colspan="${locs.length+2}">${esc(lang==='ar'?M.groups[grp][1]:M.groups[grp][0])}</td></tr>`}
    body+=`<tr class="${show?'':'dim'}"><td class="cat" title="${esc(r.eh_note)}">${esc(nm(r))}</td>${locs.map(l=>{const ps=r.cells[l.loc]; return `<td class="${l.complaints?'warnp':''}">${ps.length?ps.filter(p=>!MKF.prov||p===MKF.prov).map(pvChip).join(''):'<span class="pv none">—</span>'}</td>`}).join('')}<td class="ehc">${ehChip(r.eh)}</td></tr>` });
  const flt=`<div class="flt"><span class="lbl">${t('provCol')}:</span>${P4.map(p=>`<button class="chip" data-f="prov" data-v="${p}" aria-pressed="${MKF.prov===p}">${esc(nm(M.providers[p]))}</button>`).join('')}<span class="lbl" style="margin-inline-start:10px">${t('coast')}:</span><button class="chip" data-f="coast" data-v="red" aria-pressed="${MKF.coast==='red'}">${t('red')}</button><button class="chip" data-f="coast" data-v="gulf" aria-pressed="${MKF.coast==='gulf'}">${t('gulf')}</button><button class="chip" data-f="eh" aria-pressed="${MKF.ehOnly}" style="margin-inline-start:10px">${t('showGaps')}</button></div>
   <div class="legend-inline" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:6px 0 10px;font-size:12px">${P4.map(p=>`<div class="row">${pvChip(p)}<span>${esc(nm(M.providers[p]))}</span></div>`).join('')}<div class="row">${ehChip('yes')}<span>${t('ehCan')}</span></div><div class="row">${ehChip('nonhaz')}<span>${t('ehNon')}</span></div><div class="row">${ehChip('check')}<span>${t('ehChk')}</span></div><div class="row">${ehChip('no')}<span>${t('ehNo')}</span></div></div>`;

  // compare
  const cmp=`<div class="tblwrap"><table class="tbl cmp"><tr><th></th><th>${pvChip('AH')}</th><th>${pvChip('AFZ')}</th><th>${pvChip('GEMS')}</th><th>${pvChip('EST')}</th><th class="ehc">${pvChip('EH')}</th></tr>
   <tr><td>${t('lic')}</td><td>24</td><td>24</td><td>19</td><td>5</td><td class="ehc">${ehSure} (+${ehCan-ehSure} ${t('ehChk')})</td></tr>
   <tr><td>${t('site')}</td><td>${t('unk')}</td><td>${t('unk')}</td><td>${t('yes')} (Jeddah in-port, Reviva)</td><td>${t('unk')}</td><td class="ehc">${t('ehs')}</td></tr>
   <tr><td>${t('fleet')}</td><td>${t('truck')}</td><td>${t('truck')}</td><td>${t('other')}</td><td>${t('other')}</td><td class="ehc">${t('ehv')}</td></tr>
   <tr><td>${t('geo')}</td><td>${M.providers.AH.n_ports} (${t('red')})</td><td>${M.providers.AFZ.n_ports} (${t('gulf')})</td><td>${M.providers.GEMS.n_ports}</td><td>1</td><td class="ehc">${t('ehg')}</td></tr>
   <tr><td>${t('serv')}</td><td>${t('bh')}, 48 h</td><td>${t('bh')}, 48 h</td><td>${t('unk')}</td><td>${t('unk')}</td><td class="ehc">${t('unk')}</td></tr>
   <tr><td>${t('imo')}</td><td>${t('yes')}</td><td>${t('yes')}</td><td>${t('yes')}</td><td>${t('yes')}</td><td class="ehc"><b style="color:var(--bad)">${t('ehi')}</b></td></tr>
   <tr><td>${t('cComp')}</td><td>${M.providers.AH.complaint_ports.length}</td><td>${M.providers.AFZ.complaint_ports.length}</td><td>0</td><td>0</td><td class="ehc">—</td></tr></table></div>`;
  // gaps
  const soleKinds=(coast)=>{const ls=M.locs.filter(l=>l.coast===coast).map(l=>l.loc); return M.matrix.filter(r=>{const ps=new Set(); ls.forEach(l=>r.cells[l].forEach(p=>ps.add(p))); return ps.size===1}).length};
  const gaps=`<ul class="gaps" style="padding-inline-start:16px;font-size:13px"><li><b>${t('g1')}:</b> ${M.no_receiver.map(x=>esc(x.port.replace(', Saudi Arabia',''))).join(' · ')}</li><li><b>${t('g2')}:</b> ${t('red')} ${soleKinds('red')} / 24 · ${t('gulf')} ${soleKinds('gulf')} / 24</li><li><b>${t('g3')}:</b> ${[...new Set(M.complaints.map(r=>r.loc))].map(l=>esc(M.complaints.find(r=>r.loc===l).port)+' ('+M.complaints.filter(r=>r.loc===l).length+')').join(' · ')}</li></ul>`;
  // full table
  const [sk,sd]=MKF.sort; const rows=[...M.rows].sort((a,b)=>{const ka={port:a.port,cat:a.cat,p:a.p,ftype:a.ftype,notice:a.notice}[sk]||'', kb={port:b.port,cat:b.cat,p:b.p,ftype:b.ftype,notice:b.notice}[sk]||''; return (ka>kb?1:ka<kb?-1:0)*sd});

  const gloss=`<details class="tblx"><summary>${t('mk7')}</summary><dl class="gloss" style="margin-top:8px">${M.matrix.map(r=>`<div><dt>${esc(nm(r))} ${ehChip(r.eh)}</dt><dd>${esc(r.cat)} — ${esc(r.eh_note)}</dd></div>`).join('')}</dl></details>`;

  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ const f=b.dataset.f; if(f==='prov') MKF.prov=MKF.prov===b.dataset.v?null:b.dataset.v; else if(f==='coast') MKF.coast=MKF.coast===b.dataset.v?null:b.dataset.v; else MKF.ehOnly=!MKF.ehOnly; const y=v.scrollTop; renderMarket(); v.scrollTop=y });

function setView(vw){ view=vw; const map=vw==='map'; document.getElementById('view-co').hidden=vw!=='co'; document.getElementById('view-guide').hidden=vw!=='guide'; document.getElementById('view-mk').hidden=vw!=='mk';
  ['raill','railr','legend'].forEach(id=>document.getElementById(id).hidden=!map); document.querySelector('.zoom').hidden=!map; document.getElementById('kpis').hidden=!map;
  ['map','co','guide','mk'].forEach(k=>document.getElementById('v-'+k).setAttribute('aria-pressed',String(vw===k))); setTop(); if(vw==='co') renderCompanies(); if(vw==='guide') renderGuide(); if(vw==='mk') renderMarket() }
document.getElementById('v-map').onclick=()=>setView('map'); document.getElementById('v-co').onclick=()=>setView('co'); document.getElementById('v-guide').onclick=()=>setView('guide'); document.getElementById('v-mk').onclick=()=>setView('mk');

/* ---------- language, rail toggle, boot ---------- */
document.getElementById('lang-en').onclick=()=>{lang='en'; try{localStorage.setItem('spim-lang','en')}catch(e){} render()};
document.getElementById('lang-ar').onclick=()=>{lang='ar'; try{localStorage.setItem('spim-lang','ar')}catch(e){} render()};
document.getElementById('togl').onclick=e=>{ const b=document.getElementById('railbody'); b.hidden=!b.hidden; e.target.textContent=b.hidden?'+':'–' };
fit(); render(); addEventListener('resize',scaleUI);
/* EH hub bridge: follow the hub's language and theme buttons */
addEventListener('message',e=>{ const d=e.data||{}; if(!d.ehhub) return;
  if(d.ehhub==='lang'&&(d.lang==='ar'||d.lang==='en')&&d.lang!==lang){ lang=d.lang; try{localStorage.setItem('spim-lang',lang)}catch(_){} render() }
  if(d.ehhub==='theme'&&(d.theme==='dark'||d.theme==='light')) document.documentElement.dataset.theme=d.theme });
const h=(location.hash||'').slice(1); if(h&&P.some(p=>p.id===h)) open(h,true);
})();
</script>
