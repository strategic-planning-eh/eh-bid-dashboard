# Rebuilds the EH Bid dashboard every hour from the live bid files and publishes
# the full Strategic Intelligence Hub (bids + stakeholder map + client bubbles).
name: Update Bid Dashboard

on:
  schedule:
    - cron: '0 * * * *'        # every hour, on the hour (UTC)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Write the robot key from the secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > pipeline/service_account.json

      - name: Rebuild the dashboard
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          SHEET_ID_2025: ${{ vars.SHEET_ID_2025 }}
          SHEET_ID_2026: ${{ vars.SHEET_ID_2026 }}
        run: python pipeline/run_pipeline.py

      - name: Prepare the published site (hub + all three apps)
        run: |
          mkdir -p site
          cp hub/EH_Hub.html site/index.html
          cp pipeline/EH_Bid_Analysis.html site/EH_Bid_Analysis_CURRENT.html
          cp hub/EH_Stakeholder_Map_CURRENT.html site/
          cp hub/EH_Client_Bubble_Map_CURRENT.html site/
          cp hub/vision2030_dashboard.html site/ 2>/dev/null || true
          cp hub/saudi_fiscal_monitor_2026.html site/ 2>/dev/null || true
          cp hub/eh_news_intelligence.html site/ 2>/dev/null || true
          cp hub/pif_intelligence_hub.html site/ 2>/dev/null || true
          cp -r hub/vendor site/vendor 2>/dev/null || true
          echo "{\"built\":\"$(TZ='Asia/Riyadh' date +'%d %b %Y, %H:%M (KSA)')\"}" > site/build_info.json
      - name: Detect changes, update changelog, notify
        working-directory: pipeline
        env:
          SITE_URL: https://strategic-planning-eh.github.io/eh-bid-dashboard
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python notify_and_log.py || true
          cp state.json ../site/state.json 2>/dev/null || true
          cp changelog.json ../site/changelog.json 2>/dev/null || true

      - name: Package the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
